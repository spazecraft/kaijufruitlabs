<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- KAIJU FRUIT (the game) forwarder. The printed QR code points here and never changes.
     It opens the newest vetted version below. If that file is not uploaded yet,
     it shows "landing soon" instead of an older version.
     To publish a new version: add its file name to the front of the NEWEST list, then upload. -->
<title>KAIJU FRUIT (the game)</title>
<style>
  :root{--bg:#14102e;--card:#1f1846;--edge:rgba(255,255,255,.18);--acc:#ffd166;--acc2:#7ef0c9}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#fff;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px;text-align:center}
  .box{max-width:460px;background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:24px 18px}
  h1{margin:0 0 10px;font-size:30px;font-weight:900;line-height:1.05}
  p{margin:0 0 12px;font-size:16px;line-height:1.5}
  a{color:var(--acc2);font-weight:800}
  .hl{color:var(--acc)}
</style>
</head>
<body>
<div class="box" id="box">
  <p id="status">Opening KAIJU FRUIT...</p>
</div>
<script>
/* Opens the newest vetted version that exists, checked in this order. Never the old v1-2. */
const NEWEST = ["kaiju-fruit-v1-4.html","kaiju-fruit-v1.4.html","kaiju-fruit-v1-3.html","kaiju-fruit-v1.3.html"];
(async function(){
  for(const f of NEWEST){
    try{ const r = await fetch(f, {method:"HEAD", cache:"no-store"}); if(r.ok){ location.replace(f); return; } }catch(e){}
  }
  soon();
})();
function soon(){
  document.getElementById("box").innerHTML =
    '<h1>KAIJU FRUIT<br><span class="hl">the game</span></h1>' +
    '<p>The new version is landing soon, with every fruit fact checked against real sources.</p>' +
    '<p>Scan this code again soon, or get a heads up when it drops: ' +
    '<a href="mailto:kaijufruitcode@gmail.com">kaijufruitcode@gmail.com</a></p>' +
    '<p><a href="infopillz.html">Explore INFOPILLZ in the meantime</a></p>';
}
</script>
</body>
</html>
