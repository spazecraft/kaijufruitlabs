<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CRE8TIV OSCILLOscOPE — KAIJU FRUIT LABS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  .chassis {
    background: linear-gradient(145deg, #2a2a2a, #111, #1a1a1a);
    border-radius: 18px;
    padding: 20px 20px 14px;
    box-shadow:
      0 0 0 2px #444,
      0 0 0 4px #222,
      0 8px 40px rgba(0,0,0,0.9),
      inset 0 1px 0 #555;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 680px;
    width: 95vw;
    transition: all 0.3s ease;
  }

  body.fullscreen {
    background: #000;
    justify-content: flex-start;
  }

  body.fullscreen .chassis {
    background: transparent;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    max-width: 100vw;
    width: 100vw;
    gap: 0;
  }

  body.fullscreen .brand-bar,
  body.fullscreen .controls,
  body.fullscreen .mode-section,
  body.fullscreen .footer-text { display: none; }

  body.fullscreen .bezel {
    border-radius: 0; padding: 0; box-shadow: none;
  }

  body.fullscreen .screen {
    border-radius: 0;
    aspect-ratio: unset;
    height: 100vh;
    width: 100vw;
  }

  body.fullscreen .screen::before,
  body.fullscreen .screen::after { display: none; }
  body.fullscreen canvas { border-radius: 0; }

  .brand-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 4px;
  }

  .brand-name {
    font-family: 'VT323', monospace;
    color: #39ff14;
    font-size: 20px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #39ff14, 0 0 20px #39ff14aa;
  }

  .brand-right {
    display: flex; align-items: center; gap: 10px;
  }

  .model-tag { font-size: 9px; color: #555; letter-spacing: 2px; }

  .fs-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid #39ff1455;
    background: #001400; color: #39ff1499;
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap; flex-shrink: 0;
  }

  .fs-btn:hover { border-color: #39ff14; color: #39ff14; }

  .bezel {
    background: #0a0a0a;
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8),
      0 0 0 2px #333, 0 0 0 4px #1a1a1a;
    width: 100%;
  }

  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }

  .screen::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,0,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,0,0.02) 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: 2; pointer-events: none;
  }

  .screen::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px
    );
    z-index: 3; pointer-events: none; border-radius: 6px;
  }

  canvas { display: block; width: 100%; height: 100%; border-radius: 6px; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    z-index: 4; pointer-events: none; border-radius: 6px;
  }

  .status-wrap {
    position: absolute; top: 8px; right: 10px;
    z-index: 6;
    display: flex; align-items: center; gap: 5px;
  }

  .status-label {
    font-size: 8px; color: rgba(57,255,20,0.35);
    letter-spacing: 1px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: #333; transition: all 0.3s;
  }

  .status-dot.active {
    background: #39ff14;
    box-shadow: 0 0 5px #39ff14, 0 0 10px #39ff14;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Crosshair button — no glow, clean toggle */
  .cross-btn {
    position: absolute; bottom: 8px; right: 10px;
    z-index: 6;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; padding: 2px 5px; border-radius: 3px;
    border: 1px solid #222; background: transparent;
    color: #333; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }

  .cross-btn.on {
    border-color: #39ff1444;
    color: #39ff1466;
    /* NO glow — clean when on, invisible when off */
  }

  .exit-fs-btn {
    position: absolute; top: 10px; right: 12px;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 1px;
    padding: 4px 8px; border-radius: 4px;
    border: 1px solid #39ff1455;
    background: rgba(0,0,0,0.6); color: #39ff1488;
    cursor: pointer; transition: all 0.2s;
    display: none;
  }

  body.fullscreen .exit-fs-btn { display: block; }

  /* ── MODE SECTION ── */
  .mode-section {
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
    width: 100%;
  }

  .mode-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

  .mode-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 7px; letter-spacing: 1px;
    padding: 4px 7px; border-radius: 4px;
    border: 1px solid #333; background: #111;
    color: #fff; cursor: pointer; transition: all 0.2s;
  }

  .mode-btn.active {
    border-color: #39ff14; color: #39ff14;
    background: #001400; box-shadow: 0 0 6px #39ff1444;
  }

  .sub-btns {
    display: flex; gap: 4px;
    justify-content: center; min-height: 20px;
    transition: opacity 0.2s;
  }

  .sub-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 7px; letter-spacing: 1px;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid #333; background: #0a0a0a;
    color: #fff; cursor: pointer; transition: all 0.2s;
  }

  .sub-btn.active { border-color: #39ff14; color: #39ff14; background: #001a00; }

  .hud-bar {
    display: flex; gap: 16px;
    justify-content: center; padding: 2px 0;
  }

  .hud-item {
    font-size: 9px; color: rgba(57,255,20,0.45);
    letter-spacing: 1px; text-shadow: 0 0 4px #39ff14;
  }

  .hud-item span { color: rgba(57,255,20,0.85); }

  /* ── CONTROLS ── */
  .controls {
    display: flex; align-items: center;
    justify-content: space-between;
    width: 100%; padding: 0 2px;
    gap: 8px; flex-wrap: wrap;
  }

  .knob-group { display: flex; align-items: center; gap: 8px; }
  .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }

  input[type=range] {
    -webkit-appearance: none;
    width: 60px; height: 6px;
    background: #111; border-radius: 3px;
    outline: none; border: 1px solid #333; cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #5f5, #1a1a1a);
    border: 1px solid #39ff14;
    box-shadow: 0 0 4px #39ff14aa;
    cursor: pointer;
  }

  #colorCtrl {
    background: linear-gradient(to right,
      hsl(120,100%,45%), hsl(180,100%,45%), hsl(240,100%,55%),
      hsl(300,100%,55%), hsl(0,100%,50%), hsl(60,100%,45%), hsl(120,100%,45%)
    );
    border: 1px solid #444;
  }

  #colorCtrl::-webkit-slider-thumb {
    background: #ddd; border: 2px solid #222;
  }

  .knob-label { font-size: 7px; color: #fff; letter-spacing: 1px; text-align: center; }

  .right-controls {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  .start-btn {
    font-family: 'VT323', monospace;
    font-size: 17px; letter-spacing: 2px; padding: 6px 14px;
    background: #001a00; color: #39ff14;
    border: 1px solid #39ff14; border-radius: 6px; cursor: pointer;
    box-shadow: 0 0 8px #39ff1422, inset 0 0 10px #39ff1411;
    transition: all 0.2s; white-space: nowrap;
  }

  .start-btn:active { transform: scale(0.96); }

  .bpm-row { display: flex; align-items: center; gap: 6px; }

  .tap-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; letter-spacing: 1px; padding: 4px 9px; border-radius: 4px;
    border: 1px solid #39ff1455; background: #001400;
    color: #fff; cursor: pointer; transition: all 0.1s;
  }

  .tap-btn:active {
    background: #003300; border-color: #39ff14; color: #39ff14;
    box-shadow: 0 0 8px #39ff1466; transform: scale(0.94);
  }

  .bpm-display {
    font-size: 9px; color: rgba(57,255,20,0.7);
    letter-spacing: 1px; min-width: 52px; text-align: center;
  }

  .footer-text { font-size: 9px; color: #222; letter-spacing: 3px; padding-top: 2px; }

  /* ── RECORD ── */
  .rec-controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .rec-btn {
    font-family: 'VT323', monospace;
    font-size: 17px; letter-spacing: 2px; padding: 6px 14px;
    background: #001a1a; color: #4ee8e0;
    border: 1px solid #4ee8e0; border-radius: 6px; cursor: pointer;
    box-shadow: 0 0 8px #4ee8e022, inset 0 0 10px #4ee8e011;
    transition: all 0.2s; white-space: nowrap;
  }
  .rec-btn.recording {
    background: #1a0000; color: #ff2020; border-color: #ff2020;
    box-shadow: 0 0 12px #ff202066, inset 0 0 10px #ff202022;
    animation: recPulse 1s ease-in-out infinite;
  }
  @keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
  .rec-btn:active { transform: scale(0.96); }
  .rec-timer { font-size: 9px; color: rgba(255,60,60,0.7); letter-spacing: 1px; min-width: 40px; text-align: center; }

  .fade-btn {
    font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 4px; border: 1px solid #666;
    background: #0a0a0a; color: #999; cursor: pointer;
  }
  .fade-btn.active { background: #1a1a1a; color: #fff; border-color: #fff; }

  /* ── PILL ROW ── */
  .pill-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; padding: 2px 0; touch-action: none; }
  .loop-pill {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
    transition: box-shadow 0.2s, transform 0.15s;
    position: relative; touch-action: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .loop-pill.empty { opacity: 0.28; }
  .loop-pill.filled { opacity: 1; }
  .loop-pill.pulsing { animation: pillPulse 1.1s ease-in-out infinite; }
  @keyframes pillPulse { 0%,100%{box-shadow:0 0 4px currentColor} 50%{box-shadow:0 0 16px currentColor} }
  .loop-pill.active {
    background: #39ff14 !important;
    box-shadow: 0 0 12px #39ff14, 0 0 22px #39ff1488;
  }
  .loop-pill:active { transform: scale(0.9); }

  /* ── CONTEXTUAL PILL MENU ── */
  .pill-menu {
    display: none; position: fixed; z-index: 50;
    background: rgba(4,6,4,0.95); border: 1px solid #39ff1455; border-radius: 8px;
    padding: 10px 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.8);
    min-width: 190px;
  }
  .pill-menu.open { display: block; }
  .pill-menu-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .pill-menu-row label { font-size: 8px; color: #aaa; letter-spacing: 1px; width: 50px; flex-shrink: 0; }
  .pill-menu-row input[type=range] { flex: 1; }
  .pill-menu-gap { height: 10px; border-top: 1px solid #ffffff11; margin: 2px 0; }
  .pill-menu-dl {
    width: 100%; margin-top: 8px; padding: 5px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1px;
    background: #001400; color: #39ff14; border: 1px solid #39ff1455; cursor: pointer;
  }
  .pill-menu-rand {
    width: 100%; margin-top: 6px; padding: 5px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1px;
    background: #1a0022; color: #e07bff; border: 1px solid #e07bff55; cursor: pointer;
  }
  .pill-menu-delete {
    width: 100%; margin-top: 6px; padding: 5px; border-radius: 4px;
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1px;
    background: #220000; color: #ff5555; border: 1px solid #ff555555; cursor: pointer;
  }

  .auto-row { display: flex; gap: 6px; justify-content: center; padding: 2px 0; }
  .auto-btn {
    font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: 1px;
    padding: 5px 10px; border-radius: 4px; border: 1px solid #55555599;
    background: #0a0a0a; color: #888; cursor: pointer; transition: all 0.15s;
  }
  .auto-btn.on {
    background: #1a0022; color: #e07bff; border-color: #e07bff;
    box-shadow: 0 0 8px #e07bff55;
    animation: pillPulse 1.6s ease-in-out infinite;
  }
  .pill-menu-close {
    position: absolute; top: 4px; right: 6px; color: #666; font-size: 12px; cursor: pointer;
  }

  .save-fallback {
    display: none; position: fixed; z-index: 70;
    left: 50%; bottom: 26px; transform: translateX(-50%);
  }
  .save-fallback.open { display: block; }
  .save-fallback .pill-menu-dl {
    padding: 10px 20px; font-size: 11px;
    box-shadow: 0 0 16px #39ff1455, 0 4px 20px rgba(0,0,0,0.8);
    animation: pillPulse 1.2s ease-in-out infinite;
  }

  /* ── GESTURE FEEDBACK RING (canvas + empty pills) ── */
  .gesture-ring {
    position: fixed; z-index: 60; pointer-events: none;
    border-radius: 50%; border: 1px solid rgba(57,255,20,0.5);
    transform: translate(-50%,-50%);
  }
  /* ── LANDSCAPE REFLOW ── everything visible, nothing hidden, no scroll ── */
  @media (orientation: landscape) {
    body { justify-content: center; }
    .chassis {
      display: grid;
      grid-template-columns: minmax(200px, 38%) 1fr;
      grid-template-areas:
        "brand    mode"
        "bezel    controls"
        "bezel    pills"
        "bezel    auto"
        "bezel    footer";
      align-items: start;
      column-gap: 12px;
      row-gap: 4px;
      max-width: 960px;
      max-height: 96vh;
      width: 92vw;
      padding: 12px 16px 10px;
    }
    .brand-bar   { grid-area: brand; }
    .bezel       { grid-area: bezel; padding: 6px; }
    .mode-section{ grid-area: mode; }
    .controls    { grid-area: controls; }
    .pill-row    { grid-area: pills; }
    .auto-row    { grid-area: auto; }
    .footer-text { grid-area: footer; padding-top: 0; }

    .mode-section, .controls, .pill-row, .auto-row { gap: 4px; }
    .hud-bar { padding: 0; }
    .knob-group { gap: 5px; }
    input[type=range] { width: 46px; }
    .controls { padding: 0; gap: 6px; }
    .right-controls, .rec-controls { gap: 3px; }
  }
</style>
</head>
<body>

<div class="chassis">
  <div class="brand-bar">
    <div class="brand-name">CRE8TIV OSCILLOscOPE</div>
    <div class="brand-right">
      <div class="model-tag">KAIJU FRUIT LABS / SC-02</div>
      <button class="fs-btn" id="fsBtn">[ EXPAND ]</button>
    </div>
  </div>

  <div class="bezel">
    <div class="screen">
      <canvas id="scope"></canvas>
      <div class="vignette"></div>
      <div class="status-wrap">
        <span class="status-label" id="statusLabel">STANDBY</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <button class="cross-btn on" id="crossBtn">⊕</button>
      <button class="exit-fs-btn" id="exitFsBtn">[ EXIT ]</button>
    </div>
  </div>

  <div class="mode-section">
    <div class="mode-btns">
      <button class="mode-btn active" data-mode="wave">WAVE</button>
      <button class="mode-btn" data-mode="circle">CIRCLE</button>
      <button class="mode-btn" data-mode="bars">BANDS</button>
      <button class="mode-btn" data-mode="lissajous">LISSAJOUS</button>
      <button class="mode-btn" data-mode="cymatics">CYMATICS</button>
      <button class="mode-btn" data-mode="sonar">SONAR</button>
    </div>
    <div class="sub-btns" id="subBtns" style="opacity:0; pointer-events:none;"></div>
    <div class="hud-bar">
      <div class="hud-item">FREQ <span id="freqRead">---</span> Hz</div>
      <div class="hud-item">AMP <span id="ampRead">---</span></div>
      <div class="hud-item">BPM <span id="bpmHud">---</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="knob-group">
      <div class="knob-wrap">
        <input type="range" id="gainCtrl" min="1" max="5" step="0.1" value="2">
        <div class="knob-label">GAIN</div>
      </div>
      <div class="knob-wrap">
        <input type="range" id="speedCtrl" min="0.2" max="3" step="0.1" value="1">
        <div class="knob-label">SPEED</div>
      </div>
      <div class="knob-wrap">
        <input type="range" id="thickCtrl" min="1" max="10" step="0.5" value="2">
        <div class="knob-label">THICK</div>
      </div>
      <div class="knob-wrap">
        <input type="range" id="colorCtrl" min="0" max="360" step="1" value="120">
        <div class="knob-label">COLOR</div>
      </div>
    </div>

    <div class="right-controls">
      <button class="start-btn" id="startBtn">[ ACTIV8 ]</button>
      <div class="bpm-row">
        <button class="tap-btn" id="tapBtn">TAP</button>
        <div class="bpm-display" id="bpmDisplay">--- BPM</div>
      </div>
    </div>

    <div class="rec-controls">
      <button class="rec-btn" id="recBtn">[ REC ]</button>
      <div class="rec-timer" id="recTimer">00:00</div>
      <button class="fade-btn" id="fadeBtn">FADE</button>
    </div>
  </div>

  <div class="pill-row" id="pillRow"></div>

  <div class="auto-row">
    <button class="auto-btn" id="driftBtn">DRIFT</button>
    <button class="auto-btn" id="ghostHandBtn">GHOST HAND</button>
    <button class="auto-btn" id="shuffleBtn">SHUFFLE</button>
  </div>

  <div class="footer-text">SPAZECRAFT — BRONX NYC</div>
</div>

<div class="save-fallback" id="saveFallback">
  <button class="pill-menu-dl" id="saveFallbackBtn">⬇ TAP TO SAVE LOOP</button>
</div>

<div class="pill-menu" id="pillMenu">
  <span class="pill-menu-close" id="pillMenuClose">✕</span>
  <div class="pill-menu-row"><label>VOL</label><input type="range" id="pmVol" min="0" max="1" step="0.01" value="1"></div>
  <div class="pill-menu-row"><label>OPAC</label><input type="range" id="pmOpacity" min="0" max="1" step="0.01" value="1"></div>
  <div class="pill-menu-gap"></div>
  <div class="pill-menu-row"><label>PITCH</label><input type="range" id="pmPitch" min="0.15" max="1.8" step="0.01" value="1"></div>
  <div class="pill-menu-row"><label>STUTTER</label><input type="range" id="pmStutter" min="-100" max="100" step="1" value="0"></div>
  <div class="pill-menu-row"><label>REVERB</label><input type="range" id="pmReverb" min="0" max="1" step="0.01" value="0"></div>
  <div class="pill-menu-row"><label>DELAY</label><input type="range" id="pmDelay" min="0" max="1" step="0.01" value="0"></div>
  <div class="pill-menu-gap"></div>
  <div class="pill-menu-row"><label>VIBER</label><input type="range" id="pmVibrancy" min="0" max="3" step="0.01" value="1"></div>
  <div class="pill-menu-row"><label>BLEED</label><input type="range" id="pmBleed" min="0" max="1" step="0.01" value="0"></div>
  <div class="pill-menu-row"><label>SCALE</label><input type="range" id="pmScale" min="0.3" max="8" step="0.01" value="1"></div>
  <button class="pill-menu-rand" id="pmRand">🎲 RAND VISUALS</button>
  <button class="pill-menu-dl" id="pmDownload">⬇ DOWNLOAD LOOP</button>
  <button class="pill-menu-delete" id="pmDelete">🗑 DELETE LOOP</button>
</div>

<script>
// ── COLOR — canvas only ───────────────────────────────
const colorCtrl = document.getElementById('colorCtrl');
let sigR=57, sigG=255, sigB=20;

function hslToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}
function updateColor(){ [sigR,sigG,sigB]=hslToRgb(parseInt(colorCtrl.value),100,58); }
colorCtrl.addEventListener('input', updateColor);
updateColor();
function sigColor(a=1){ return `rgba(${sigR},${sigG},${sigB},${a})`; }

// ── CYMATICS PARTICLES ────────────────────────────────
function initParticles(W,H){
  particles=[];
  const cx=W/2,cy=H/2,radius=Math.min(W,H)*0.44;
  for(let i=0;i<PARTICLE_COUNT;i++){
    let rx,ry,restX,restY;
    if(cymaticsPlate==='circle'){
      const r=Math.random()*radius*0.2, a=Math.random()*Math.PI*2;
      rx=cx+Math.cos(a)*r; ry=cy+Math.sin(a)*r;
      const restA=Math.random()*Math.PI*2;
      const restR=Math.sqrt(Math.random())*radius*0.88;
      restX=cx+Math.cos(restA)*restR;
      restY=cy+Math.sin(restA)*restR;
    } else {
      rx=cx+(Math.random()-0.5)*W*0.80;
      ry=cy+(Math.random()-0.5)*H*0.80;
      restX=cx+(Math.random()-0.5)*W*0.80;
      restY=cy+(Math.random()-0.5)*H*0.80;
    }
    particles.push({
      x:rx,y:ry,
      vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,
      size:Math.random()*1.5+0.5,
      restX,restY,
      phase:Math.random()*Math.PI*2
    });
  }
}

// ── SONAR SPIKES ─────────────────────────────────
function initSonar(W,H){
  sonarSpikes=[];
  sonarBase=[];
  const cx=W/2, cy=H/2;
  const baseR=Math.min(W,H)*0.18; // pool radius
  for(let i=0;i<SONAR_SPIKES;i++){
    const angle=(i/SONAR_SPIKES)*Math.PI*2;
    sonarBase.push({ angle, baseR });
    sonarSpikes.push({
      angle,
      currentH: 0,
      targetH: 0,
      wobble: Math.random()*Math.PI*2,
      wobbleSpeed: 0.5+Math.random()*1.5
    });
  }
}

// ── TAP TEMPO ─────────────────────────────────────────
tapBtn.addEventListener('click',()=>{
  const now=Date.now();
  if(tapTimes.length>0&&now-tapTimes[tapTimes.length-1]>3000) tapTimes=[];
  tapTimes.push(now);
  if(tapTimes.length>8) tapTimes.shift();
  if(tapTimes.length<2){ bpmDisplay.textContent='TAP...'; bpmHud.textContent='---'; return; }
  let total=0;
  for(let i=1;i<tapTimes.length;i++) total+=tapTimes[i]-tapTimes[i-1];
  bpm=Math.round(60000/(total/(tapTimes.length-1)));
  bpm=Math.max(20,Math.min(300,bpm));
  bpmDisplay.textContent=bpm+' BPM';
  bpmHud.textContent=bpm;
});

// ── ACTIV8 ────────────────────────────────────────────
startBtn.addEventListener('click',async()=>{
  if(!running){
    try{
      const firstSession=!audioCtx;
      if(firstSession) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      else if(audioCtx.state==='suspended') await audioCtx.resume();
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
      micStream=stream;
      source=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=2048;
      analyser.smoothingTimeConstant=0.80;
      bufferLength=analyser.frequencyBinCount;
      dataArray=new Uint8Array(bufferLength);
      freqData =new Uint8Array(bufferLength);
      source.connect(analyser);
      running=true;
      statusDot.classList.add('active');
      statusLabel.textContent='LIVE';
      startBtn.textContent='[ STOP ]';
      // The effects engine and loop-audio routing only get built ONCE —
      // createMediaElementSource can only ever bind each loop player a
      // single time for the life of the page, so rebuilding this every
      // session was silently failing (and getting swallowed by a
      // try/catch) on every restart after the first.
      if(firstSession){ initDisruptEngine(); initLoopAudioGraph(); }
      else reconnectMicToEngine();
      draw();
    }catch(e){ startBtn.textContent='[ DENIED ]'; }
  } else {
    running=false;
    if(recActive) stopRecording();
    stopAutoEngines();
    cancelAnimationFrame(animId);
    if(source){ try{ source.disconnect(); }catch(e){} }
    if(micStream) micStream.getTracks().forEach(t=>t.stop());
    micStream=null;
    // Suspend rather than close — closing would permanently kill the
    // shared effects graph (drone/ghost/sweep/crush/reverb/delay/loop
    // routing), and closing it out from under an in-flight recording
    // was also racing the recorder's async stop/flush.
    if(audioCtx) audioCtx.suspend();
    statusDot.classList.remove('active');
    statusLabel.textContent='STANDBY';
    startBtn.textContent='[ ACTIV8 ]';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    freqRead.textContent='---'; ampRead.textContent='---';
  }
});

// ── FREQUENCY DETECTION — improved ───────────────────
// Uses autocorrelation for more accurate fundamental detection
function getDomFreq(){
  // Primary: find peak in lower frequency bins (80Hz-4kHz sweet spot)
  // Bin resolution = sampleRate / fftSize
  const binHz = audioCtx.sampleRate / analyser.fftSize;
  const loIdx = Math.floor(80  / binHz);
  const hiIdx = Math.floor(4000/ binHz);
  let maxVal=0, maxIdx=loIdx;
  for(let i=loIdx;i<Math.min(hiIdx,bufferLength);i++){
    if(freqData[i]>maxVal){ maxVal=freqData[i]; maxIdx=i; }
  }
  // Parabolic interpolation for sub-bin accuracy
  const prev=freqData[maxIdx-1]||0;
  const next=freqData[maxIdx+1]||0;
  const denom=(prev-2*maxVal+next);
  const delta= denom!==0 ? 0.5*(prev-next)/denom : 0;
  return Math.round((maxIdx+delta)*binHz);
}

function getAvgAmp(){
  let sum=0;
  for(let i=0;i<bufferLength;i++) sum+=Math.abs(dataArray[i]-128);
  return sum/bufferLength;
}

// ── DRAW LOOP ─────────────────────────────────────────
function draw(){
  animId=requestAnimationFrame(draw);
  const W=canvas.width, H=canvas.height;

  if(activePills.size>0){ drawLoopComposite(W,H); return; }

  const gain =parseFloat(gainCtrl.value);
  const thick=parseFloat(thickCtrl.value);
  const speed=parseFloat(speedCtrl.value);

  analyser.getByteTimeDomainData(dataArray);
  analyser.getByteFrequencyData(freqData);

  const avgAmp =getAvgAmp();
  const normAmp=Math.min(1,avgAmp/35);

  frameCount++;
  if(frameCount%12===0){
    freqRead.textContent=getDomFreq();
    ampRead.textContent =avgAmp.toFixed(1);
  }

  const fadeAmt = (mode==='cymatics'||mode==='sonar')
    ? `rgba(0,0,0,${0.08+(1-normAmp)*0.12})`
    : 'rgba(0,0,0,0.22)';
  ctx.fillStyle=fadeAmt;
  ctx.fillRect(0,0,W,H);

  ctx.shadowBlur =6+normAmp*18;
  ctx.shadowColor=sigColor(0.4+normAmp*0.5);
  ctx.strokeStyle=sigColor(0.65+normAmp*0.35);
  ctx.lineWidth  =thick+normAmp*1.2;
  ctx.lineCap='round'; ctx.lineJoin='round';

  ctx.save();
  if(disrupt.drone>0.01){
    ctx.filter=`hue-rotate(${(disrupt.drone*360)|0}deg) blur(${(disrupt.drone*1.4).toFixed(2)}px)`;
  }
  if     (mode==='wave')       drawWave(W,H,gain);
  else if(mode==='circle')     drawCircle(W,H,gain);
  else if(mode==='bars')       drawBars(W,H,gain,normAmp);
  else if(mode==='lissajous')  drawLissajous(W,H,gain,normAmp,speed);
  else if(mode==='cymatics')   drawCymatics(W,H,gain,normAmp,speed,avgAmp);
  else if(mode==='sonar') drawSonar(W,H,normAmp,speed,thick);
  ctx.restore();

  applyDisruptors(W,H);

  if(showCrosshair){
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(57,255,20,0.05)';
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.moveTo(W/2,0); ctx.lineTo(W/2,H);
    ctx.moveTo(0,H/2); ctx.lineTo(W,H/2);
    ctx.stroke();
  }
  drawMasterFadeOverlay(W,H);
}

// ── WAVE ──────────────────────────────────────────────
function drawWave(W,H,gain){
  const slice=W/bufferLength;
  ctx.beginPath();
  for(let i=0;i<bufferLength;i++){
    const v=((dataArray[i]/128.0)-1)*gain;
    i===0?ctx.moveTo(i*slice,H/2+v*(H/2-10)):ctx.lineTo(i*slice,H/2+v*(H/2-10));
  }
  ctx.stroke();
}

// ── CIRCLE ────────────────────────────────────────────
function drawCircle(W,H,gain){
  const cx=W/2,cy=H/2,baseR=Math.min(W,H)*0.3;
  ctx.beginPath();
  for(let i=0;i<bufferLength;i++){
    const v=((dataArray[i]/128.0)-1)*gain;
    const angle=(i/bufferLength)*Math.PI*2-Math.PI/2;
    const r=baseR+v*baseR*0.6;
    i===0?ctx.moveTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r)
         :ctx.lineTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);
  }
  ctx.closePath(); ctx.stroke();
}

// ── BARS — log-scale spectrum, fixed-zone VU coloring ──
function drawBars(W,H,gain,normAmp){
  const barCount=64;
  const barW=(W/barCount)*0.7, gap=(W/barCount)*0.3;
  const maxBarH=H-20;

  // Fixed-zone vertical gradient in canvas space: bottom is always
  // green, mid band is always yellow, top is always red — a bar's
  // color depends on WHERE on the bar it is, not how loud that bar
  // is overall. Short bars only ever show green. Tall bars climb
  // through green into yellow into red, same as a real VU meter.
  // The three band colors morph together with the COLOR slider instead of
  // being fixed to green/yellow/red — same relative spacing as a classic
  // VU meter (bottom hue, mid 60° below it, top 120° below it), but the
  // whole trio rotates as you move the slider, same as every other engine.
  const baseHue=parseInt(colorCtrl.value);
  const hueWrap=h=>((h%360)+360)%360;
  const [bR,bG,bB]=hslToRgb(hueWrap(baseHue),100,55);
  const [mR,mG,mB]=hslToRgb(hueWrap(baseHue-60),100,55);
  const [tR,tG,tB]=hslToRgb(hueWrap(baseHue-120),100,58);
  const grad=ctx.createLinearGradient(0,H,0,H-maxBarH);
  grad.addColorStop(0,    `rgba(${bR},${bG},${bB},0.9)`);
  grad.addColorStop(0.55, `rgba(${bR},${bG},${bB},0.9)`);
  grad.addColorStop(0.78, `rgba(${mR},${mG},${mB},0.9)`);
  grad.addColorStop(1,    `rgba(${tR},${tG},${tB},0.95)`);

  ctx.shadowBlur=5+normAmp*12;
  ctx.shadowColor='rgba(255,200,0,0.4)';
  ctx.strokeStyle=grad;
  ctx.lineWidth=barW;

  // Log-scale bin mapping — spreads energy across the FULL bar
  // spread instead of clumping it into the low bins on the left.
  // A gentle gain boost on higher bars compensates for the natural
  // rolloff of audio energy at high frequencies.
  const minBin=1, maxBin=bufferLength-1;
  for(let i=0;i<barCount;i++){
    const t=i/(barCount-1);
    const binIdx=Math.min(maxBin,Math.floor(minBin*Math.pow(maxBin/minBin,t)));
    const boost=1+t*2.2;
    const raw=(freqData[binIdx]/255)*boost;
    // Soft-knee roll-off instead of a hard Math.min ceiling — raw can run
    // well past 1 at high gain, but tanh curves it down smoothly as it
    // approaches the top so loud peaks taper naturally instead of every
    // over-threshold bar slamming to the exact same flat, clipped height.
    const val=Math.tanh(raw*0.85);
    const barH=val*maxBarH*gain*0.5;
    const x=i*(barW+gap)+gap/2;

    ctx.beginPath();
    ctx.moveTo(x+barW/2,H);
    ctx.lineTo(x+barW/2,H-barH);
    ctx.stroke();
  }

  // Peak line across top — classic VU meter reference
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,50,50,0.25)';
  ctx.lineWidth=0.5;
  ctx.beginPath();
  ctx.moveTo(0,H*0.12); ctx.lineTo(W,H*0.12); // 0dB clip line
  ctx.stroke();
}

// ── LISSAJOUS ─────────────────────────────────────────
function drawLissajous(W,H,gain,amp,speed){
  const cx=W/2,cy=H/2,scaleX=W*0.42,scaleY=H*0.42;
  lissPhase+=bpm?(bpm/60)*0.008*speed:0.006*speed;
  const domFreq=getDomFreq();
  const ratios=[1,1.333,1.5,2,2.5,3,4];
  const freqRatio=ratios[Math.min(ratios.length-1,Math.floor(domFreq/400))];
  ctx.beginPath();
  for(let i=0;i<512;i++){
    const t=(i/512)*Math.PI*2;
    const idxX=Math.floor((i/512)*(bufferLength/2));
    const idxY=Math.floor((i/512)*(bufferLength/2))+Math.floor(bufferLength/2);
    const aX=((dataArray[idxX]/128.0)-1)*gain;
    const aY=((dataArray[idxY]/128.0)-1)*gain;
    const x=cx+(Math.sin(t*freqRatio+lissPhase)+aX*0.25)*scaleX*(0.7+amp*0.3);
    const y=cy+(Math.sin(t)+aY*0.25)*scaleY*(0.7+amp*0.3);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
}

// ── CYMATICS ──────────────────────────────────────────
function drawCymatics(W,H,gain,normAmp,speed,rawAmp){
  const cx=W/2,cy=H/2;
  const isSilent=rawAmp<2.5;
  if(isSilent) silenceTimer=Math.min(1,silenceTimer+0.015);
  else         silenceTimer=Math.max(0,silenceTimer-0.07);

  const domFreq =getDomFreq();
  const freqNorm=Math.min(1,Math.max(0,(domFreq-80)/3920));
  const modeBase=1+freqNorm*7;
  const modeN   =Math.max(1,Math.round(modeBase));
  const modeM   =Math.max(1,modeN+Math.round(freqNorm*3)+1);

  chladniRotation+=0.0004*speed;

  const isCircle=cymaticsPlate==='circle';
  const isWet   =cymaticsFluid==='wet';
  const forceStr=(1.2+normAmp*5.0*gain*0.4)*speed;
  const damping =isWet?0.85:0.74;
  const jitter  =isWet?normAmp*1.4+(isSilent?0:0.10):normAmp*0.8+(isSilent?0:0.04);
  const radius  =Math.min(W,H)*0.44;
  const now     =frameCount*0.016;

  for(let p of particles){
    if(silenceTimer>0.25){
      const snapStr=(silenceTimer-0.25)*0.09;
      p.vx+=(p.restX-p.x)*snapStr;
      p.vy+=(p.restY-p.y)*snapStr;
      p.vx+=(Math.random()-0.5)*0.5;
      p.vy+=(Math.random()-0.5)*0.5;
    } else {
      let wave,gradX,gradY;
      if(isCircle){
        const dx=p.x-cx,dy=p.y-cy;
        const r=Math.sqrt(dx*dx+dy*dy)/radius;
        const theta=Math.atan2(dy,dx);
        if(r>1.0){ p.vx+=(cx-p.x)*0.1; p.vy+=(cy-p.y)*0.1; }
        else {
          const outward=Math.max(0,(1-r*1.5))*normAmp*1.5;
          const dirX=r>0.01?dx/(radius*r):(Math.random()-0.5);
          const dirY=r>0.01?dy/(radius*r):(Math.random()-0.5);
          p.vx+=dirX*outward; p.vy+=dirY*outward;
          const rad1=Math.sin(r*Math.PI*modeN);
          const rad2=Math.sin(r*Math.PI*(modeN+1)*0.65);
          const ang =Math.cos(modeM*theta+chladniRotation);
          wave=(rad1+rad2*0.45)*ang;
          gradX=wave*(dx/(radius*r+0.01))*modeN;
          gradY=wave*(dy/(radius*r+0.01))*modeN;
          p.vx-=wave*gradX*forceStr;
          p.vy-=wave*gradY*forceStr;
        }
      } else {
        const dx=p.x-cx,dy=p.y-cy;
        const cosR=Math.cos(chladniRotation),sinR=Math.sin(chladniRotation);
        const rx=dx*cosR-dy*sinR, ry=dx*sinR+dy*cosR;
        const nx =(rx/(W*0.44))*Math.PI*modeN, ny =(ry/(H*0.44))*Math.PI*modeM;
        const nx2=(rx/(W*0.44))*Math.PI*modeM, ny2=(ry/(H*0.44))*Math.PI*modeN;
        const nx3=((rx+ry)/(W*0.62))*Math.PI*modeN;
        const ny3=((rx-ry)/(H*0.62))*Math.PI*modeM;
        wave =Math.sin(nx)*Math.sin(ny)+Math.sin(nx2)*Math.sin(ny2)+Math.sin(nx3)*Math.sin(ny3)*0.5;
        const gRx=modeN*Math.cos(nx)*Math.sin(ny)+modeM*Math.cos(nx2)*Math.sin(ny2)+modeN*Math.cos(nx3)*Math.sin(ny3)*0.5;
        const gRy=modeM*Math.sin(nx)*Math.cos(ny)+modeN*Math.sin(nx2)*Math.cos(ny2)+modeM*Math.sin(nx3)*Math.cos(ny3)*0.5;
        gradX=gRx*cosR+gRy*sinR;
        gradY=-gRx*sinR+gRy*cosR;
        p.vx-=wave*gradX*forceStr;
        p.vy-=wave*gradY*forceStr;
      }
      if(isWet){
        const ripple=Math.sin(now*3+p.phase)*normAmp*0.7;
        p.vx+=(Math.random()-0.5)*jitter+ripple*0.3;
        p.vy+=(Math.random()-0.5)*jitter+ripple*0.3;
      } else {
        p.vx+=(Math.random()-0.5)*jitter;
        p.vy+=(Math.random()-0.5)*jitter;
      }
    }
    p.vx*=damping; p.vy*=damping;
    p.x+=p.vx; p.y+=p.vy;
    if(isCircle){
      const dx=p.x-cx,dy=p.y-cy,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>radius){
        const nx=dx/dist,ny=dy/dist;
        p.x=cx+nx*radius*0.97; p.y=cy+ny*radius*0.97;
        p.vx-=nx*Math.abs(p.vx)*1.0; p.vy-=ny*Math.abs(p.vy)*1.0;
      }
    } else {
      const bx=W*0.47,by=H*0.47;
      if(p.x<cx-bx){p.x=cx-bx;p.vx*=-0.3;} if(p.x>cx+bx){p.x=cx+bx;p.vx*=-0.3;}
      if(p.y<cy-by){p.y=cy-by;p.vy*=-0.3;} if(p.y>cy+by){p.y=cy+by;p.vy*=-0.3;}
    }
  }

  ctx.shadowBlur =isWet?5+normAmp*10:2+normAmp*6;
  ctx.shadowColor=sigColor(0.3+normAmp*0.5);
  for(let p of particles){
    const silFade=silenceTimer*0.3;
    const alpha=Math.max(0.04,isWet?0.28+normAmp*0.62-silFade:0.6+normAmp*0.4-silFade);
    const size =Math.max(0.3,isWet?(p.size+normAmp*0.9)*(1+silenceTimer*0.2):p.size*0.85+normAmp*0.4);
    ctx.fillStyle=sigColor(alpha);
    ctx.beginPath();
    ctx.arc(p.x,p.y,size,0,Math.PI*2);
    ctx.fill();
  }
}

// ── SONAR ────────────────────────────────────────
// Simulates sonar spike behavior:
// - Liquid pool at center responds to amplitude (swells)
// - Spikes rise from pool surface, height driven by frequency bands
// - Spikes have surface tension — they taper to points
// - Individual spike wobble creates organic variation
function drawSonar(W,H,normAmp,speed,thick){
  const cx=W/2, cy=H/2;
  const basePoolR=Math.min(W,H)*0.14;
  const maxSpikeH=Math.min(W,H)*0.38;

  // Compression curve — lifts moderate signals so they read punchy
  // without needing to nearly clip the input to see anything move
  const ampBoost=Math.pow(normAmp,0.55);
  const gainVal=parseFloat(gainCtrl.value);
  const gainMult=1+gainVal*0.9;

  // Pool swells harder with amplitude
  const poolR=basePoolR*(1+ampBoost*0.7);

  // Update spike targets from frequency data
  for(let i=0;i<SONAR_SPIKES;i++){
    const s=sonarSpikes[i];
    // Map each spike to a frequency band, averaged across a small
    // window of bins instead of one — a single bin reads weak even
    // on loud input because energy spreads thin across the spectrum
    const freqIdx=Math.floor((i/SONAR_SPIKES)*bufferLength*0.6)+2;
    const idxLo=Math.max(0,freqIdx-1), idxHi=Math.min(bufferLength-1,freqIdx+1);
    const freqRaw=(freqData[idxLo]+freqData[freqIdx]+freqData[idxHi])/3/255;
    const freqVal=Math.pow(freqRaw,0.55);
    // Target height from frequency + amplitude envelope + gain
    s.targetH=freqVal*maxSpikeH*ampBoost*gainMult;
    // Wobble for organic feel
    s.wobble+=s.wobbleSpeed*0.04*speed;
    const wobbleAmt=s.targetH*0.08*Math.sin(s.wobble);
    // Lerp toward target — fast rise, slow fall (surface tension)
    const lerpUp=0.28*speed, lerpDown=0.09*speed;
    s.currentH+=(s.targetH+wobbleAmt-s.currentH)*(s.currentH<s.targetH?lerpUp:lerpDown);
    s.currentH=Math.max(0,s.currentH);
  }

  // ── Draw pool ──
  ctx.shadowBlur =12+ampBoost*35;
  ctx.shadowColor=sigColor(0.6+ampBoost*0.4);

  // Pool base — filled ellipse
  ctx.fillStyle=sigColor(0.75+ampBoost*0.25);
  ctx.beginPath();
  ctx.ellipse(cx,cy,poolR,poolR*0.55,0,0,Math.PI*2);
  ctx.fill();

  // Pool rim highlight
  ctx.strokeStyle=sigColor(0.95+ampBoost*0.05);
  ctx.lineWidth=thick*0.6+1.2;
  ctx.beginPath();
  ctx.ellipse(cx,cy,poolR,poolR*0.55,0,0,Math.PI*2);
  ctx.stroke();

  // ── Draw spikes ──
  for(let i=0;i<SONAR_SPIKES;i++){
    const s=sonarSpikes[i];
    if(s.currentH<1) continue;

    const angle=s.angle;
    // Spike base on pool ellipse surface
    const baseX=cx+Math.cos(angle)*poolR;
    const baseY=cy+Math.sin(angle)*poolR*0.55;

    // Spike tip — extends outward from pool center
    const tipX=cx+Math.cos(angle)*(poolR+s.currentH);
    const tipY=cy+Math.sin(angle)*(poolR*0.55+s.currentH*0.7);

    // Width of spike base — tapers to point (surface tension)
    const baseWidth=Math.max(0.5,(thick*0.8)*(1-s.currentH/(maxSpikeH*1.5))*3+1);

    // Draw spike as tapered shape
    const perpX=-Math.sin(angle)*baseWidth;
    const perpY= Math.cos(angle)*baseWidth;

    ctx.fillStyle=sigColor(0.7+ampBoost*0.3);
    ctx.shadowBlur=6+s.currentH/maxSpikeH*18;
    ctx.shadowColor=sigColor(0.5+ampBoost*0.5);

    ctx.beginPath();
    ctx.moveTo(baseX+perpX, baseY+perpY);  // base left
    ctx.quadraticCurveTo(                  // left edge curves to tip
      (baseX+tipX)*0.5+perpX*0.3,
      (baseY+tipY)*0.5+perpY*0.3,
      tipX, tipY
    );
    ctx.quadraticCurveTo(                  // right edge
      (baseX+tipX)*0.5-perpX*0.3,
      (baseY+tipY)*0.5-perpY*0.3,
      baseX-perpX, baseY-perpY
    );
    ctx.closePath();
    ctx.fill();

    // Highlight edge on spike
    ctx.strokeStyle=sigColor(0.6+ampBoost*0.4);
    ctx.lineWidth=0.6;
    ctx.stroke();
  }

  // Pool surface detail — small ripples at spike bases
  if(ampBoost>0.08){
    ctx.strokeStyle=sigColor(ampBoost*0.4);
    ctx.lineWidth=0.6;
    ctx.shadowBlur=3;
    ctx.beginPath();
    ctx.ellipse(cx,cy,poolR*1.08,poolR*0.55*1.08,0,0,Math.PI*2);
    ctx.stroke();
  }
}

// ── IDLE ──────────────────────────────────────────────
function idleDraw(){
  if(running) return;
  const W=canvas.width,H=canvas.height;
  const gain =parseFloat(gainCtrl.value);
  const thick=parseFloat(thickCtrl.value);
  const speed=parseFloat(speedCtrl.value);
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,W,H);
  ctx.shadowBlur=5; ctx.shadowColor=sigColor(0.2);
  ctx.strokeStyle=sigColor(0.18); ctx.lineWidth=thick;
  ctx.beginPath();
  const t=Date.now()/1000;
  const amp=4*gain;
  for(let x=0;x<W;x++){
    const y=H/2+Math.sin((x/W)*Math.PI*4+t*2*speed)*amp;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  requestAnimationFrame(idleDraw);
}
idleDraw();

// ── AUDIO ENGINE INIT (call fresh each ACTIV8 session) ──
function buildSpaceReverbNetwork(inputBus){
  const times=[0.029,0.041,0.053,0.067];
  times.forEach(t=>{
    const d=audioCtx.createDelay(1); d.delayTime.value=t;
    const fb=audioCtx.createGain(); fb.gain.value=0.78;
    const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
    inputBus.connect(d);
    d.connect(lp); lp.connect(fb); fb.connect(d);
    lp.connect(masterOutGain);
  });
}

function initDisruptEngine(){
  try{
    // RECORD BUS — captures whatever's actually audible (dry + any active
    // disruptor) so downloaded loops sound like what you heard live
    recordDestination=audioCtx.createMediaStreamDestination();

    // MASTER OUT — every sound source in the app routes through this one
    // node before reaching either your speakers or the recording. A fade
    // here moves everything at once, live and recorded, together.
    masterOutGain=audioCtx.createGain(); masterOutGain.gain.value=1;
    masterOutGain.connect(audioCtx.destination);
    masterOutGain.connect(recordDestination);

    source.connect(recordDestination); // dry mic in the recording only, NOT live speakers — live monitor only happens via gesture disruptors

    // GESTURE ROUTER — the four disruptors listen to whichever source is
    // "live" right now: the mic while you're on the live canvas, or a
    // loop's own audio once a pill is playing. togglePill() rewires this.
    gestureInput=audioCtx.createGain(); gestureInput.gain.value=1;
    source.connect(gestureInput);

    // DRONE — feedback delay loop fed by gestureInput (no-input-mixer style)
    droneInputGain=audioCtx.createGain(); droneInputGain.gain.value=0;
    droneFilter=audioCtx.createBiquadFilter(); droneFilter.type='bandpass'; droneFilter.frequency.value=650; droneFilter.Q.value=1.4;
    droneDelay=audioCtx.createDelay(2.0); droneDelay.delayTime.value=0.28;
    droneFeedback=audioCtx.createGain(); droneFeedback.gain.value=0;
    droneOutGain=audioCtx.createGain(); droneOutGain.gain.value=0;
    gestureInput.connect(droneInputGain);
    droneInputGain.connect(droneDelay);
    droneDelay.connect(droneFilter);
    droneFilter.connect(droneFeedback);
    droneFeedback.connect(droneDelay);
    droneFilter.connect(droneOutGain);
    droneOutGain.connect(masterOutGain);

    // GHOST CHANNEL — gestureInput through slow LFO-modulated lowpass, short decay tail
    ghostFilter=audioCtx.createBiquadFilter(); ghostFilter.type='lowpass'; ghostFilter.frequency.value=800; ghostFilter.Q.value=6;
    ghostGain=audioCtx.createGain(); ghostGain.gain.value=0;
    ghostLFO=audioCtx.createOscillator(); ghostLFO.frequency.value=0.6; ghostLFO.type='sine';
    ghostLFOGain=audioCtx.createGain(); ghostLFOGain.gain.value=500;
    ghostLFO.connect(ghostLFOGain); ghostLFOGain.connect(ghostFilter.frequency);
    ghostLFO.start();
    gestureInput.connect(ghostFilter); ghostFilter.connect(ghostGain);
    ghostGain.connect(masterOutGain);

    // RESONANT SWEEP — gestureInput through high-Q bandpass, pinch-distance controlled
    sweepFilter=audioCtx.createBiquadFilter(); sweepFilter.type='bandpass'; sweepFilter.frequency.value=800; sweepFilter.Q.value=4;
    sweepGain=audioCtx.createGain(); sweepGain.gain.value=0;
    gestureInput.connect(sweepFilter); sweepFilter.connect(sweepGain);
    sweepGain.connect(masterOutGain);

    // BITCRUSH DEGRADE — gestureInput through waveshaper, twist-angle controlled
    crushShaper=audioCtx.createWaveShaper();
    crushGain=audioCtx.createGain(); crushGain.gain.value=0;
    gestureInput.connect(crushShaper); crushShaper.connect(crushGain);
    crushGain.connect(masterOutGain);
    setCrushCurve(0);

    // SPACE REVERB + DUB DELAY — shared sends, used by loop pill playback
    reverbBus=audioCtx.createGain(); reverbBus.gain.value=1;
    reverbBus.connect(masterOutGain);
    buildSpaceReverbNetwork(reverbBus);

    delayBus=audioCtx.createGain(); delayBus.gain.value=1;
    const dubDelayNode=audioCtx.createDelay(1.5); dubDelayNode.delayTime.value=0.375;
    const dubFeedback=audioCtx.createGain(); dubFeedback.gain.value=0.42;
    const dubFilter=audioCtx.createBiquadFilter(); dubFilter.type='lowpass'; dubFilter.frequency.value=2200;
    delayBus.connect(dubDelayNode);
    dubDelayNode.connect(dubFilter);
    dubFilter.connect(dubFeedback);
    dubFeedback.connect(dubDelayNode);
    dubFilter.connect(masterOutGain);
  }catch(e){ /* effects engine unavailable this session — visualizer still runs fine */ }
}

function initLoopAudioGraph(){
  for(let i=0;i<8;i++){
    const vid=document.createElement('video');
    vid.loop=true; vid.playsInline=true;
    vid.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
    vid.preservesPitch=false; vid.mozPreservesPitch=false; vid.webkitPreservesPitch=false;
    document.body.appendChild(vid);
    loopPlayers[i]=vid;
    try{
      const src=audioCtx.createMediaElementSource(vid);
      const gain=audioCtx.createGain(); gain.gain.value=1;
      const gate=audioCtx.createGain(); gate.gain.value=1; // STUTTER gate — 1=open, 0=closed
      const rSend=audioCtx.createGain(); rSend.gain.value=0;
      const dSend=audioCtx.createGain(); dSend.gain.value=0;
      src.connect(gain);
      gain.connect(gate);
      gate.connect(masterOutGain);
      gate.connect(rSend); rSend.connect(reverbBus);
      gate.connect(dSend); dSend.connect(delayBus);
      loopGains[i]=gain; loopGates[i]=gate; loopReverbSends[i]=rSend; loopDelaySends[i]=dSend;
    }catch(e){ /* shouldn't happen — each element is only ever bound once, right here */ }
  }
}

// Every ACTIV8 press after the first gets a brand-new mic source node

function reconnectMicToEngine(){

    if(activePills.size===0) source.connect(gestureInput);

// ── DISRUPTOR TRIGGERS ──
function setDrone(amt){
  disrupt.drone=amt;
  if(!droneInputGain) return;
  const now=audioCtx.currentTime;
  droneInputGain.gain.setTargetAtTime(0.9,now,0.05);
  droneFeedback.gain.setTargetAtTime(0.3+amt*0.62,now,0.08);
  droneOutGain.gain.setTargetAtTime(0.15+amt*0.75,now,0.08);
}
function releaseDrone(){
  if(droneInputGain){
    const now=audioCtx.currentTime;
    droneInputGain.gain.setTargetAtTime(0,now,0.3);
    droneFeedback.gain.setTargetAtTime(0,now,3.5);
    droneOutGain.gain.setTargetAtTime(0,now,4.2);
  }
  (function decay(){ disrupt.drone*=0.965; if(disrupt.drone>0.01) requestAnimationFrame(decay); else disrupt.drone=0; })();
}

function triggerGhost(speed){
  if(!ghostFilter) return;
  const now=audioCtx.currentTime;
  const level=Math.min(1,speed*40);
  disrupt.ghost=level;
  ghostLFO.frequency.setTargetAtTime(0.3+level*3,now,0.1);
  ghostGain.gain.setTargetAtTime(level*0.55,now,0.05);
  ghostGain.gain.setTargetAtTime(0,now+0.15,0.9);
  (function decay(){ disrupt.ghost*=0.92; if(disrupt.ghost>0.01) requestAnimationFrame(decay); else disrupt.ghost=0; })();
}

function setSweep(norm){
  disrupt.sweep=norm;
  if(!sweepFilter) return;
  const now=audioCtx.currentTime;
  const freq=110*Math.pow(36,norm);
  sweepFilter.frequency.setTargetAtTime(freq,now,0.03);
  sweepFilter.Q.setTargetAtTime(3+norm*24,now,0.05);
  sweepGain.gain.setTargetAtTime(0.5+norm*0.4,now,0.05);
}
function releaseSweep(){
  if(sweepGain) sweepGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.5);
  (function decay(){ disrupt.sweep*=0.9; if(disrupt.sweep>0.01) requestAnimationFrame(decay); else disrupt.sweep=0; })();
}

function setCrushCurve(amt){
  if(!crushShaper) return;
  const steps=Math.max(2,Math.round(32-amt*30));
  const n=512, curve=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=i/(n-1)*2-1;
    curve[i]=Math.round(x*steps)/steps;
  }
  crushShaper.curve=curve;
}
function setCrush(amt){
  disrupt.crush=amt;
  setCrushCurve(amt);
  if(crushGain) crushGain.gain.setTargetAtTime(0.4+amt*0.5,audioCtx.currentTime,0.03);
}
function releaseCrush(){
  if(crushGain) crushGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.4);
  (function decay(){ disrupt.crush*=0.88; if(disrupt.crush>0.01) requestAnimationFrame(decay); else disrupt.crush=0; })();
}

// ── VISUAL POST-PROCESS for ghost / sweep / crush (drone handled via ctx.filter in draw()) ──
const crushCanvas=document.createElement('canvas');
const crushCtx=crushCanvas.getContext('2d');
function applyDisruptors(W,H){
  if(disrupt.ghost>0.01){
    ctx.save();
    ctx.globalAlpha=disrupt.ghost*0.35;
    ctx.fillStyle=sigColor(1);
    for(let i=0;i<5;i++){
      const rw=Math.random()*W*0.4, rh=Math.random()*H*0.4;
      ctx.fillRect(Math.random()*W-rw/2, Math.random()*H-rh/2, rw, rh);
    }
    ctx.restore();
  }
  if(disrupt.sweep>0.01){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.strokeStyle=sigColor(0.8);
    ctx.lineWidth=2;
    ctx.shadowBlur=20*disrupt.sweep;
    ctx.shadowColor=sigColor(1);
    const r=20+disrupt.sweep*Math.min(W,H)*0.4;
    ctx.beginPath();
    ctx.arc(W/2,H/2,r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if(disrupt.crush>0.02){
    const blockSize=Math.max(2,Math.round(disrupt.crush*28));
    const sw=Math.max(1,Math.floor(W/blockSize)), sh=Math.max(1,Math.floor(H/blockSize));
    crushCanvas.width=sw; crushCanvas.height=sh;
    crushCtx.drawImage(canvas,0,0,W,H,0,0,sw,sh);
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(crushCanvas,0,0,sw,sh,0,0,W,H);
    ctx.restore();
  }
}

// ── LOOP COMPOSITOR — draws every currently-active pill's video onto the
// SAME main canvas the live scope uses. Each loop's crisp frame is always
// drawn first, full detail, untouched — that inner solid edge never gets
// lost. BLEED is a second, purely additive pass on top of it: 0 is
// invisible, higher values glow further outward and melt into whatever
// else is overlapping, Neville-Brody-liquid style, without ever replacing
// the sharp original underneath. Because this draws onto the real canvas,
// recording automatically captures whatever's on screen, live or loops. ──
const featherCanvas=document.createElement('canvas');
const featherCtx=featherCanvas.getContext('2d');

// ── STUTTER / BEAT-GATE — same engine as SONIK CRYSTALZ. Center=0 is off.
// Negative = chaotic chop (random on/off bursts, faster the further left).
// Positive = tempo-synced grid gating (quarter → 8th → 16th → 32nd note). ──
const GATE_BPM=90;
function updatePillGate(p,gateNode){
  if(!gateNode||!audioCtx) return;
  if(!p._gate) p._gate={phase:0,open:true,lastT:audioCtx.currentTime,wasOff:true};
  const g=p._gate, v=p.stutter||0, now=audioCtx.currentTime;
  if(v===0){
    if(!g.wasOff){ gateNode.gain.setTargetAtTime(1,now,0.03); g.wasOff=true; g.lastT=now; }
    return;
  }
  const dt=now-g.lastT; g.lastT=now; g.wasOff=false;
  if(v<0){
    const t=Math.abs(v)/100;
    const chopSec=(18+((1-t)*182))/1000;
    g.phase+=dt/chopSec;
    if(g.phase>=1){
      g.phase%=1;
      const onProb=0.25+((1-t)*0.45);
      g.open=Math.random()<onProb;
      gateNode.gain.setTargetAtTime(g.open?1:0,now,0.008);
    }
  } else {
    const t=v/100;
    const subdivision=t<0.25?1:t<0.5?2:t<0.75?4:8;
    const subSec=(60/GATE_BPM)/subdivision;
    const dutyOpen=0.55;
    g.phase+=dt/subSec;
    if(g.phase>=1) g.phase%=1;
    const shouldOpen=g.phase<dutyOpen;
    if(shouldOpen!==g.open){
      g.open=shouldOpen;
      gateNode.gain.setTargetAtTime(g.open?1:0.02,now,0.01);
    }
  }
}

let masterFadeAmt=0, masterFading=false;
function triggerMasterFade(){
  if(!masterOutGain) return;
  masterFading=true;
  const fadeMs=2200, t0=performance.now();
  masterOutGain.gain.setTargetAtTime(0,audioCtx.currentTime,fadeMs/3000);
  (function step(){
    const t=(performance.now()-t0)/fadeMs;
    masterFadeAmt=Math.min(1,t);
    if(t<1) requestAnimationFrame(step);
  })();
}
function resetMasterFade(){
  if(!masterOutGain) return;
  masterFading=false;
  masterOutGain.gain.setTargetAtTime(1,audioCtx.currentTime,0.3);
  const t0=performance.now(), fadeMs=600, start=masterFadeAmt;
  (function step(){
    const t=(performance.now()-t0)/fadeMs;
    masterFadeAmt=start*(1-Math.min(1,t));
    if(t<1) requestAnimationFrame(step);
  })();
}
function drawMasterFadeOverlay(W,H){
  if(masterFadeAmt<=0.005) return;
  ctx.save();
  ctx.globalAlpha=masterFadeAmt;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawLoopComposite(W,H){
  ctx.clearRect(0,0,W,H);
  activePills.forEach(i=>{
    const p=loopPills[i], vid=loopPlayers[i];
    if(!p || !vid || !vid.videoWidth) return;
    updatePillGate(p,loopGates[i]);
    if(driftOn && !p._fadingOut) applyDrift(p);
    const fadeMult=(p._fadeOpacityMult!==undefined)?p._fadeOpacityMult:1;
    const effOpacity=p.opacity*fadeMult;
    const baseFilter=`saturate(${p.vibrancy.toFixed(2)}) brightness(${(0.85+p.vibrancy*0.15).toFixed(2)})`
      + (disrupt.drone>0.01 ? ` hue-rotate(${(disrupt.drone*360)|0}deg) blur(${(disrupt.drone*1.4).toFixed(2)}px)` : '');
    const scale=p.scale||1;
    const dw=W*scale, dh=H*scale, dx=(W-dw)/2, dy=(H-dh)/2;

    // Below scale 1, feather the frame's own edge into transparency instead
    // of leaving a hard rectangular cutoff against the black behind it.
    // At scale 1 or above, featherAmt is 0 and this is skipped entirely —
    // full-size loops stay exactly as crisp as before.
    const featherAmt=scale<1 ? Math.min(1,(1-scale)) : 0;
    let sourceEl=vid;
    if(featherAmt>0.02){
      const fw=Math.max(1,Math.round(dw)), fh=Math.max(1,Math.round(dh));
      featherCanvas.width=fw; featherCanvas.height=fh;
      featherCtx.imageSmoothingEnabled=true; featherCtx.imageSmoothingQuality='high';
      featherCtx.clearRect(0,0,fw,fh);
      featherCtx.drawImage(vid,0,0,fw,fh);
      featherCtx.globalCompositeOperation='destination-in';
      featherCtx.save();
      featherCtx.translate(fw/2,fh/2);
      featherCtx.scale(fw/2,fh/2);
      const innerStop=Math.max(0.25,1-featherAmt*0.7);
      const grad=featherCtx.createRadialGradient(0,0,innerStop*0.6,0,0,1);
      grad.addColorStop(0,'rgba(255,255,255,1)');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      featherCtx.fillStyle=grad;
      featherCtx.fillRect(-1,-1,2,2);
      featherCtx.restore();
      featherCtx.globalCompositeOperation='source-over';
      sourceEl=featherCanvas;
    }

    ctx.save();
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=effOpacity;
    ctx.filter=baseFilter;
    ctx.drawImage(sourceEl,dx,dy,dw,dh);
    ctx.restore();

    const bleedPx=Math.pow(p.bleed,1.5)*40;
    if(bleedPx>0.5){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=effOpacity*Math.min(1,p.bleed*1.3);
      ctx.filter=baseFilter+` blur(${bleedPx.toFixed(1)}px)`;
      ctx.drawImage(sourceEl,dx,dy,dw,dh);
      ctx.restore();
    }
  });
  ctx.filter='none';
  applyDisruptors(W,H);
  drawMasterFadeOverlay(W,H);
}

// ── GESTURE ZONE (shared by canvas and every empty pill) ──
function makeGestureZone(el){
  const pointers=new Map();
  let longPressTimer=null, longPressStartTime=0, longPressActive=false;
  let swipeStartX=0, swipeStartY=0, swipeStartTime=0, swipeFired=false;
  let pinchActive=false, twistActive=false, twistStartAngle=0;

  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
  function angle(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }

  el.addEventListener('pointerdown',e=>{
    if(!running) return;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      swipeStartX=e.clientX; swipeStartY=e.clientY; swipeStartTime=Date.now(); swipeFired=false;
      longPressStartTime=Date.now(); longPressActive=false;
      clearInterval(longPressTimer);
      longPressTimer=setInterval(()=>{
        const held=(Date.now()-longPressStartTime)/1000;
        if(pointers.size===1){ longPressActive=true; setDrone(Math.min(1,held/14)); }
        // Safety ceiling — no gesture should ever be able to run forever.
        // If something drops a release event, this forces it off after 20s.
        if(held>20){ clearInterval(longPressTimer); longPressActive=false; releaseDrone(); pointers.clear(); }
      },50);
    } else if(pointers.size===2){
      clearInterval(longPressTimer);
      if(longPressActive) releaseDrone();
      longPressActive=false;
      const pts=[...pointers.values()];
      twistStartAngle=angle(pts[0],pts[1]);
      pinchActive=true; twistActive=true;
    }
  });

  el.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1 && !longPressActive){
      const dx=e.clientX-swipeStartX, dy=e.clientY-swipeStartY;
      const d=Math.hypot(dx,dy), dt=(Date.now()-swipeStartTime)||1;
      if(d>36 && !swipeFired){ swipeFired=true; triggerGhost(d/dt); }
    } else if(pointers.size===2){
      const pts=[...pointers.values()];
      const dNow=dist(pts[0],pts[1]);
      const aNow=angle(pts[0],pts[1]);
      setSweep(Math.max(0,Math.min(1,(dNow-40)/300)));
      let da=aNow-twistStartAngle;
      while(da>Math.PI) da-=Math.PI*2;
      while(da<-Math.PI) da+=Math.PI*2;
      setCrush(Math.max(0,Math.min(1,Math.abs(da)/(Math.PI*0.75))));
    }
  });

  function release(e){
    pointers.delete(e.pointerId);
    if(pointers.size===0){
      clearInterval(longPressTimer);
      if(longPressActive) releaseDrone();
      longPressActive=false;
      if(pinchActive) releaseSweep();
      if(twistActive) releaseCrush();
      pinchActive=false; twistActive=false;
    } else if(pointers.size===1){
      if(pinchActive) releaseSweep();
      if(twistActive) releaseCrush();
      pinchActive=false; twistActive=false;
    }
  }
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
}

// ── RECORDING ──
function startRecording(){
  if(!running || !recordDestination) return;
  const canvasStream=canvas.captureStream(30);
  const combined=new MediaStream([...canvasStream.getVideoTracks(), ...recordDestination.stream.getAudioTracks()]);
  const formats=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm',''];
  const mimeType=formats.find(f=>f===''||MediaRecorder.isTypeSupported(f))||'';
  try{ mediaRecorder=new MediaRecorder(combined, mimeType?{mimeType}:{}); }
  catch(e){ return; }
  recChunks=[];
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
    const type=mediaRecorder.mimeType||'video/mp4';
    const ext=type.includes('mp4')?'mp4':type.includes('webm')?'webm':'mp4';
    const blob=new Blob(recChunks,{type});
    const filename='cre8tiv_loop_'+Date.now()+'.'+ext;
    const file=new File([blob],filename,{type});
    // iPad reports a Mac-style user agent, so UA sniffing alone misses it —
    // the platform+touch-points check catches iPad even though it looks
    // like desktop Safari. Actual desktop Mac/Windows has 0 touch points.
    const isMobileOrTablet = /iPhone|iPod|Android/i.test(navigator.userAgent) ||
      (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    if(isMobileOrTablet && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'CRE8TIV OSCILLOscOPE Loop'}).catch(()=>{});
    } else {
      // Desktop browsers block a programmatic download that isn't fired
      // directly from a user click — the onstop event doesn't count as
      // one, even though it's a split second later. Surface a real tap
      // target instead of quietly failing.
      pendingSave={url:URL.createObjectURL(blob),filename};
      saveFallback.classList.add('open');
    }
    loadIntoPill(blob,filename,ext);
  };
  mediaRecorder.start();
  recActive=true; recSecs=0;
  saveFallback.classList.remove('open'); pendingSave=null;
  recBtn.classList.add('recording');
  recTimerEl.textContent='00:00';
  clearInterval(recInterval);
  recInterval=setInterval(()=>{
    recSecs++;
    const m=String(Math.floor(recSecs/60)).padStart(2,'0'), s=String(recSecs%60).padStart(2,'0');
    recTimerEl.textContent=m+':'+s;
  },1000);
}
function stopRecording(){
  recActive=false;
  clearInterval(recInterval);
  recBtn.classList.remove('recording');
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
}
recBtn.addEventListener('click',()=>{
  if(!running) return;
  if(!recActive) startRecording(); else stopRecording();
});

// ── PILL DECK ──
function loadIntoPill(blob,filename,ext){
  const idx=loopPills.findIndex(p=>p===null);
  if(idx===-1) return;
  const url=URL.createObjectURL(blob);
  loopPills[idx]={url,filename,ext,vol:1,pitch:1,reverb:0,delay:0,stutter:0,
    opacity:1,vibrancy:1,bleed:0,scale:1,active:false,discovered:false};
  if(loopPlayers[idx]) loopPlayers[idx].src=url;
  renderPills();
}

function clearPill(i){
  const p=loopPills[i]; if(!p) return;
  const vid=loopPlayers[i];
  if(activePills.has(i)){
    if(vid) vid.pause();
    activePills.delete(i);
    if(gestureInput){
      try{ loopGains[i].disconnect(gestureInput); }catch(e){}
      if(activePills.size===0){ try{ source.connect(gestureInput); }catch(e){} }
    }
  }
  try{ URL.revokeObjectURL(p.url); }catch(e){}
  if(vid){ vid.pause(); vid.removeAttribute('src'); vid.load(); }
  loopPills[i]=null;
  renderPills();
}

function togglePill(i){
  const p=loopPills[i];
  const vid=loopPlayers[i];
  if(!p || !vid) return;
  if(activePills.has(i)){
    if(p._fadingOut) return; // already releasing — ignore repeat taps mid-fade
    p._fadingOut=true;
    const fadeMs=900;
    const t0=performance.now();
    if(loopGains[i]) loopGains[i].gain.setTargetAtTime(0,audioCtx.currentTime,fadeMs/3000);
    (function fadeStep(){
      const t=(performance.now()-t0)/fadeMs;
      if(t>=1){
        vid.pause();
        p._fadingOut=false; p._fadeOpacityMult=1;
        p.active=false;
        activePills.delete(i);
        if(loopGains[i]) loopGains[i].gain.value=p.vol; // reset, ready for next activation
        if(gestureInput){
          try{ loopGains[i].disconnect(gestureInput); }catch(e){}
          if(activePills.size===0){ try{ source.connect(gestureInput); }catch(e){} }
        }
        renderPills();
        return;
      }
      p._fadeOpacityMult=1-t;
      requestAnimationFrame(fadeStep);
    })();
    return;
  }
  const wasEmpty=activePills.size===0;
  const enteringOverlap=activePills.size===1;
  if(enteringOverlap && gestureInput){
    const onlyIdx=[...activePills][0];
    try{ loopGains[onlyIdx].disconnect(gestureInput); }catch(e){}
    try{ source.connect(gestureInput); }catch(e){}
  } else if(wasEmpty && gestureInput){
    try{ source.disconnect(gestureInput); }catch(e){}
  }
  p._fadingOut=false; p._fadeOpacityMult=1;
  vid.playbackRate=p.pitch;
  if(loopGains[i]) loopGains[i].gain.value=p.vol;
  if(loopReverbSends[i]) loopReverbSends[i].gain.value=p.reverb;
  if(loopDelaySends[i]) loopDelaySends[i].gain.value=p.delay;
  vid.play().catch(()=>{});
  p.active=true; p.discovered=true;
  activePills.add(i);
  // gestures target THIS loop's audio only when it's the sole active one
  if(activePills.size===1 && gestureInput){
    try{ loopGains[i].connect(gestureInput); }catch(e){}
  }
  renderPills();
}

const PILL_MENU_IDLE_MS=16000;
let pillMenuIdleTimer=null;
function armPillMenuIdleTimer(){
  clearTimeout(pillMenuIdleTimer);
  pillMenuIdleTimer=setTimeout(closePillMenu,PILL_MENU_IDLE_MS);
}
function openPillMenu(i,x,y){
  const p=loopPills[i]; if(!p) return;
  pillMenuIndex=i;
  pmVol.value=p.vol; pmPitch.value=p.pitch; pmStutter.value=p.stutter;
  pmReverb.value=p.reverb; pmDelay.value=p.delay;
  pmOpacity.value=p.opacity; pmVibrancy.value=p.vibrancy; pmBleed.value=p.bleed; pmScale.value=p.scale;
  const mw=200, mh=390;
  // Pills 1-4 (index 0-3) anchor left, pills 5-8 (index 4-7) anchor right —
  // keeps the menu off the center of the canvas regardless of touch point.
  const left = i<4 ? 10 : window.innerWidth-mw-10;
  const top=Math.min(Math.max(8,y-mh-20), window.innerHeight-mh-8);
  pillMenu.style.left=left+'px'; pillMenu.style.top=top+'px';
  pillMenu.classList.add('open');
  armPillMenuIdleTimer();
}
function closePillMenu(){
  clearTimeout(pillMenuIdleTimer);
  pillMenu.classList.remove('open'); pillMenuIndex=null;
}
pillMenuClose.addEventListener('click',closePillMenu);
pillMenu.addEventListener('pointerdown',armPillMenuIdleTimer);
pillMenu.addEventListener('input',armPillMenuIdleTimer);
document.addEventListener('pointerdown',e=>{
  if(pillMenu.classList.contains('open') && !pillMenu.contains(e.target) && !e.target.closest('.loop-pill')){
    closePillMenu();
  }
});

pmVol.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.vol=parseFloat(pmVol.value);
  if(p.active && loopGains[pillMenuIndex]) loopGains[pillMenuIndex].gain.value=p.vol;
});
pmPitch.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.pitch=parseFloat(pmPitch.value);
  if(p.active) loopPlayers[pillMenuIndex].playbackRate=p.pitch;
});
pmStutter.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.stutter=parseFloat(pmStutter.value); // read live by updatePillGate each frame
});
pmReverb.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.reverb=parseFloat(pmReverb.value);
  if(p.active && loopReverbSends[pillMenuIndex]) loopReverbSends[pillMenuIndex].gain.value=p.reverb;
});
pmDelay.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.delay=parseFloat(pmDelay.value);
  if(p.active && loopDelaySends[pillMenuIndex]) loopDelaySends[pillMenuIndex].gain.value=p.delay;
});
pmOpacity.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.opacity=parseFloat(pmOpacity.value); // read live by the compositor, no node push needed
});
pmVibrancy.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.vibrancy=parseFloat(pmVibrancy.value);
});
pmBleed.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.bleed=parseFloat(pmBleed.value);
});
pmScale.addEventListener('input',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.scale=parseFloat(pmScale.value); // read live by the compositor, no node push needed
});
pmDownload.addEventListener('click',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  const a=document.createElement('a'); a.href=p.url; a.download=p.filename;
  a.click();
});
pmDelete.addEventListener('click',()=>{
  if(pillMenuIndex===null) return;
  clearPill(pillMenuIndex);
  closePillMenu();
});

const pmRand=document.getElementById('pmRand');
pmRand.addEventListener('click',()=>{
  const p=loopPills[pillMenuIndex]; if(!p) return;
  p.opacity=0.35+Math.random()*0.65;
  p.vibrancy=0.4+Math.random()*1.6;
  p.bleed=Math.random()*0.8;
  p.scale=0.5+Math.random()*3.5;
  pmOpacity.value=p.opacity; pmVibrancy.value=p.vibrancy;
  pmBleed.value=p.bleed; pmScale.value=p.scale;
});

function attachPillHandlers(el,i){
  const p=loopPills[i];
  if(!p){ makeGestureZone(el); return; }
  let downTime=0, longPressTimer=null, longPressFired=false, startX=0, startY=0, moved=false;
  el.addEventListener('pointerdown',e=>{
    downTime=Date.now(); longPressFired=false; moved=false;
    startX=e.clientX; startY=e.clientY;
    longPressTimer=setTimeout(()=>{ longPressFired=true; openPillMenu(i,e.clientX,e.clientY); },500);
  });
  el.addEventListener('pointermove',e=>{
    if(Math.hypot(e.clientX-startX,e.clientY-startY)>10) moved=true;
  });
  el.addEventListener('pointerup',()=>{
    clearTimeout(longPressTimer);
    if(!longPressFired && !moved) togglePill(i);
  });
  el.addEventListener('pointercancel',()=>clearTimeout(longPressTimer));
}

function renderPills(){
  pillRow.innerHTML='';
  loopPills.forEach((p,i)=>{
    const el=document.createElement('div');
    let cls='loop-pill '+(p?'filled':'empty');
    if(p && !p.discovered) cls+=' pulsing';
    if(p && p.active) cls+=' active';
    el.className=cls;
    el.style.background=`hsl(${pillHues[i]},70%,80%)`;
    el.style.color=`hsl(${pillHues[i]},70%,80%)`;
    pillRow.appendChild(el);
    attachPillHandlers(el,i);
  });
}
// ── AUTO-DRIFT / GHOST HAND / SHUFFLE DECK — generative companions to the
// touch disruptors, same spirit, running on their own instead of a finger ──
let driftOn=false, ghostHandOn=false, shuffleOn=false;
let ghostHandTimer=null, shuffleTimer=null;
const driftBtn=document.getElementById('driftBtn');
const fadeBtn=document.getElementById('fadeBtn');
fadeBtn.addEventListener('click',()=>{
  if(!running) return;
  if(!masterFading){ triggerMasterFade(); fadeBtn.classList.add('active'); fadeBtn.textContent='UN-FADE'; }
  else { resetMasterFade(); fadeBtn.classList.remove('active'); fadeBtn.textContent='FADE'; }
});
const ghostHandBtn=document.getElementById('ghostHandBtn');
const shuffleBtn=document.getElementById('shuffleBtn');

// DRIFT — nudged once per frame from drawLoopComposite for every active pill
function applyDrift(p){
  if(!p._drift) p._drift={o:0,v:0,b:0,s:0};
  const d=p._drift;
  d.o=Math.max(-0.01,Math.min(0.01,d.o+(Math.random()-0.5)*0.004));
  d.v=Math.max(-0.02,Math.min(0.02,d.v+(Math.random()-0.5)*0.01));
  d.b=Math.max(-0.01,Math.min(0.01,d.b+(Math.random()-0.5)*0.004));
  d.s=Math.max(-0.05,Math.min(0.05,d.s+(Math.random()-0.5)*0.02));
  p.opacity =Math.max(0.15,Math.min(1,p.opacity+d.o));
  p.vibrancy=Math.max(0,Math.min(2,p.vibrancy+d.v));
  p.bleed   =Math.max(0,Math.min(1,p.bleed+d.b));
  p.scale   =Math.max(0.3,Math.min(8,p.scale+d.s));
}
driftBtn.addEventListener('click',()=>{
  driftOn=!driftOn;
  driftBtn.classList.toggle('on',driftOn);
});

// GHOST HAND — fires one of the four touch disruptors on its own at random intervals
function ghostHandFire(){
  if(!running) return;
  const pick=Math.floor(Math.random()*4);
  if(pick===0){ setDrone(0.25+Math.random()*0.4); setTimeout(releaseDrone,800+Math.random()*1400); }
  else if(pick===1){ triggerGhost(0.02+Math.random()*0.05); }
  else if(pick===2){ setSweep(Math.random()); setTimeout(releaseSweep,400+Math.random()*1000); }
  else { setCrush(0.2+Math.random()*0.6); setTimeout(releaseCrush,300+Math.random()*800); }
}
function scheduleGhostHand(){
  if(!ghostHandOn) return;
  ghostHandTimer=setTimeout(()=>{ ghostHandFire(); scheduleGhostHand(); },4000+Math.random()*10000);
}
ghostHandBtn.addEventListener('click',()=>{
  ghostHandOn=!ghostHandOn;
  ghostHandBtn.classList.toggle('on',ghostHandOn);
  if(ghostHandOn) scheduleGhostHand();
  else clearTimeout(ghostHandTimer);
});

// SHUFFLE DECK — periodically flips a random populated pill on or off
function shuffleTick(){
  if(!shuffleOn) return;
  const populated=loopPills.map((p,idx)=>p?idx:null).filter(x=>x!==null);
  if(populated.length>0) togglePill(populated[Math.floor(Math.random()*populated.length)]);
  shuffleTimer=setTimeout(shuffleTick,3000+Math.random()*6000);
}
shuffleBtn.addEventListener('click',()=>{
  shuffleOn=!shuffleOn;
  shuffleBtn.classList.toggle('on',shuffleOn);
  if(shuffleOn) shuffleTick();
  else clearTimeout(shuffleTimer);
});

// Clean slate on ACTIV8 stop — no zombie timers running into the next session
function stopAutoEngines(){
  driftOn=false; ghostHandOn=false; shuffleOn=false;
  clearTimeout(ghostHandTimer); clearTimeout(shuffleTimer);
  driftBtn.classList.remove('on'); ghostHandBtn.classList.remove('on'); shuffleBtn.classList.remove('on');
  masterFading=false; masterFadeAmt=0;
  fadeBtn.classList.remove('active'); fadeBtn.textContent='FADE';
}

renderPills();
makeGestureZone(canvas);

</script>
