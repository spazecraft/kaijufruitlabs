Object.assign(VOICE, {
  heart(t) { [[0, 62, .55], [.24, 52, .4]].forEach(([d, f, a]) => { const o = SND.osc('sine', f, t + d, t + d + .2), g = SND.env(t + d, .01, .14, a); o.connect(g); SND.out(g); }); },
  chirp(t) { for (let i = 0; i < 3; i++) { const o = SND.osc('sine', 4300, t + i * .045, t + i * .045 + .035), g = SND.env(t + i * .045, .003, .028, .12); o.connect(g); SND.out(g, .1); } },
  thunder(t) { const n = SND.nz(t, t + 3.2), lp = SND.filt('lowpass', 180, 1), g = SND.env(t, .05, 2.8, .9); lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(90, t + 2.5); n.connect(lp).connect(g); SND.out(g, .6); }
});
function flashWidget(el) { const f = document.createElement('div'); f.className = 'flashdot'; el.appendChild(f); return () => { f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120); }; }
function tapCounter(el, label) { let n = 0; const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<button class="btn purple small tapc">${label || 'TAP TO COUNT'}</button><span class="mono" style="font-size:20px">0</span><button class="btn ghost small">RESET</button>`; el.appendChild(d);
  const [b, out, r] = [d.children[0], d.children[1], d.children[2]]; b.onpointerdown = e => { e.preventDefault(); out.textContent = ++n; }; r.onclick = () => { n = 0; out.textContent = 0; }; }
function playOver(el, seconds, times, voice, btnLabel) {
  const w = document.createElement('div'); w.innerHTML = `<div class="row"><button class="btn cyan small">&#9654; ${btnLabel}</button><span class="mono sub tleft"></span></div>`; el.appendChild(w); const blink = flashWidget(el);
  const btn = w.querySelector('button'), tl = w.querySelector('.tleft');
  btn.onclick = () => { if (!SND.init()) { tl.textContent = 'Turn sound on to hear it. The dot still flashes.'; } const c = AUD.ctx, t0 = c ? c.currentTime + .1 : 0; const start = Date.now();
    times.forEach(s => { if (c && ST.settings.sound) voice(t0 + s); setTimeout(blink, s * 1000 + 100); });
    btn.disabled = true; const iv = setInterval(() => { const left = Math.max(0, seconds - (Date.now() - start) / 1000); tl.textContent = left > 0 ? `listening… ${left.toFixed(0)} s left` : 'done'; if (left <= 0) { clearInterval(iv); btn.disabled = false; } }, 200); };
}
function stopwatch(el) { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<button class="btn purple small">START WATCH</button><span class="mono" style="font-size:22px">0.0 s</span>`; el.appendChild(d);
  let t0 = 0, iv = null; const b = d.children[0], out = d.children[1];
  b.onclick = () => { if (!iv) { t0 = Date.now(); iv = setInterval(() => out.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s', 100); b.textContent = 'STOP WATCH'; } else { clearInterval(iv); iv = null; b.textContent = 'START WATCH'; } }; }

/* Music facts used (standard music theory):
   one step = one sixteenth note; an eighth note = 2 steps; a quarter note = 4 steps.
   4/4 = 16 steps, 3/4 = 3 quarters = 12 steps, 6/8 = 6 eighths = 12 steps (felt as 2 groups of 3), 5/4 = 20 steps,
   9/8 = 9 eighths = 18 steps, 12/8 = 12 eighths = 24 steps.
   Step length in seconds = 60 ÷ BPM ÷ 4. A half step = the very next key on a piano, black or white (12 per octave).
   CD-quality stereo WAV: 44,100 samples per second × 2 channels × 2 bytes = 176,400 bytes per second (plus a small header). */

V.steps = function (len, grp, lit, label) { const cols = Math.min(len, 16), s = Math.min(19, 300 / cols), rows = Math.ceil(len / cols); let out = `<text x="10" y="14">${esc(label || '')}</text>`;
  for (let i = 0; i < len; i++) { const c = i % cols, r = Math.floor(i / cols), x = 10 + c * s, y = 24 + r * (s + 8);
    out += `<rect x="${x}" y="${y}" width="${s - 2}" height="${s}" fill="${i < lit ? '#43d6ff' : (Math.floor(i / grp) % 2 ? '#1c1450' : '#120c2e')}" stroke="#7d68ff"/>`;
    if (i % grp === 0) out += `<line x1="${x - 1}" y1="${y - 3}" x2="${x - 1}" y2="${y + s + 3}" stroke="#ffd166" stroke-width="2"/>`; }
  return this.svg(Math.max(320, 20 + cols * s), 30 + rows * (s + 8), out); };
const CHROM = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const tmMount = id => (el, p) => BEAT.mountGrid(el, false, { timing: id });
// fraction-of-a-bar mission builder for each timing
function fracOfBar(cfg) {
  add({ id: cfg.id, route: 'sound', strand: 'math', std: S.g5nf, audio: true, needTiming: cfg.tm,
    gen: r => { const [n, d] = r.pick(cfg.fr); return { n, d, L: cfg.len }; },
    story: cfg.story, q: p => `How many steps is ${p.n}/${p.d} of the bar?`, ans: p => ({ v: p.L * p.n / p.d, unit: 'steps' }),
    nudge: p => `Split the ${p.L} steps into ${p.d} equal parts, then take ${p.n} of them.`,
    vis: p => V.frac(p.n, p.d, `${p.n}/${p.d} of the bar`) + V.steps(p.L, cfg.grp, 0, `one bar of ${cfg.name} = ${p.L} steps`),
    steps: p => [`${p.L} ÷ ${p.d} = steps in one part.`, `Multiply that by ${p.n}.`, `Try it in the grid below: light that many steps and play it.`],
    final: p => `${p.L} ÷ ${p.d} = ${p.L / p.d}, × ${p.n} = ${p.L * p.n / p.d} steps.`,
    sc: cfg.sc, mount: tmMount(cfg.tm) });
}

function buildMC(t, p, a, seed) {
  if (a.choices) { const w = WHY_CHOICE[t.id]; return w ? Object.assign({}, a, { why: a.choices.map((_, i) => i === a.ok ? null : w(p, i)) }) : null; }

  const asFrac = /fraction/i.test(qOf(t, p).replace(/<[^>]+>/g, '')), right = showVal(a.v, a.unit, asFrac), seen = new Set([right]), picks = [];
  for (const [v, why] of TRAPS[t.id](p)) { if (!isFinite(v) || v <= 0 || Math.abs(v - a.v) < 1e-9) continue; const s = showVal(v, a.unit, asFrac); if (seen.has(s)) continue; seen.add(s); picks.push([s, why]); if (picks.length === 3) break; }
  if (picks.length < 3) return null;
  const order = RNG((seed ^ 0x5bd1e995) >>> 0).shuffle([0, 1, 2, 3]), all = [[right, null], ...picks];
  return { choices: order.map(i => all[i][0]), why: order.map(i => all[i][1]), ok: order.indexOf(0), v: a.v, unit: a.unit, mc: true };
}

  gen: r => { const noon = r.int(2, 5), a = noon + r.int(4, 8), b = noon + r.int(4, 8); return { L: [a + r.int(3, 6), a, noon, b, b + r.int(3, 6)] }; },
  story: p => 'You film a time-lapse of a statue\'s shadow and measure it every 2 hours. The Sun is low in the morning, highest around midday, and low again in the evening.',
  q: p => `Shadow lengths: 8 AM ${p.L[0]} m, 10 AM ${p.L[1]} m, 12 PM ${p.L[2]} m, 2 PM ${p.L[3]} m, 4 PM ${p.L[4]} m. How much shorter is the shortest shadow than the 8 AM shadow?`,
  ans: p => ({ v: p.L[0] - p.L[2], unit: 'm' }),
  nudge: p => 'Graph the lengths. Find the lowest point, then compare it to 8 AM.',
  vis: p => V.compare(['8', '10', '12', '2', '4'].map((t, i) => ({ label: t, w: p.L[i] })), 'shadow length by hour'),
  steps: p => ['Find the shortest shadow in the data.', 'Subtract it from the 8 AM length.'],
  final: p => `${p.L[0]} − ${p.L[2]} = ${p.L[0] - p.L[2]} m. Shadows are shortest when the Sun is highest.`,
  sc: [{ s: p => 'CHANNEL HQ time-lapse: KNOMAD films a statue\'s shadow sweeping across the plaza.' },
       { s: p => 'Graph the pattern: shadows are long in the morning, shortest around midday, long again in the afternoon.' }] });

add({ id: 'sci5-shadow-dir', route: 'space', strand: 'science', std: S.s5ess12,
  gen: r => { const t = r.int(0, 2); return { t, m: [
    MCQ(['West', 'East', 'North', 'South'], 0, [null, 'A shadow points away from the Sun. In the morning the Sun is in the east.', 'In the early morning the Sun is low in the east, so the shadow points mostly west.', 'In New York the Sun is never in the north, so shadows never point south.']),
    MCQ(['West', 'East', 'North', 'South'], 1, ['A shadow points away from the Sun. In the late afternoon the Sun is in the west.', null, 'In the late afternoon the Sun is low in the west, so the shadow points mostly east.', 'In New York the Sun is never in the north, so shadows never point south.']),
    MCQ(['West', 'East', 'North', 'South'], 2, ['That would mean the Sun is in the east. At midday it is in the south.', 'That would mean the Sun is in the west. At midday it is in the south.', null, 'In New York the midday Sun is in the southern sky, so shadows point the opposite way.'])][t] }; },
  story: p => 'A shadow always points away from the Sun. The Sun rises in the east, is in the southern sky around midday (seen from New York), and sets in the west.',
  q: p => `In New York, which way does your shadow mostly point ${['in the early morning', 'in the late afternoon', 'around midday'][p.t]}?`, ans: p => ({ choices: p.m.ch, ok: p.m.ok }),
  nudge: p => 'First find where the Sun is. The shadow points the opposite way.',
  vis: p => V.table([['time', 'Sun is in the', 'shadow points'], ['morning', 'east', '?'], ['midday', 'south', '?'], ['evening', 'west', '?']]),
  steps: p => ['Where is the Sun at that time?', 'Turn the opposite way.'],
  final: p => `${p.m.ch[p.m.ok]}. Shadows point away from the Sun.`,
  sc: [{ s: p => 'Shadow tag in the park: your shadow moves across the day because Earth spins.' },
       { s: p => 'KEAZ marks the end of a pole\'s shadow every hour. The pattern repeats every sunny day.' }] });

add({ id: 'sci5-daylight', route: 'space', strand: 'science', std: S.s5ess12,
  gen: r => ({ kind: r.pick(['june', 'dec', 'diff']) }),
  story: p => 'timeanddate: New York gets about 15 hours 5 minutes of daylight on the June solstice and about 9 hours 15 minutes on the December solstice.',
  q: p => p.kind === 'june' ? 'How many minutes of daylight is 15 hours 5 minutes?' : p.kind === 'dec' ? 'How many minutes of daylight is 9 hours 15 minutes?' : 'How many more minutes of daylight does New York get in June than in December?',
  ans: p => ({ v: p.kind === 'june' ? 905 : p.kind === 'dec' ? 555 : 350, unit: 'min' }),
  nudge: p => 'Every hour is 60 minutes. Change hours to minutes first.',
  vis: p => V.compare([{ label: 'June ~15h 5m', w: 905, c: '#ffd166' }, { label: 'Dec ~9h 15m', w: 555, c: '#43d6ff' }], 'New York daylight'),
  steps: p => p.kind === 'diff' ? ['Change both to minutes.', 'Subtract.'] : ['Hours × 60.', 'Add the extra minutes.'],
  final: p => p.kind === 'june' ? '15 × 60 + 5 = 905 minutes.' : p.kind === 'dec' ? '9 × 60 + 15 = 555 minutes.' : '905 − 555 = 350 minutes (5 hours 50 minutes).',
  sc: [{ s: p => 'Why is summer daylight so long? Earth is tilted, so the Sun\'s path across the sky changes with the seasons.' },
       { s: p => 'Planning outdoor filming: June days in New York last about 15 h 5 min; December days about 9 h 15 min (timeanddate).' }] });

add({ id: 'sci6-push-mass', route: 'toy', strand: 'science', std: S.sms22,
  gen: r => ({ F: r.pick([2, 3, 4, 6]), m: r.pick([.5, 1, 2, 4]) }),
  story: p => 'A push (force) changes how fast something speeds up. Scientists write it as acceleration = force ÷ mass. The bigger the mass, the less the same push speeds it up.',
  q: p => `You push a toy car with a force of ${p.F} newtons. The car has a mass of ${p.m} kg. What is its acceleration in meters per second each second?`,
  ans: p => ({ v: p.F / p.m, unit: 'm/s²' }),
  nudge: p => 'Use acceleration = force ÷ mass.',
  vis: p => V.compare([{ label: `${p.F} N push`, w: p.F, c: '#ffd166' }, { label: `${p.m} kg`, w: p.m * 2 }], 'force and mass'),
  steps: p => [`Divide ${p.F} by ${p.m}.`],
  final: p => `${p.F} ÷ ${p.m} = ${fmt(p.F / p.m)} m/s².`,
  sc: [{ s: p => 'Sofubi vs die-cast race: same push, different masses. Heavier toys speed up less.' },
       { s: p => 'Investigation: change one thing (the mass), keep the push the same, and measure how fast the car speeds up.' }] });

add({ id: 'sci6-body-heat', route: 'con', strand: 'science', std: S.sms33,
  gen: r => ({ n: 100 * r.int(2, 30) }),
  story: p => 'Every person gives off heat. Building engineers plan for roughly 100 watts of heat per person at rest, about the same as an old 100-watt light bulb.',
  q: p => `${fmt(p.n)} fans pack the main hall. About how many kilowatts of heat do they give off? (1 kilowatt = 1,000 watts)`, ans: p => ({ v: p.n * 100 / 1000, unit: 'kW' }),
  nudge: p => 'Find the watts first, then change to kilowatts.',
  vis: p => V.compare([{ label: '1 person', w: 1 }, { label: '≈ 100 W', w: 1, c: '#e2231a' }], 'heat from people'),
  steps: p => [`Watts: ${fmt(p.n)} × 100.`, 'Divide by 1,000 for kilowatts.'],
  final: p => `${fmt(p.n)} × 100 = ${fmt(p.n * 100)} W = ${fmt(p.n / 10)} kW.`,
  sc: [{ s: p => 'Why do packed panels get hot? Thermal energy moves from warm bodies into the room air. The hall\'s cooling has to move it out.' },
       { s: p => 'Design challenge: a cooler con hall. First, measure how much heat the crowd adds.' }] });

add({ id: 'sci6-pixels', route: 'channel', strand: 'science', std: S.sms42,
  gen: r => { const [w, h, n] = r.pick([[1920, 1080, 'HD 1080p'], [1280, 720, 'HD 720p'], [3840, 2160, '4K']]); return { w, h, n }; },
  story: p => 'Screens make every color by mixing red, green and blue light. Each pixel has 3 tiny lights, called subpixels: one red, one green, one blue.',
  q: p => `A ${p.n} screen is ${fmt(p.w)} pixels wide and ${fmt(p.h)} pixels tall. How many subpixels (red, green and blue lights) does it have?`, ans: p => ({ v: p.w * p.h * 3, unit: 'subpixels' }),
  nudge: p => 'Find all the pixels first, then multiply by the lights in each pixel.',
  vis: p => V.compare([{ label: 'R', w: 1, c: '#e2231a' }, { label: 'G', w: 1, c: '#1f8a4c' }, { label: 'B', w: 1, c: '#2f6fd6' }], 'one pixel = 3 subpixels'),
  steps: p => [`Pixels: ${fmt(p.w)} × ${fmt(p.h)}.`, 'Multiply by 3.'],
  final: p => `${fmt(p.w)} × ${fmt(p.h)} = ${fmt(p.w * p.h)} pixels, × 3 = ${fmt(p.w * p.h * 3)} subpixels.`,
  sc: [{ s: p => 'Your channel uploads in HD. Up close, every color on screen is red, green and blue light mixed.' },
       { s: p => 'Light from the screen travels to your eyes; the mix of red, green and blue tells your brain the color.' }] });

add({ id: 'sci6-brake', route: 'subway', strand: 'science', std: S.sms22,
  gen: r => { const rt = r.pick([2, 3, 4, 5]), k = r.int(4, 10); return { rt, v: rt * k }; },
  story: p => 'Brakes push against the motion of the train. That force slows it down; friction turns the motion energy into heat in the brakes.',
  q: p => `A train going ${p.v} mph slows down ${p.rt} mph every second. How many seconds until it stops?`, ans: p => ({ v: p.v / p.rt, unit: 's' }),
  nudge: p => 'How many equal slow-downs fit into the whole speed?',
  vis: p => V.compare(Array.from({ length: Math.min(10, p.v / p.rt) }, () => ({ label: `−${p.rt}`, w: 1 })), `from ${p.v} mph to 0`),
  steps: p => [`Divide ${p.v} by ${p.rt}.`],
  final: p => `${p.v} ÷ ${p.rt} = ${p.v / p.rt} seconds.`,
  sc: [{ s: p => 'Heavier trains need more braking force to stop in the same time. Here the braking is steady.' },
       { s: p => 'SUBWAY COMMAND: a steady braking force means the speed drops by the same amount every second.' }] });

add({ id: 'sci6-kick-energy', route: 'football', strand: 'science', std: S.sms31,
  gen: r => ({ v: r.pick([5, 10, 15, 20, 25]), k: r.pick([2, 3]) }),
  story: p => 'Kinetic energy is the energy of motion: KE = ½ × mass × speed × speed. A 0.4 kg ball (match balls weigh 410-450 g) is used here.',
  q: p => `A 0.4 kg ball flies at ${p.v} m/s. Its kinetic energy is ½ × 0.4 × ${p.v} × ${p.v}. If you kick it ${p.k} times as fast, how many times more kinetic energy does it have?`,
  ans: p => ({ v: p.k * p.k, unit: 'times' }),
  nudge: p => 'Speed is multiplied by itself in the formula. Try it with the new speed.',
  vis: p => V.compare([1, 2, 3].map(s => ({ label: `${s}× speed: ${s * s}× KE`, w: s * s })), 'kinetic energy grows faster than speed'),
  steps: p => [`New speed: ${p.k} × ${p.v}.`, 'Speed is squared, so the energy grows by that factor squared.'],
  final: p => `${p.k} × ${p.k} = ${p.k * p.k} times the kinetic energy.`,
  sc: [{ s: p => 'Graph it: kinetic energy vs speed curves upward. Doubling the speed gives 4 times the energy.' },
       { s: p => 'Why a hard shot stings the keeper\'s hands: a little more speed means a lot more energy.' }] });

  steps: p => ['Copper in one coin: 75% of 5 g.', `Multiply by ${p.n}.`],
  final: p => `75% of 5 = 3.75 g. × ${p.n} = ${fmt(p.n * 3.75)} g of copper.`,

add({ id: 'sci6-ice-expand', route: 'kitchen', strand: 'science', std: S.sms14,
  gen: r => ({ ml: 100 * r.int(1, 10) }),
  story: p => 'Water is unusual: it expands when it freezes, by about 9%. That is why ice floats and why a full sealed bottle can crack in the freezer.',
  q: p => `You freeze ${p.ml} mL of water for smoothie ice cubes. About how many mL of space will the ice take up?`, ans: p => ({ v: p.ml * 1.09, unit: 'mL', tol: .51 }),
  nudge: p => 'Add 9% of the water to the water.',
  vis: p => V.compare([{ label: 'water', w: 100, c: '#43d6ff' }, { label: 'ice', w: 109, c: '#9be9ff' }], 'same water, more space when frozen'),
  steps: p => [`9% of ${p.ml}.`, 'Add it to the original amount.'],
  final: p => `${p.ml} + ${fmt(p.ml * .09)} = ${fmt(p.ml * 1.09)} mL.`,
  sc: [{ s: p => 'When water freezes, its particles lock into a spread-out pattern, so ice takes more space than the water did.' },
       { s: p => 'Freezing Mom\'s green juice: leave room in the container, because water expands about 9% as it freezes.' }] });

add({ id: 'snd-harmonics', route: 'sound', strand: 'science', std: S.sms41, audio: true,
  gen: r => ({ f: r.pick([55, 110, 131, 165, 220]), n: r.int(2, 6) }),
  story: p => 'A plucked string (like a SHAMISEN or KOTO) vibrates in many patterns at once. The harmonics are whole-number multiples of the lowest frequency, called the fundamental.',
  q: p => `A string's fundamental is ${p.f} Hz. What is the frequency of harmonic number ${p.n}?`, ans: p => ({ v: p.f * p.n, unit: 'Hz' }),
  nudge: p => 'Harmonic number n is n times the fundamental.',
  vis: p => V.compare([1, 2, 3, 4].map(n => ({ label: `${n}× ${p.f * n}`, w: n })), 'harmonics stack up'),
  steps: p => [`Multiply ${p.f} by ${p.n}.`],
  final: p => `${p.f} × ${p.n} = ${p.f * p.n} Hz.`,
  sc: [{ s: p => 'Why do HARP and SHAMISEN sound different on the same note? Their harmonics have different strengths.' },
       { s: p => 'Harmonic 2 is an octave above the fundamental; harmonic 3 is an octave and a fifth.' }] });

add({ id: 'snd-materials', route: 'sound', strand: 'science', std: S.sms42,
  gen: r => ({ m: r.pick([['water', 1481], ['iron', 5120]]) }),
  story: p => 'Sound travels through materials, not just air. About 343 m/s in air (20°C), about 1,481 m/s in water and about 5,120 m/s in iron.',
  q: p => `About how many times faster does sound travel through ${p.m[0]} than through air? Round to the nearest tenth.`, ans: p => ({ v: Math.round(p.m[1] / 343 * 10) / 10, unit: 'times', tol: .051 }),
  nudge: p => '"How many times" means divide.',
  vis: p => V.compare([{ label: 'air 343', w: 343 }, { label: `${p.m[0]} ${fmt(p.m[1])}`, w: p.m[1], c: '#9a5cff' }], 'speed of sound, m/s'),
  steps: p => [`Divide ${fmt(p.m[1])} by 343.`, 'Round to the nearest tenth.'],
  final: p => `${fmt(p.m[1])} ÷ 343 ≈ ${fmt(Math.round(p.m[1] / 343 * 10) / 10)} times faster.`,
  sc: [{ s: p => 'Put your ear on a metal rail and you can hear a far-off clank sooner than through the air.' },
       { s: p => 'Whales hear each other over long distances because sound moves fast and far in water.' }] });

add({ id: 'snd-doppler', route: 'sound', strand: 'science', std: S.sms41,
  gen: r => { const q = r.int(0, 1); return { q, m: q === 0 ? MCQ(['Higher', 'Lower', 'The same'], 0, [null, 'Lower pitch happens when the source moves away and the waves spread out.', 'Moving changes how often the waves reach you, so the pitch changes.']) : MCQ(['Lower', 'Higher', 'The same'], 0, [null, 'Higher pitch happens when the source moves toward you and the waves bunch up.', 'Moving changes how often the waves reach you, so the pitch changes.']) }; },
  story: p => 'The Doppler effect: when a sound source moves toward you, the sound waves bunch up (higher frequency, higher pitch). When it moves away, they spread out (lower pitch).',
  q: p => p.q === 0 ? 'A Rider bike with a siren speeds TOWARD you. Compared with standing still, its pitch sounds:' : 'The siren passes you and speeds AWAY. Its pitch now sounds:',
  ans: p => ({ choices: p.m.ch, ok: p.m.ok }),
  nudge: p => 'Bunched-up waves mean more waves reach you each second.',
  vis: p => V.svg(300, 124, [0, 1, 2, 3, 4, 5].map(i => `<circle cx="${180 - i * 8}" cy="48" r="${8 + i * 8}" fill="none" stroke="#43d6ff"/>`).join('') + '<circle cx="180" cy="48" r="4" fill="#ffd166"/><text x="10" y="108" font-size="11" fill="#ece6ff">siren moving right: waves bunch up in front</text><text x="10" y="121" font-size="11" fill="#ece6ff">and spread out behind</text>'),
  steps: p => ['Moving toward you: waves bunch together.', 'Moving away: waves spread apart.'],
  final: p => `${p.m.ch[p.m.ok]}.`,
  sc: [{ s: p => 'Ambulances on Grand Concourse: the siren drops in pitch the moment it passes you.' },
       { s: p => 'Race cars on TV: "neeeoowww." That drop in pitch is the Doppler effect.' }] });

add({ id: 'snd-amplitude', route: 'sound', strand: 'science', std: S.sms41, audio: true,

  story: p => 'Amplitude is how big a wave\'s swings are; for sound, bigger amplitude sounds louder. The energy a wave carries grows with amplitude × amplitude.',

  final: p => `${p.k} × ${p.k} = ${p.k * p.k} times the energy.`,

add({ id: 'snd-speaker', route: 'sound', strand: 'science', std: S.sms41, audio: true,

const EQ = { s: null, hist: [], log: [], tier: 2, step: 0, g: 5, sym: '□' };

function eqNew() {
  const r = RNG(newSeed(), ST.mode); EQ.tier = EQ.g <= 6 ? 1 : EQ.g === 7 ? r.pick([2, 3]) : 4; EQ.sym = EQ.g === 5 ? '□' : 'x'; const t = EQ.tier; let a, b, d = 0, e, x;
  if (t === 1) { x = r.int(1, 15); if (r.next() < .5) { a = 1; b = r.int(1, 20); } else { a = r.int(2, 9); b = 0; } e = a * x + b; }
  else if (t === 2) { x = r.int(1, 12); a = r.int(2, 9); b = r.int(1, 20); e = a * x + b; }
  else if (t === 3) { x = r.int(-10, 10); a = r.int(2, 9); do { b = r.int(-20, 20); } while (!b); e = a * x + b; }
  else { x = r.int(-8, 12); d = r.int(1, 5); a = d + r.int(1, 6); b = r.int(-12, 12); e = (a - d) * x + b; }
  EQ.s = { a, b, d, e }; EQ.hist = []; EQ.log = []; EQ.step = 0; EQ.done = false; EQ.x = x;
}
function side(a, b) {
  let s = ''; if (a) s += (a === 1 ? '' : a === -1 ? '−' : String(a).replace('-', '−')) + '<span class="x">' + EQ.sym + '</span>';
  if (b) s += (s ? (b < 0 ? ' − ' : ' + ') + Math.abs(b) : String(b).replace('-', '−'));

}
function eqMoves() {
  const { a, b, d } = EQ.s, out = [];
  if (d) { const k = d; out.push({ txt: `${k > 0 ? '−' : '+'} ${Math.abs(k) === 1 ? '' : Math.abs(k)}x both sides`, kind: 'good', fn: s => ({ ...s, a: s.a - k, d: 0 }), why: `${k > 0 ? 'Subtracted' : 'Added'} ${Math.abs(k)}x on both sides. Now x only lives on the left.` });
    out.push({ txt: `${k > 0 ? '−' : '+'} ${Math.abs(k) === 1 ? '' : Math.abs(k)}x left side only`, kind: 'bad' });
    out.push({ txt: `${k > 0 ? '+' : '−'} ${Math.abs(k) === 1 ? '' : Math.abs(k)}x both sides`, kind: 'meh', fn: s => ({ ...s, a: s.a + k, d: s.d + k }), why: 'Legal, the scale stays balanced, but now there is even more x on the right.' }); }
  else if (b) { out.push({ txt: `${b > 0 ? '−' : '+'} ${Math.abs(b)} both sides`, kind: 'good', fn: s => ({ ...s, b: 0, e: s.e - b }), why: `${b > 0 ? 'Subtracted' : 'Added'} ${Math.abs(b)} on both sides. The constant cancels on the left.` });
    out.push({ txt: `${b > 0 ? '−' : '+'} ${Math.abs(b)} left side only`, kind: 'bad' });
    out.push({ txt: `${b > 0 ? '+' : '−'} ${Math.abs(b)} both sides`, kind: 'meh', fn: s => ({ ...s, b: s.b + b, e: s.e + b }), why: 'Legal, the scale stays balanced, but the constant got bigger instead of disappearing.' }); }
  else if (a !== 1) { out.push({ txt: `÷ ${a} both sides`, kind: 'good', fn: s => ({ ...s, a: 1, e: s.e / a }), why: `Divided both sides by ${a}. One ${EQ.sym} is left, and its value is on the right.` });

    out.push({ txt: `− ${a} both sides`, kind: 'meh', fn: s => ({ ...s, b: s.b - a, e: s.e - a }), why: `Legal, but ${a}${EQ.sym} means ${a} times ${EQ.sym}. Subtracting does not undo multiplying.` }); }

}
function eqBalance(tilt) {

/* ---------- FUN CHARTS report + backup merge ---------- */
function funReport() {
  const days = Object.keys(ST.days).sort(); if (!days.length) return 'No sessions logged yet.';
  return days.map(k => { const d = ST.days[k]; const topics = Object.keys(d.stds); return `${k} | ALIEN HERO MATHSCAPES | Mathematics: ${Math.round(d.math / 60)} min | Science: ${Math.round(d.sci / 60)} min | Solved ${d.solved} of ${d.att} tries${topics.length ? ' | Topics: ' + topics.join('; ') : ''}`; }).join('\n');
}
function importBackup(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return { ok: false, text: 'That file is not readable JSON.' }; }
  if (!data || data.app !== 'ALIEN HERO MATHSCAPES' || !data.state) return { ok: false, text: 'That is not an ALIEN HERO MATHSCAPES backup.' };
  const b = data.state, before = ST.xp; (b.journal || []).forEach(x => { ST.journal = ST.journal || []; if (!ST.journal.some(y => y.t === x.t)) ST.journal.push(x); }); ST.xp = Math.max(ST.xp, b.xp || 0); ST.eqDone = Math.max(ST.eqDone, b.eqDone || 0); if (b.gmax) ST.gmax = Math.max(ST.gmax, b.gmax);
  (b.rates || []).forEach(x => { if (!ST.rates.some(y => y.t === x.t && y.code === x.code)) ST.rates.push(x); });
  Object.entries(b.stats || {}).forEach(([id, s]) => { const m = stat(id); ['a', 'c', 'r', 'h'].forEach(k => m[k] = Math.max(m[k], s[k] || 0)); if (s.scs) m.scs = [...new Set([...(m.scs || []), ...s.scs])]; if (s.best) m.best = m.best ? Math.min(m.best, s.best) : s.best; });
  let addedDays = 0; Object.entries(b.days || {}).forEach(([k, d]) => { if (!ST.days[k]) { ST.days[k] = { math: 0, sci: 0, solved: 0, att: 0, ret: 0, stds: {} }; addedDays++; } const m = ST.days[k]; ['math', 'sci', 'solved', 'att', 'ret'].forEach(f => m[f] = Math.max(m[f], d[f] || 0)); Object.entries(d.stds || {}).forEach(([s, n]) => m.stds[s] = Math.max(m.stds[s] || 0, n)); });
  (b.rematch || []).forEach(x => { if (!ST.rematch.some(y => y.tid === x.tid && y.seed === x.seed)) ST.rematch.push(x); });
  (b.watches || []).forEach(w => { if (!ST.watches.includes(w)) ST.watches.push(w); });
  if ((!ST.forge || !ST.forge.length) && b.forge) ST.forge = b.forge;
  save(); return { ok: true, text: `Merged. XP ${fmt(before)} → ${fmt(ST.xp)}. ${addedDays} new day${addedDays === 1 ? '' : 's'} added. Nothing was deleted.` };
}

function KF3D_make(THREE) {
const TAU = Math.PI * 2;
const PAL = {ink:0x221633, paper:0xFFF8EE, lav:0xB79CF2, lime:0xC8F25A, butter:0xFFE680, gum:0xFF8FCF, sky:0x8FD8FF, peach:0xFFB38A, mint:0x9FF2D0, grape:0x6B4FB8, blue:0x5B8DEF};
function setCast(o, recv=true){ o.traverse(m=>{ if(m.isMesh && !m.userData.isOutline && !m.isSprite){ m.castShadow=true; m.receiveShadow=recv; } }); return o; }
const gradMap = (()=>{ const t=new THREE.DataTexture(new Uint8Array([95,175,235]),3,1,(THREE.LuminanceFormat || THREE.RedFormat)); t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.needsUpdate=true; return t; })();
const matCache = {};
function toon(color){ const k='t'+color; return matCache[k] || (matCache[k]=new THREE.MeshToonMaterial({color, gradientMap:gradMap})); }
function gloss(color, opacity=0.86, extra={}){
  return new THREE.MeshPhysicalMaterial(Object.assign({color, roughness:0.14, metalness:0.0, clearcoat:1, clearcoatRoughness:0.08, transparent:opacity<1, opacity, envMapIntensity:.7}, extra));
}
const inkMat = new THREE.MeshBasicMaterial({color:PAL.ink, side:THREE.BackSide});
function outline(mesh, s=1.07){
  const o=new THREE.Mesh(mesh.geometry, inkMat); o.scale.setScalar(s); o.userData.isOutline=true; mesh.add(o); return mesh;
}
function tmesh(geo, color, ol=1.07){ const m=new THREE.Mesh(geo, toon(color)); if(ol) outline(m, ol); return m; }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x,w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t; }
const blobTex = canvasTex(128,128,(x,w,h)=>{ const g=x.createRadialGradient(64,64,4,64,64,62); g.addColorStop(0,'rgba(34,22,51,.38)'); g.addColorStop(1,'rgba(34,22,51,0)'); x.fillStyle=g; x.fillRect(0,0,w,h); });
function blobShadow(r){ const m=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2), new THREE.MeshBasicMaterial({map:blobTex, transparent:true, depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.y=0.04; m.renderOrder=1; return m; }
function starShape(R,r,n=4){ const s=new THREE.Shape(); for(let i=0;i<n*2;i++){ const a=i*Math.PI/n - Math.PI/2; const rr=i%2?r:R; const x=Math.cos(a)*rr, y=Math.sin(a)*rr; i?s.lineTo(x,y):s.moveTo(x,y);} s.closePath(); return s; }
function makeKeaz() {
  const root=new THREE.Group(), body=new THREE.Group(); root.add(body);
  const green=0xB9D94A, pale=0xDCEBFF;
  const torso=tmesh(new THREE.SphereGeometry(1.1,28,20), green); torso.scale.set(1,1.15,.95); torso.position.y=1.55; body.add(torso);
  const belly=tmesh(new THREE.SphereGeometry(.7,20,14), 0xD6EC7A, 0); belly.scale.set(1,1.1,.5); belly.position.set(0,1.35,.72); body.add(belly);
  // abs lines
  for(let i=0;i<2;i++){ const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.05), new THREE.MeshBasicMaterial({color:PAL.ink})); l.position.set(0,1.2+i*.28,1.04); body.add(l); }
  const head=tmesh(new THREE.SphereGeometry(.95,28,20), green); head.position.y=2.75; body.add(head);
  // mouth ring of teeth around the eye
  for(let i=0;i<14;i++){ const a=i/14*TAU; const t=tmesh(new THREE.ConeGeometry(.08,.22,5), 0xFFFFFF, 1.12); t.position.set(Math.cos(a)*.62, 2.8+Math.sin(a)*.62, .78); t.rotation.z=a+Math.PI/2; body.add(t); }
  const eye=tmesh(new THREE.SphereGeometry(.5,24,16), 0xFFFFFF); eye.position.set(0,2.8,.62); body.add(eye);
  const iris=new THREE.Mesh(new THREE.SphereGeometry(.26,16,12), toon(0xC9A23A)); iris.position.set(0,2.8,1.02); iris.scale.z=.5; body.add(iris);
  const pup=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8), new THREE.MeshBasicMaterial({color:PAL.ink})); pup.position.set(0,2.8,1.12); pup.scale.z=.5; body.add(pup);
  const shine=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6), new THREE.MeshBasicMaterial({color:0xffffff})); shine.position.set(.08,2.9,1.17); body.add(shine);
  // star-burst spikes (crystal stars)
  const starGeo=new THREE.ExtrudeGeometry(starShape(.6,.2), {depth:.18, bevelEnabled:true, bevelSize:.04, bevelThickness:.04, bevelSegments:1});
  [[-.9,3.55,-.1,.4],[.9,3.55,-.1,-.4],[-1.25,2.9,-.2,.9],[1.25,2.9,-.2,-.9]].forEach(([x,y,z,r])=>{ const s=new THREE.Mesh(starGeo, gloss(pale,.95,{emissive:0xDCEBFF,emissiveIntensity:.25})); outline(s,1.08); s.position.set(x,y,z); s.rotation.set(0,r*.4,r); body.add(s); });
  // bat-wing hands
  const wingShape=new THREE.Shape(); wingShape.moveTo(0,0); wingShape.lineTo(1.3,.5); wingShape.lineTo(1.1,-.1); wingShape.lineTo(1.5,-.5); wingShape.lineTo(.9,-.55); wingShape.lineTo(.9,-1); wingShape.lineTo(.3,-.6); wingShape.closePath();
  const wg=new THREE.ExtrudeGeometry(wingShape,{depth:.12,bevelEnabled:false});
  const wings=[];
  for(const s of [-1,1]){ const w=tmesh(wg, 0xA8CC3E); w.scale.set(s,1,1); w.position.set(s*.95,1.9,.1); body.add(w); wings.push(w); }
  const legs=[];
  for(const s of [-1,1]){ const l=tmesh(new THREE.CylinderGeometry(.28,.34,.8,12), green); l.position.set(s*.45,.45,0); body.add(l); const f=tmesh(new THREE.SphereGeometry(.38,14,10), 0xA8CC3E); f.scale.set(1,.55,1.3); f.position.set(s*.45,.12,.12); body.add(f); legs.push([l,f]); }
  setCast(body, false); return { root, body };
}

// Front features match each card; backs are simple rounded shapes; each Kaiju has its own fixed tail style.
const CHIBI_TAILS = { TREBUE:'one', BARRY_GONE:'booty', MONGA:'three', HEY_LOOR:'nubs', BAD_PLANTAN:'two', DANOG:'booty', TAGANULAR_EYEZED:'none', DURGESS:'one', EYEZEAZE:'nubs', TILDAHYDE:'booty' };

function cx_sph(r,c,ol=1.07,ws=22,hs=16){ return tmesh(new THREE.SphereGeometry(r,ws,hs), c, ol); }
function cx_eye(G, x,y,z, r, white=0xFFFFFF, iris=null, pupil=PAL.ink, look=0){
  const e=cx_sph(r,white,1.12,18,14); e.position.set(x,y,z); e.scale.z=.7; G.add(e);
  if(iris!==null){ const i=new THREE.Mesh(new THREE.SphereGeometry(r*.58,14,10), toon(iris)); i.position.set(x,y+look,z+r*.5); i.scale.z=.45; G.add(i); }
  const p=new THREE.Mesh(new THREE.SphereGeometry(r*(iris!==null?.3:.42),12,8), new THREE.MeshBasicMaterial({color:pupil})); p.position.set(x,y+look,z+r*.66); p.scale.z=.4; G.add(p);
  const s=new THREE.Mesh(new THREE.SphereGeometry(r*.12,8,6), new THREE.MeshBasicMaterial({color:0xffffff})); s.position.set(x+r*.18,y+r*.22+look,z+r*.72); G.add(s);
  return e;
}
function cx_fang(G,x,y,z,s=1,c=0xFFFFFF){ const f=tmesh(new THREE.ConeGeometry(.1*s,.32*s,5),c,1.12); f.position.set(x,y,z); f.rotation.x=Math.PI; G.add(f); return f; }
function cx_limb(G,x,y,z,len,r,c,rotZ,rotX=0){ const l=tmesh(new THREE.CylinderGeometry(r,r*1.1,len,10),c); l.geometry.translate(0,-len/2,0); l.position.set(x,y,z); l.rotation.set(rotX,0,rotZ); G.add(l); return l; }
function cx_feet(G,c,w=.42,y=.14,r=.3){ const out=[]; for(const s of [-1,1]){ const f=cx_sph(r,c,1.08); f.scale.set(1.1,.6,1.35); f.position.set(s*w,y,.08); G.add(f); out.push(f);} return out; }
function cx_tail(G,type,c,y=.9,z=-.7){
  const T=new THREE.Group(); T.position.set(0,y,z); G.add(T);
  const one=(ang,len)=>{ const t=new THREE.Group(); const seg=[.24,.2,.16,.12]; let py=0; seg.forEach((r,i)=>{ const b=cx_sph(r,c,1.1,12,8); b.position.set(0,i*.12,-i*.22-.1); t.add(b); }); const tip=tmesh(new THREE.ConeGeometry(.12,.3,6),c,1.12); tip.position.set(0,.5,-.98); tip.rotation.x=-1; t.add(tip); t.rotation.y=ang; t.scale.setScalar(len); T.add(t); };
  if(type==='one') one(0,1);
  if(type==='two'){ one(.38,.9); one(-.38,.9); }
  if(type==='three'){ one(.5,.85); one(0,1); one(-.5,.85); }
  if(type==='nubs'){ for(const s of [-1,0,1]){ const n=cx_sph(.13,c,1.12,10,8); n.position.set(s*.22,s?0:.1,-.05); T.add(n);} }
  if(type==='booty'){ for(const s of [-1,1]){ const b=cx_sph(.32,c,1.07,16,12); b.position.set(s*.26,-.1,.02); T.add(b);} }
  return T;
}
function cx_stripes(base, line, n=6, vertical=false){ const t=canvasTex(128,128,(x,w,h)=>{ x.fillStyle=base; x.fillRect(0,0,w,h); x.fillStyle=line; for(let i=0;i<n;i++){ if(vertical) x.fillRect(i*w/n, 0, w/n*.35, h); else x.fillRect(0, i*h/n, w, h/n*.35);} }); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
function cx_grid(base, line){ const t=canvasTex(128,128,(x,w,h)=>{ x.fillStyle=base; x.fillRect(0,0,w,h); x.strokeStyle=line; x.lineWidth=5; for(let i=0;i<=8;i++){ x.beginPath(); x.moveTo(i*16,0); x.lineTo(i*16,h); x.stroke(); x.beginPath(); x.moveTo(0,i*16); x.lineTo(w,i*16); x.stroke(); } }); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
// tube with an ink outline that hugs it (scaling an outline would push it off the curve)
function cx_tube(B, pts, r, c){ const curve=new THREE.CatmullRomCurve3(pts); const m=new THREE.Mesh(new THREE.TubeGeometry(curve,40,r,10,false), toon(c)); const o=new THREE.Mesh(new THREE.TubeGeometry(curve,40,r*1.28,10,false), inkMat); o.userData.isOutline=true; B.add(m,o); const tip=cx_sph(r,c,1.15,10,8); tip.position.copy(pts[pts.length-1]); B.add(tip); return m; }
function cx_texMesh(geo, tex, ol=1.07){ const m=new THREE.Mesh(geo, new THREE.MeshToonMaterial({map:tex, gradientMap:gradMap})); if(ol) outline(m,ol); return m; }

/* ---------- SHA-256 (sync, works on file://, http and https) ---------- */
const sha256 = (() => {
  const K = [], H0 = []; let n = 2, found = 0;
  const isPrime = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  const fr = x => ((x - Math.floor(x)) * 4294967296) >>> 0;
  while (found < 64) { if (isPrime(n)) { if (found < 8) H0[found] = fr(Math.pow(n, 1 / 2)); K[found] = fr(Math.pow(n, 1 / 3)); found++; } n++; }
  const rotr = (x, r) => (x >>> r) | (x << (32 - r));
  return str => {
    const bytes = new TextEncoder().encode(str), l = bytes.length;
    const buf = new Uint8Array(((l + 9 + 63) >> 6) << 6); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer); dv.setUint32(buf.length - 4, (l * 8) >>> 0); dv.setUint32(buf.length - 8, Math.floor(l * 8 / 4294967296));
    const H = H0.slice(), w = new Uint32Array(64);
    for (let o = 0; o < buf.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) { const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0; }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) { const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
      [a, b, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) >>> 0);
    }
    return H.map(x => x.toString(16).padStart(8, '0')).join('');
  };
})();

/* ---------- storage: one Guider record for every KFL app on this address ---------- */
const GKEY = 'kfl_guider';
const G = {
  read() { try { return JSON.parse(localStorage.getItem(GKEY) || 'null'); } catch (e) { return null; } },
  write(r) { try { localStorage.setItem(GKEY, JSON.stringify(r)); return true; } catch (e) { return false; } },
  funPin() { try { return localStorage.getItem('kffc_pin') || ''; } catch (e) { return ''; } },
  rand(n, abc) { const a = new Uint32Array(n); try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.random() * 4294967296; } return [...a].map(x => abc[x % abc.length]).join(''); },
  code() { const s = this.rand(8, 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'); return 'KAIJU-' + s.slice(0, 4) + '-' + s.slice(4); },
  norm(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]/g, ''); },
  set(pin) { const salt = this.rand(16, '0123456789abcdef'), code = this.code(); const r = { v: 1, salt, ph: sha256(salt + ':' + pin), rh: sha256(salt + ':' + this.norm(code)), fails: 0, until: 0 }; return this.write(r) ? code : null; },
  check(pin) { const r = this.read(); return !!r && sha256(r.salt + ':' + pin) === r.ph; },
  checkCode(c) { const r = this.read(); return !!r && sha256(r.salt + ':' + this.norm(c)) === r.rh; },
  newCode() { const r = this.read(); if (!r) return null; const code = this.code(); r.rh = sha256(r.salt + ':' + this.norm(code)); return this.write(r) ? code : null; },
  fail() { const r = this.read(); if (!r) return; r.fails = (r.fails || 0) + 1; if (r.fails >= 5) { r.until = Date.now() + 5 * 60000; r.fails = 0; } this.write(r); },
  ok() { const r = this.read(); if (r) { r.fails = 0; r.until = 0; this.write(r); } },
  lockedFor() { const r = this.read(); return r && r.until > Date.now() ? Math.ceil((r.until - Date.now()) / 1000) : 0; }
};

/* ---------- PIN pad overlay ---------- */
function pinPad(title, sub, onDone, extra) {
  let v = ''; const o = overlay(`<h2>${title}</h2><p class="sub" id="ppSub">${sub}</p>
    <div class="row" style="justify-content:center;gap:12px;margin:14px 0" id="ppDots">${[0, 1, 2].map(i => `<span class="pindot" data-i="${i}"></span>`).join('')}</div>
    <div class="keypad" style="max-width:300px;margin:0 auto;grid-template-columns:repeat(3,1fr)">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✕'].map(k => `<button data-pk="${k}" aria-label="${k === '✕' ? 'cancel' : k === '⌫' ? 'delete' : k}">${k}</button>`).join('')}</div>
    <div class="feedback try" id="ppFb" style="text-align:center"></div>${extra || ''}`);
  const dots = () => o.querySelectorAll('.pindot').forEach((d, i) => d.classList.toggle('on', i < v.length));
  o.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { const k = b.dataset.pk; AUD.tap();
    if (k === '✕') return closeOverlay(); if (k === '⌫') { v = v.slice(0, -1); dots(); return; }
    if (v.length < 3) { v += k; dots(); } if (v.length === 3) { const pin = v; setTimeout(() => { v = ''; dots(); onDone(pin, o); }, 120); } });
  return o;
}
function ppMsg(o, m) { const f = $('#ppFb', o); if (f) f.textContent = m; }
function showCode(code, then) {
  const o = overlay(`<div class="tag red">RECOVERY CODE</div><h2 style="margin-top:10px">SAVE THIS CODE</h2><p>If you ever forget the Guider PIN, this code lets you set a new one. Screenshot it or write it down and keep it where your learner cannot find it.</p>
    <div class="eqtext mono" style="font-size:clamp(22px,6vw,32px);margin:12px 0;user-select:all">${code}</div><p class="sub">It will not be shown again.</p>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="scOk">I SAVED IT</button></div>`, 'noback');
  $('#scOk', o).onclick = () => { closeOverlay(); then && then(); };
}
function createPin(then) {
  pinPad('CREATE A GUIDER PIN', 'Choose 3 digits. This PIN opens the Guider area in every KFL app on this address.', (p1, o) => {
    ppMsg(o, ''); pinPad('CONFIRM THE PIN', 'Enter the same 3 digits again.', (p2, o2) => {
      if (p1 !== p2) return ppMsg(o2, 'Those PINs did not match. Tap ✕ and start again.');
      const code = G.set(p1); if (!code) return ppMsg(o2, 'This device would not save the PIN. Check that site data is allowed.');
      GUIDER_OPEN = true; showCode(code, then);
    });
  });
}
function forgotFlow(then) {
  const o = overlay(`<h2>FORGOT THE PIN</h2><p>Enter the recovery code you saved when the PIN was made.</p>
    <div class="field"><label for="rcIn"><b>Recovery code</b></label><input id="rcIn" class="mono" autocomplete="off" autocapitalize="characters" placeholder="KAIJU-XXXX-XXXX"></div>
    <div class="feedback try" id="rcFb"></div><div class="row" style="justify-content:center"><button class="btn primary" id="rcGo">CHECK CODE</button><button class="btn ghost" id="rcX">CANCEL</button></div>`);
  $('#rcX', o).onclick = closeOverlay;
  $('#rcGo', o).onclick = () => { const wait = G.lockedFor(); if (wait) { $('#rcFb', o).textContent = `Too many tries. Wait ${Math.ceil(wait / 60)} minute${wait > 60 ? 's' : ''}.`; return; }
    if (G.checkCode($('#rcIn', o).value)) { G.ok(); createPin(then); } else { G.fail(); $('#rcFb', o).textContent = 'That code does not match. Check each character and try again.'; } };
}
function guiderGate(then) {
  if (GUIDER_OPEN) return then();
  const rec = G.read(), fun = G.funPin();
  if (!rec && !fun) return createPin(then);
  const viaFun = !rec && fun;
  const o = pinPad('GUIDER PIN', viaFun ? 'Enter your FUN CHARTS Guider PIN. It will open this app too.' : 'Enter the 3-digit Guider PIN.', (pin, ov) => {
    const wait = G.lockedFor(); if (wait) return ppMsg(ov, `Locked after 5 wrong tries. Try again in ${Math.ceil(wait / 60)} minute${wait > 60 ? 's' : ''}.`);
    if (viaFun) { if (pin === fun) { const code = G.set(pin); GUIDER_OPEN = true; return code ? showCode(code, then) : (closeOverlay(), then()); } return ppMsg(ov, 'That is not the PIN.'); }
    if (G.check(pin)) { G.ok(); GUIDER_OPEN = true; closeOverlay(); then(); }
    else { G.fail(); const w2 = G.lockedFor(); ppMsg(ov, w2 ? 'Locked for 5 minutes after 5 wrong tries.' : 'That is not the PIN.'); }
  }, viaFun ? '' : `<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost small" id="ppForgot">FORGOT PIN?</button></div>`);
  if ($('#ppForgot', o)) $('#ppForgot', o).onclick = () => forgotFlow(then);
}

  app().querySelectorAll('[data-gg]').forEach(b => b.onclick = () => { ST.gmax = +b.dataset.gg; ST.gplay = ST.gmax; save(); toast('Unlocked grade set to ' + ST.gmax); guiderScreen(); });
  $('#cp').onclick = () => { const t = $('#rep').value; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Report copied'), () => { $('#rep').select(); document.execCommand && document.execCommand('copy'); toast('Report copied'); }); };
  $('#dl').onclick = () => deliverFile(`MATHSCAPES_report_${today()}.txt`, funReport(), 'text/plain');
  $('#gPin').onclick = () => createPin(guiderScreen);
  $('#gCode').onclick = () => { const c = G.newCode(); if (c) showCode(c, guiderScreen); };
}
LABS.guider = () => guiderGate(guiderScreen);

/* ---------- RATE LOG ---------- */
function rateChart(code) {
  const pts = ST.rates.filter(x => x.code === code).sort((a, b) => (a.date + a.t).localeCompare(b.date + b.t));
  if (pts.length < 2) return `<p class="note">Log 2 or more ${CURR[code].n} rates on different days to see how it moves.</p>`;
  const W = 340, H = 150, vs = pts.map(p => p.rate), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || hi * .01 || 1;
  const xy = pts.map((p, i) => [30 + i * (W - 50) / (pts.length - 1), 20 + (hi - p.rate) / span * (H - 50)]);
  return V.svg(W, H, `<polyline points="${xy.map(q => q.join(',')).join(' ')}" fill="none" stroke="#43d6ff" stroke-width="2.5"/>${xy.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${i === xy.length - 1 ? '#ffd166' : '#43d6ff'}"/>`).join('')}
    <text x="30" y="${H - 8}" font-size="11" fill="#ece6ff">${pts[0].date}</text><text x="${W - 20}" y="${H - 8}" text-anchor="end" font-size="11" fill="#ece6ff">${pts[pts.length - 1].date}</text>
    <text x="4" y="16" font-size="11" fill="#9be9ff">${CURR[code].sym}${hi}</text><text x="4" y="${H - 26}" font-size="11" fill="#9be9ff">${CURR[code].sym}${lo}</text>`);
}
LABS.rates = (code) => {
  setScreen('rates'); curStrand = 'math'; code = code || 'JPY';
  const list = ST.rates.slice().sort((a, b) => (b.date + b.t).localeCompare(a.date + a.t));
  app().innerHTML = `<section class="panel"><div class="row"><h2 style="margin:0">RATE LOG</h2><span class="grow"></span><button class="btn primary small" id="rMis">WORLD CURRENCY MISSIONS</button></div>
    <p class="sub" style="margin-top:6px">Research today's real exchange rate, then log it here. Your WORLD CURRENCY missions use the newest rate you logged. Rates change every day, so write down where you found it.</p>
    <div class="mission" style="margin-top:12px"><div>
      <div class="field"><label for="rCode"><b>Currency</b></label><select id="rCode">${Object.entries(CURR).map(([k, c]) => `<option value="${k}" ${k === code ? 'selected' : ''}>${k} · ${c.n} (${c.sym})</option>`).join('')}</select></div>
      <div class="field"><label for="rRate"><b>How many for $1?</b></label><input id="rRate" class="mono" inputmode="decimal" placeholder="example: 149.37"></div>
      <div class="field"><label for="rSrc"><b>Where did you find it?</b></label><input id="rSrc" maxlength="60" placeholder="example: my bank's website"></div>
      <div class="field"><label for="rDate"><b>Date</b></label><input id="rDate" type="date" value="${today()}"></div>
      <button class="btn primary" id="rAdd">LOG THIS RATE</button><div class="feedback" id="rFb"></div></div>
      <div><h3>${CURR[code].n.toUpperCase()} OVER TIME</h3>${rateChart(code)}
      <h3 style="margin-top:12px">RATES IN USE</h3><div class="hint">${V.table([['code', 'rate per $1', 'from'], ...Object.keys(CURR).map(k => { const R = rateFor(k); return [k, CURR[k].sym + R.rate, R.logged ? 'your log, ' + R.date : 'practice rate']; })])}</div></div></div>
    <h3 style="margin-top:14px">YOUR LOG</h3><div class="loglist">${list.map(x => `<div class="row"><span class="mono">${x.date}</span><b>${x.code}</b><span class="mono">$1 = ${CURR[x.code].sym}${x.rate}</span><span class="sub grow">${esc(x.src || '')}</span><button class="btn ghost small" data-del="${x.t}" aria-label="remove entry">&#10005;</button></div>`).join('') || '<div>No rates logged yet.</div>'}</div></section>`;
  $('#rCode').onchange = e => LABS.rates(e.target.value);
  $('#rMis').onclick = () => startRoute('currency');
  $('#rAdd').onclick = () => { const v = parseFloat(($('#rRate').value || '').replace(/,/g, '')), c = $('#rCode').value, fb = $('#rFb');
    if (!(v > 0)) { fb.className = 'feedback try'; fb.textContent = 'Enter the rate as a number, like 149.37.'; return; }
    ST.rates.push({ code: c, rate: v, date: $('#rDate').value || today(), src: $('#rSrc').value.trim(), t: String(Date.now()) }); save(); AUD.jingle(); LABS.rates(c); toast('Rate logged'); };
  app().querySelectorAll('[data-del]').forEach(b => b.onclick = () => { ST.rates = ST.rates.filter(x => x.t !== b.dataset.del); save(); LABS.rates(code); });
};

/* ================= NAV v1.8: BACK everywhere =================
   Every screen change is remembered. BACK (header button, the BACK on every pop-up, or the browser / swipe back)
   returns to the last screen. A problem comes back exactly as it was left: same numbers, hints opened, crossed-out choices, typed answer.
   HQ is home base: going there starts a fresh trail. Moving between tabs of one lab, or from one problem to the next, replaces the step. */
const NAV = {
  stack: [], cur: null, restoring: false, guard: false,
  same(a, b) { return a && b && a.kind === b.kind; },
  snapMission() { if (!M || !M.t) return null; return Object.assign({}, M, { crossed: (M.crossed || []).slice(), openHints: [...document.querySelectorAll('#hints [data-hl]')].map(d => +d.dataset.hl) }); },
  enter(kind, run, args) {
    if (this.restoring) { this.cur = { kind, run, args }; this.btn(); return; }
    const next = { kind, run, args };
    if (kind === 'hq') { this.stack = []; }
    else if (this.cur && !this.same(this.cur, next)) { if (this.cur.kind === 'mission') this.cur.snap = this.snapMission(); this.stack.push(this.cur); if (this.stack.length > 40) this.stack.shift(); this.guardUp(); }
    this.cur = next; this.btn(); },
  guardUp() { if (this.guard) return; try { history.pushState({ ahmNav: 1 }, ''); this.guard = true; } catch (_) { } },
  overlayOpen() { const o = $('#overlay'); return o && !o.hidden; },
  back() { const o = $('#overlay');
    if (this.overlayOpen()) { if (o.onBack) o.onBack(); else closeOverlay(); return true; }
    document.querySelectorAll('.pitchpop').forEach(p => p.remove());
    const prev = this.stack.pop(); if (!prev) { if (SCREEN !== 'hq') { showHQ(); return true; } return false; }
    AUD.tap(); this.restoring = true;
    try { if (prev.kind === 'mission' && prev.snap) this.restoreMission(prev.snap); else prev.run.apply(null, prev.args || []); } finally { this.restoring = false; }
    this.cur = prev; this.btn(); return true; },
  restoreMission(sn) { M = Object.assign({}, sn); delete M.openHints; renderMission();
    (sn.openHints || []).sort((a, b) => a - b).forEach(l => showHint(l, true));
    app().querySelectorAll('#hintbar button').forEach(b => { if ((sn.openHints || []).includes(+b.dataset.h)) b.classList.add('used'); });
    if (M.ans.choices) { const btns = [...app().querySelectorAll('#choices button')]; (M.crossed || []).forEach(i => { if (btns[i]) { btns[i].classList.add('xout'); btns[i].disabled = true; } });
      if (M.pickedChoice >= 0 && btns[M.pickedChoice]) btns[M.pickedChoice].classList.add('picked'); }
    else { const box = $('#ansBox'); if (box) { box.textContent = (M.input || '').replace(/^-/, '−'); box.classList.toggle('empty', !M.input); } }
    if (M.done) { const fb = $('#fb'); fb.className = 'feedback good'; fb.textContent = M.okMsg || 'Locked in.'; $('#nextBtn').hidden = false; $('#retreatBtn').hidden = true;
      app().querySelectorAll('#keypad button, #choices button').forEach(b => b.disabled = true); CELEBRATE.start(); jamPanel(); } },
  btn() { const b = $('#backBtn'); if (b) b.hidden = !this.stack.length; document.body.classList.toggle('hasback', !!this.stack.length); },
  wrap(obj, name, kind) { const f = obj[name]; if (typeof f !== 'function' || f._nav) return; const nav = this;
    const w = function () { nav.enter(kind, f, [...arguments]); return f.apply(this, arguments); }; w._nav = 1; obj[name] = w; }
};
// wire every screen
(function () { const G = window;
  NAV.wrap(G, 'showHQ', 'hq');
  // renderMission is called for every new problem. a restore passes through NAV.restoring
  const rm = G.renderMission; G.renderMission = function () { NAV.enter('mission', () => { }, []); return rm.apply(this, arguments); }; renderMission = G.renderMission;
  Object.keys(LABS).filter(k => k !== 'guider').forEach(k => NAV.wrap(LABS, k, 'lab:' + k)); // guider is a PIN gate, the screen behind it is wrapped below
  if (G.guiderScreen) { NAV.wrap(G, 'guiderScreen', 'guider'); guiderScreen = G.guiderScreen; }
  showHQ = G.showHQ; })();
addEventListener('popstate', () => { NAV.guard = false; const did = NAV.back(); if (did && (NAV.stack.length || NAV.overlayOpen())) NAV.guardUp(); });

/* ================= GUIDED TOUR v1.9: shows once on the first visit, SKIP any time, replay from SETTINGS ================= */
const TOUR = {
  on: false, i: 0,
  steps: [
    { crew: 'eyezeaze', sel: null, t: 'Welcome to ALIEN HERO MATHSCAPES. Here is a quick tour of how everything works. Tap NEXT, or SKIP TOUR any time.' },
    { crew: 'eyezeaze', sel: '.cards [data-route]', t: 'Routes hold the missions. Each route has its own crew guide and its own world. Tap a route to start.' },
    { crew: 'molga', sel: '[data-route="kitchen"]', t: 'FAMILY KITCHEN: cook with Mom, family and friends while you work with fractions, measuring and MyPlate. MOLGA is your guide.' },
    { crew: 'eyezeaze', sel: '#lvl', t: 'PACE sets how big the numbers get: WARM-UP, STEADY, FINAL FORM or BEYOND. Switch any time.' },
    { crew: 'molga', sel: '#sciLens', t: 'SCIENCE LENS makes every route lean toward its science missions.' },
    { crew: 'charles', sel: null, t: 'Inside a mission, hints never cost XP: NUDGE, SEE IT, STEP BY STEP, then TWIN works the same moves on new numbers. TACTICAL RETREAT parks a problem with the same numbers for later.' },
    { crew: 'knomad', sel: '[data-go="sound"]', t: 'SOUND LAB: Beat Grid, Theme Composer, Pads and LIVE PLAY. Solve a mission and your victory jingle plays, then you can “JAM ON IT!” with STUTTER, WORMHOLE and GLITCH.' },
    { crew: 'keaz', sel: '[data-go="discover"]', t: 'DISCOVERY LAB: explore how things work. There are no wrong answers there.' },
    { crew: 'eyezeaze', sel: '.top', t: 'Up top: BACK returns to where you just were, HQ brings you home, the note button turns sound on or off, and your watch shows your XP.' },
    { crew: 'eyezeaze', sel: null, t: 'That is the tour. You can replay it any time in SETTINGS.' }
  ],
  start() { if (SCREEN !== 'hq') showHQ(); this.on = true; this.i = 0; this.show(); },
  show() { let el = $('#tour'); if (!el) { el = document.createElement('div'); el.id = 'tour'; el.className = 'tour'; el.setAttribute('role', 'dialog'); document.body.appendChild(el); }
    document.querySelectorAll('.tourhit').forEach(x => x.classList.remove('tourhit'));
    const s = this.steps[this.i], c = CREW[s.crew], last = this.i === this.steps.length - 1;
    el.innerHTML = `<img src="${c.img}" alt=""><div><div class="who">${c.name} <span class="mono">${this.i + 1} / ${this.steps.length}</span></div><div class="tt">${esc(s.t)}</div>
      <div class="row" style="margin-top:8px"><button class="btn cyan small" id="tourNext">${last ? 'DONE' : 'NEXT'}</button>${last ? '' : '<button class="btn ghost small" id="tourSkip">SKIP TOUR</button>'}</div></div>`;
    el.hidden = false;
    const tg = s.sel && document.querySelector(s.sel); if (tg) { tg.classList.add('tourhit'); try { tg.scrollIntoView({ block: 'center', behavior: ST.settings.motion ? 'smooth' : 'auto' }); } catch (_) { tg.scrollIntoView(); } } else window.scrollTo(0, 0);
    $('#tourNext').onclick = () => { AUD.tap(); if (last) this.end(); else { this.i++; this.show(); } };
    const sk = $('#tourSkip'); if (sk) sk.onclick = () => { AUD.tap(); this.end(); }; },
  end() { this.on = false; const el = $('#tour'); if (el) el.hidden = true; document.querySelectorAll('.tourhit').forEach(x => x.classList.remove('tourhit')); ST.tourDone = 1; save(); }
};
// leaving HQ ends the tour (it stays replayable from SETTINGS)
(function () { const ss = setScreen; window.setScreen = function (n) { if (TOUR.on && n !== 'hq') TOUR.end(); return ss.apply(this, arguments); }; setScreen = window.setScreen; })();

/* ---------- boot ---------- */
load(); if (ST.timings) ST.timings = ST.timings.filter(x => x !== '2bar'); migrateSound18(); applySettings(); topbar();
$('#homeBtn').onclick = showHQ; $('#backBtn').onclick = () => NAV.back();
$('#soundBtn').onclick = () => { ST.settings.sound = !ST.settings.sound; if (!ST.settings.sound) { SEQ.stop(); JAM.stopRec(); try { if (WAKE.el) WAKE.el.pause(); } catch (_) { } } save(); topbar(); if (ST.settings.sound) AUD.tap(); };
try { speechSynthesis.onvoiceschanged = () => { }; } catch (e) { }
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
/* v1.6 audio reliability (iPhone and iPad):
   1. wake audio on any full tap or key press (Safari only allows sound to start from those)
   2. play through the ring/silent switch (Aaron's call): audioSession 'playback' where supported, plus a silent looping
      media element generated at runtime, which moves iOS into the media playback channel
   3. after switching apps, wake audio from any non-running state and put the sequencer back in time */
const WAKE = {
  el: null, done: false,
  silentURL() { const sr = 8000, n = sr, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' })); },
  media() { if (!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) return; try { if (!this.el) { this.el = document.createElement('audio'); this.el.setAttribute('playsinline', ''); this.el.setAttribute('x-webkit-airplay', 'deny'); this.el.loop = true; this.el.preload = 'auto'; this.el.src = this.silentURL(); }
    if (this.el.paused && !document.hidden) { const pr = this.el.play(); if (pr && pr.catch) pr.catch(() => { }); } } catch (_) { } },
  go() { if (!ST.settings.sound) return; this.media(); if (!AUD.ok()) return; const c = AUD.ctx;
    if (!this.done) { try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); this.done = true; } catch (_) { } }
    if (SEQ.playing) SEQ.resync(); },
  back() { if (document.hidden) { try { if (this.el) this.el.pause(); } catch (_) { } return; } if (AUD.ctx && ST.settings.sound) { this.media(); AUD.ok(); setTimeout(() => { if (SEQ.playing) SEQ.resync(); }, 120); } }
};
['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => WAKE.go(), { capture: true, passive: true }));
addEventListener('visibilitychange', () => WAKE.back()); addEventListener('pageshow', () => WAKE.back()); addEventListener('focus', () => WAKE.back());
showHQ(); if (!ST.tourDone) setTimeout(() => { if (!ST.tourDone && SCREEN === 'hq' && !TOUR.on) TOUR.start(); }, 700);
/* v1.5: keep every SVG label inside its picture (shrink a little, then nudge), so nothing is clipped on a phone */
function fitSvgText(root) {
  (root || document).querySelectorAll('svg[viewBox] text').forEach(t => { if (t.dataset.fit) return; const svg = t.ownerSVGElement; if (!svg || !svg.isConnected) return;
    let bb; try { bb = t.getBBox(); } catch (_) { return; } if (!bb.width) return; t.dataset.fit = 1; const vb = svg.viewBox.baseVal, L = vb.x + 2, R = vb.x + vb.width - 2;
    let fs = parseFloat(t.getAttribute('font-size') || getComputedStyle(t).fontSize) || 13, n = 0;
    while ((bb.x < L || bb.x + bb.width > R) && bb.width > R - L && fs > 9 && n++ < 8) { fs -= 1; t.setAttribute('font-size', fs); bb = t.getBBox(); }
    const x = parseFloat(t.getAttribute('x')); if (isNaN(x)) return;
    if (bb.x < L) t.setAttribute('x', x + (L - bb.x)); else if (bb.x + bb.width > R) t.setAttribute('x', x - Math.min(bb.x + bb.width - R, bb.x - L)); });
}
(() => { let q = 0; const run = () => { q = 0; fitSvgText($('#app')); }; new MutationObserver(() => { if (!q) q = requestAnimationFrame(run); }).observe($('#app'), { childList: true, subtree: true });
  if (document.fonts) document.fonts.ready.then(() => { document.querySelectorAll('svg text[data-fit]').forEach(t => delete t.dataset.fit); run(); }); })();
