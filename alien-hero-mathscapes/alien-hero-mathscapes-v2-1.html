<!DOCTYPE html>
<!--
  ALIEN HERO MATHSCAPES v2.1
  Kaiju Fruit Labs · built for Zeek's homeschool math + science
  CHANGE LOG
  v2.1 (2026-11-25) KAIJU FORGE rebuilt: draw shapes (pencil or finger), make them 3D, lock parts and still spin everything, skin with a crew member's palette, textures and signature traits; THE CREW with 3D chibis from KAIJU FRUIT first and the original art as a bonus peek; SHAPE X-RAY tap for volume; moves unlocked every 3 active minutes of building, jamming and FX mashing, dancing to the music. CHARLES is now SELRAH.
  v2.0 (2026-11-25) Science gets equal weight: 39 new science types (all 13 NYS grade 5 science standards, physics of sound, science in every route), 50/50 math and science serving, exact NY codes on every mission.
  v1.9 (2026-11-24) FAMILY KITCHEN, 30 sound missions, guided tour, SHARE BEAT.
    - FAMILY KITCHEN route with MOLGA: 21 mission types x 3 scenarios, cooking with Mom, family and friends (nut-free). Spoons and cups,
      scaling recipes, adding fractions, MyPlate (worded as "about"), air fryer batches, 165°F poultry (USDA), boiling at 212°F (science),
      sofrito ratios with traditional Puerto Rican ingredients (Mom's recipe stays secret), freezing sofrito cubes, rice water, unit prices,
      sharing candy, muffin trays, roasted potatoes, lentil quinoa patties, avocado toast, smoothie percents, snack votes, pints and ounces.
    - 30 new sound missions on the v1.8 features: STUTTER, GLITCH, WORMHOLE, bars, faders, sidechain, note layouts, voice limit,
      undo passes, RANDOMIZE, samples, MP3 vs WAV, FX TAKE, Composer squares, timing percent, echoes, layers, BPM, polyrhythm bars.
    - Guided tour on the first visit (SKIP any time, REPLAY THE TOUR in Settings). Leaving HQ closes it.
    - SHARE BEAT: Guider switch "Allow sharing beats". MY BEATS gets SHARE (device share sheet, or a .json file) and OPEN A SHARED BEAT.
      The file holds the beat, its FX and a learning trail. No journal notes. Saving a loaded beat again adds a remix step to the trail.
    - Jam panel now reads: YOU GOT IT! NOW YOU CAN “JAM ON IT!”
    - Phone header: the title fits next to BACK.
  v1.8 (2026-11-24) Sound lab rebuild, FX, BACK everywhere.
    - Every sound has its own color (chips, grids, Composer, live rows, pads). Drums: deep colors, white text. Melodic: bright colors, dark text.
    - Kits: 8 drum pads + a MELODIC section. TOKU HERO: SHAMISEN, AURA (Aaron's first designed sound), HARP. KAIJU 808: GROWL BASS,
      SPACE PAD, 808 BASS, SUB DROP. CYBER RIDER: LASER ZAP, RISER, GLITCH. TAIKO: GAMELAN, KOTO, FLUTE. MELODY: LEAD, RHODES, VIBES, MARIMBA.
      New drums: TOM, CRASH, TAMBOURINE, COWBELL, RIMSHOT, 808 TOM, ELECTRO CLAP, ELECTRO TOM, SNAP, KAKKO, CHAPPA, TSUZUMI.
      STRINGS and CHOIR are gone (lighter on the iPad). GROWL BASS click fixed.
    - 16 notes on every melodic section, with MELODY LAYOUT (default) or 3 OCTAVES.
    - Mix: per-sound balance, the kick ducks bass and melody (sidechain), DRUMS / MELODIC / LIVE faders in LIVE PLAY.
    - FX (hold to use): STUTTER (1/4, 1/8, 1/16 of a beat), WORMHOLE (sinks deep with dub echoes), GLITCH (slices swap, flip, repeat).
      In missions they unlock when solved: YOU GOT IT! NOW YOU CAN JAM ON IT! In the Sound Lab they live in LIVE PLAY.
    - LIVE PLAY: PLAY/STOP everywhere, FX TAKE layer (FX recorded exactly as heard, into saves, jingle and exports), UNDO LAST TAKE removes
      only the last instrument pass, CLEAR LIVE BEATS / LIVE MELODY / FREE TAKE / FX, RANDOMIZE.
    - Beat Grid: BARS 1, 2 or 4 (lab starts at 2, missions stay 1), fraction outlines repeat in every bar. 2 BARS timing removed.
    - Theme Composer: DRUMS grid stacked over a MELODY grid (low C at the bottom), beat numbers, BARS 1/2/4 (starts at 2), autosave on every edit.
    - BACK everywhere: header BACK, BACK on every pop-up, browser and swipe back. Problems come back exactly as left.
      TACTICAL RETREAT has BACK TO PROBLEM (takes it back out of the rematch bank).
    - iPad crash fix: voice limit (oldest sound fades out when too many ring at once), lighter voices, Composer autosave.
    - Version label comes from one place.
    - Fixes: a very thin slice in a bar or timeline picture could get a negative width (console error). Beat Grid: the first step of bar 2 was squashed (style name clash).
  v1.7 (2026-10-09) Multiple choice with why-wrong, MY BEATS, live play layers and timing.
    - TOKU HERO: STRINGS is now plucky and bright with more echo. CHOIR is muted, 8 stacked voices plus a low layer, more reverb. Plain names.
    - Composer: hold a filled pad to pick its note (every sound, drums too).
    - Discovery Lab: GOT IT? appears after exploring and marks it understood. TRY A MISSION opens a real problem on the same idea.
    - Multiple choice on exactly 2 of every 5 problems (all grade 5 mission types). Each wrong choice is a real mistake. A wrong pick is
      crossed out with why it is wrong (never the answer), choices lock for 3 seconds, then TRY AGAIN. READ WHY speaks it.
    - LIVE PLAY: ON/OFF layers (GRID, LIVE BEATS, LIVE MELODY, FREE TAKE) decide what plays, saves, becomes the jingle and exports.
      UNDO LAST TAKE. MY TIMING strip shows where each hit really landed (green right on, blue early, gold late). CALIBRATE for device delay.
    - MY BEATS tab: SAVE MY SESSION, PLAY, LOAD, RENAME, DELETE, and flip cards (guess the outlined fraction, flip for answer, info, timing summary).
    - Fixes: train headway mission no longer offers 8 minutes (it gave 8.5 trains). Turf area hint no longer says "plus 60 × 0".
  v1.6 (2026-10-09) Live play, timing level-ups, fractions you can see and hear.
    - Audio: plays through the iPhone ring/silent switch (Aaron's call), wakes on the first tap, and picks back up in time after switching apps.
    - SCIENCE LENS shows ON or OFF. Kit buttons are smaller so all 5 fit on one row (grids and pads). Pad help text sits under the pads.
    - TOKU HERO: POWER STAB and BRASS HIT replaced by HERO STRINGS and DAWN CHOIR soundtrack pads with echo and reverb tails.
      KAIJU 808 GROWL BASS is 2 seconds longer. CYBER RIDER laser zap, riser and glitch are now tones with a TONE section on the pads.
      MELODY has 16 notes: the original 8 plus 4 half steps below (G#, A, A#, B) and 4 above (F, F#, G, G#).
    - Pads: slide a finger across the notes to strum them.
    - Beat Grid: hold a filled step to pick its note. Fraction buttons outline exactly those steps and glow as the beat passes.
      Every session starts in 4/4 (16 steps). New timings unlock one at a time with a HENSHIN! moment: 3/4, 6/8, 5/4, 9/8, 12/8, 2 BARS.
      The grid changes to that timing's real number of steps. SNAP BACK TO 16 returns home.
    - LIVE PLAY under the pads: REC with a 4-count in, SNAP TO STEPS into LIVE BEATS and LIVE MELODY rows, or FREE TIMING.
      SAVE AS VICTORY JINGLE (the loop played last + live rows). EXPORT one loop as .WAV or .MP3 (lamejs, LGPL, in js/).
    - 11 new sound missions: 6 timing missions (they unlock the next timing) plus loop seconds, loops lining up (LCM), half steps, late hits, WAV size.
  v1.5 (2026-10-08) Sound build + science expansion + Discovery Lab.
    - Sound engine: compressor, reverb and echo. 4 kits x 8 sounds (TOKU HERO, KAIJU 808, CYBER RIDER, TAIKO) plus MELODY
      (the original pentatonic notes). Includes gamelan, classical harp with echo tail, 3-second space pad, weighted kicks.
    - Beat Grid and Composer: drag a sound OR tap a sound then tap steps. Composer is 8 rows x 16 steps (iPhone: two 8-step pages),
      tone sounds follow the row pitch. RANDOMIZE (labs only, never in missions). One PLAY/STOP button, loops.
    - Victory celebration is the Composer loop; it loops after a correct answer until NEXT MISSION, sound off, or leaving.
      A victory jingle saved in earlier versions is carried into the new loop.
    - PLAY PADS: multi-touch pads for every kit plus playable notes, in the Sound Lab, Beat Grid and Composer.
    - 29 new science mission types (insects and invertebrates, biology, weather, natural disasters, Earth, space), 3 scenarios each.
      New routes EARTH & SKY (KEAZ) and DEEP SPACE (CHARLES). Experiments with sound: heartbeat, cricket thermometer, thunder timer.
    - DISCOVERY LAB: 7 explorations with no wrong answers plus a journal. Journal shows in Progress and the Guider.
    - SCIENCE LENS switch on the home screen. Guider switch: show grade levels to the learner (default OFF).
    - iPhone fixes: the kanji SEE IT table no longer zooms the page out; picture labels now shrink or shift to stay inside the picture.
  v1.4 (2026-10-08) No grade levels shown to the learner.
    - Removed every grade label, grade chip, grade progress bar and locked-grade display from learner screens.
    - Grade still runs silently: missions come from the unlocked grade; 85% complete unlocks the next one with a HENSHIN! moment.
    - Four modes restored: WARM-UP, STEADY, FINAL FORM, BEYOND, all inside the current grade.
      WARM-UP = core missions with smaller numbers. STEADY = mix, full range. FINAL FORM = mostly challenge.
      BEYOND = challenge missions with bigger numbers. 3 in a row offers the next mode up; retreat can ease one down.
    - Equation Lab uses the four modes (number size) on the current grade's equation type.
    - Route map shows only current missions, no grades or standards codes. Progress shows topics without grade prefixes.
    - FUN CHARTS report (with full standards labels) moved into the Guider area. Grade control stays in the Guider only.
  v1.3 (2026-10-08) Grade scaffolding + Guider + World Currency.
    - Every mission type tagged to a grade (5, 6, 7, 8). Start at grade 5. Next grade unlocks at 85% complete.
    - Complete = solved in 2 different scenarios. Grade 5-6 types have 3 scenarios each; repeats never reuse the last scenario.
    - 33 new mission types (grade 5: 12, grade 6: 11, WORLD CURRENCY: 10 across grades 5-8). Five fixed-number missions now vary their numbers.
    - Pace is STEADY or FINAL FORM inside the current grade. 3-in-a-row offers FINAL FORM, never a grade jump.
    - Equation Lab follows the grade: 5 box puzzles, 6 one-step, 7 two-step, 8 both sides.
    - WORLD CURRENCY route + RATE LOG (real rates Zeek researches, chart over time, practice rates until logged).
    - GUIDER area behind a 3-digit PIN shared by all KFL apps on this address (accepts the FUN CHARTS PIN), recovery code,
      5-try lockout, hashed storage. Holds grade control, SPIRIT OF SELF CONTROL, roadmap.
    - Home Screen web app manifest + icons.
  v1.2 (2026-10-08) KNOMAD sticker art: printed GONAD replaced with KNOMAD lettering (Jost, matched angle, size, ink). Nothing else changed.
  v1.1 (2026-10-08) Crew member GONAD renamed KNOMAD (name, id, art file name, story text). Nothing else changed.
  v1.0 (2026-10-08) First build.
    - HENSHIN HQ hub, 10 story routes + Japanese Number Dojo, crew of 5 Kaiju guides (SpazeCraft art)
    - Generated missions (grades 5-8 + Algebra I stretch) with science crossovers (NYSSLS MS codes)
    - No-answer hint ladder: NUDGE, SEE IT, STEP BY STEP, TWIN PROBLEM (worked with different numbers)
    - TACTICAL RETREAT (zero penalty) parks problems in the REMATCH BANK
    - LET HIM COOK: streak of 3 offers a FINAL FORM boost, his choice
    - 11 level-up watches (Studio Head start, 2 originals, 8 hue variants, MATH BEAST final gated by both skill trees)
    - Sound Lab: Interval Lab, Beat Grid, Theme Composer (victory jingle), Web Audio synth only
    - Henshin Equation Lab (balance scale), Kaiju Forge (three.js 3D build + square-cube law)
    - Progress: XP, Math and Science trees, minutes by subject per day, standards touched,
      backup export/import (merge by id) and a FUN CHARTS report
    - Storage prefix ahm_. No base64. Fonts, images and three.js ship as separate files.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0820">
<title>ALIEN HERO MATHSCAPES v2.1</title>
<link rel="icon" href="assets/watches/00-showrunner.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:'Bebas';src:url('fonts/bebas-neue-400.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Chakra';src:url('fonts/chakra-petch-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Chakra';src:url('fonts/chakra-petch-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'DMMono';src:url('fonts/dm-mono-500.woff2') format('woff2');font-display:swap}
:root{
  --bg:#0b0820; --bg2:#120c2e; --panel:#171040; --panel2:#21185a; --panel3:#2b1f72;
  --line:#5a47c8; --line2:#7d68ff;
  --cyan:#43d6ff; --cyan2:#9be9ff; --purple:#9a5cff; --purple2:#c9a8ff; --blue:#4b7bff;
  /* Wizard red: PROVISIONAL until Aaron sends a Flame Style reference. One variable to swap. */
  --red:#e2231a; --red2:#ff8a80;
  --gold:#ffd166; --green:#5cf2a6;
  --text:#ffffff; --text2:#ece6ff; --text3:#d7ccff;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--text);font-family:'Chakra',system-ui,sans-serif;font-weight:500;font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(90,71,200,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(90,71,200,.13) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
body.big{--fs:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
a,label,[role=button],.tap{-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.jp{font-family:var(--jp)}
.mono{font-family:'DMMono',ui-monospace,monospace}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(11,8,32,.94);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top .home{flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);padding:6px 12px;font-family:'Bebas';font-size:20px;letter-spacing:1px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.top .ttl{flex:1 1 auto;min-width:0;font-family:'Bebas';font-size:22px;letter-spacing:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl b{color:var(--red2);font-weight:400}
.top .xpchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:'DMMono';font-size:13px}
.top .xpchip img{width:34px;height:34px;object-fit:contain}
.iconbtn{border:1px solid var(--line2);background:var(--panel);width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.iconbtn.off{background:var(--bg2)}

/* ---------- mecha panel ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.panel.alt{background:var(--panel2)}
.tag{display:inline-block;font-family:'DMMono';font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line2);color:var(--text2)}
.tag.sci{border-color:var(--green);color:#d9ffe9}
.tag.math{border-color:var(--cyan);color:var(--cyan2)}
.tag.red{border-color:var(--red);color:var(--red2)}
h1,h2,h3{font-family:'Bebas';font-weight:400;letter-spacing:1.5px;line-height:1.05}
h1{font-size:44px}
h2{font-size:28px;margin:18px 0 10px}
h3{font-size:22px}
.sub{color:var(--text3);font-size:.92em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:11px 16px;font-family:'Bebas';font-size:21px;letter-spacing:1.2px;min-height:48px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red2)}
.btn.cyan{background:#11586f;border-color:var(--cyan)}
.btn.purple{background:#4a2a9a;border-color:var(--purple2)}
.btn.ghost{background:transparent}
.btn.small{font-size:17px;padding:7px 12px;min-height:40px}
.btn[disabled]{opacity:.45}

/* ---------- HQ ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .watch{width:132px;height:132px;object-fit:contain}
.hero .t1{font-family:'Bebas';font-size:clamp(34px,7vw,58px);letter-spacing:2px;line-height:.95}
.hero .t1 span{color:var(--red2)}
.hero .rank{font-family:'DMMono';font-size:13px;color:var(--cyan2);letter-spacing:1px;margin-top:6px}
.bar{height:12px;background:var(--bg2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--purple),var(--cyan))}
.bar.sci>i{background:linear-gradient(90deg,#1f9e6b,var(--green))}
.bar.red>i{background:linear-gradient(90deg,#8e1410,var(--red))}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.meter .lab{display:flex;justify-content:space-between;font-family:'DMMono';font-size:12px;margin-bottom:4px;color:var(--text2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);padding:12px 12px 12px 12px;min-height:150px;display:flex;flex-direction:column;gap:6px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.card:active{background:var(--panel2)}
.card .cimg{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--line2)}
.card .cname{font-family:'Bebas';font-size:23px;letter-spacing:1.2px;line-height:1}
.card .cdesc{font-size:13px;color:var(--text3);line-height:1.3}
.card .cnum{position:absolute;top:8px;right:10px;font-family:'DMMono';font-size:11px;color:var(--cyan2)}
.card.lab{border-color:var(--purple)}
.card.lab .icon{font-family:'Bebas';font-size:30px;color:var(--cyan2);line-height:1}
.crewstrip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.crewstrip button{flex:0 0 auto;border:none;background:none;text-align:center;width:86px}
.crewstrip img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid var(--line2)}
.crewstrip span{display:block;font-family:'Bebas';font-size:17px;letter-spacing:1px}
.creed{font-family:'DMMono';font-size:12px;letter-spacing:2px;color:var(--text2);text-align:center;margin-top:20px}
.credit{font-size:12px;color:var(--text3);text-align:center;margin-top:6px}

/* ---------- mission ---------- */
.mission{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.mission>*{min-width:0}
@media(min-width:900px){.mission{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.story{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.story img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line2)}
.story .who{font-family:'Bebas';font-size:19px;letter-spacing:1px;color:var(--cyan2)}
.story .txt{font-size:1.02em}
.question{font-size:1.18em;font-weight:700;margin-top:10px;padding:10px 12px;border-left:3px solid var(--red);background:var(--bg2)}
.mhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.answerbox{display:flex;align-items:center;gap:8px;margin-top:6px}
.answer{flex:1 1 auto;min-height:56px;border:1px solid var(--line2);background:var(--bg2);font-family:'DMMono';font-size:28px;padding:8px 12px;display:flex;align-items:center;letter-spacing:1px;overflow-x:auto;white-space:nowrap}
.answer.empty::before{content:'tap the keys';font-family:'Chakra';font-size:15px;color:var(--text3);letter-spacing:0}
.unit{font-family:'DMMono';font-size:18px;color:var(--text2)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{min-height:56px;border:1px solid var(--line);background:var(--panel2);font-family:'DMMono';font-size:24px}
.keypad button:active{background:var(--panel3)}
.keypad .check{grid-column:span 2;background:var(--red);border-color:var(--red2);font-family:'Bebas';font-size:26px;letter-spacing:1.5px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.choices button{min-height:56px;border:1px solid var(--line2);background:var(--panel2);font-size:18px;padding:8px}
.choices button.picked{background:#4a2a9a;border-color:var(--purple2)}
.feedback{min-height:24px;margin-top:10px;font-weight:700}
.feedback.good{color:var(--green)}
.feedback.try{color:var(--gold)}
.hintbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hintbar button{border:1px solid var(--line2);background:var(--panel2);padding:8px 4px;font-family:'Bebas';font-size:17px;letter-spacing:1px;min-height:48px;line-height:1}
.hintbar button small{display:block;font-family:'DMMono';font-size:10px;letter-spacing:.5px;margin-top:3px;color:var(--text2)}
.hintbar button.used{background:#11586f;border-color:var(--cyan)}
.hintbar button[disabled]{opacity:.4}
.hints{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hint{border:1px solid var(--line);background:var(--bg2);padding:10px 12px;overflow-x:auto}
.hint .hl{font-family:'Bebas';font-size:18px;letter-spacing:1px;color:var(--cyan2);margin-bottom:4px}
.hint ol{padding-left:22px}
.hint li{margin:4px 0}
.hint svg{max-width:100%;height:auto;display:block;margin:4px auto}
.hint table{border-collapse:collapse;font-family:'DMMono';font-size:14px;margin:4px 0}
.hint td,.hint th{border:1px solid var(--line);padding:4px 8px;text-align:center}
@media(max-width:560px){.hint td,.hint th{padding:4px 3px}.hint table{font-size:13px}}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.timer{font-family:'DMMono';font-size:14px;color:var(--gold)}
.lvlpick{display:flex;gap:6px;flex-wrap:wrap}
.lvlpick button{border:1px solid var(--line2);background:var(--panel2);padding:6px 10px;font-family:'Bebas';font-size:17px;letter-spacing:1px;min-height:40px}

.fseg{display:flex;margin:0 0 8px}.fseg button{flex:1;border:1px solid var(--line2);background:var(--panel2);font-family:'Bebas';font-size:20px;letter-spacing:1px;min-height:44px;color:#fff}.fseg button.on{background:var(--cyan);color:#07051a}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fchip{border:1px solid var(--line2);background:var(--panel2);padding:7px 10px;font-family:'DMMono';font-size:13px;min-height:40px;color:#fff}.fchip.on{background:var(--cyan);color:#07051a;border-color:var(--cyan)}.fchip.y{background:var(--gold);color:#07051a;border-color:var(--gold)}
.flist{display:flex;flex-direction:column;gap:4px}.frow{display:flex;gap:6px;align-items:center;justify-content:space-between}.frow>button:first-child{flex:1;text-align:left;border:1px solid var(--line2);background:var(--panel2);padding:6px 10px;font-family:'DMMono';font-size:13px;min-height:40px;color:#fff}.frow.sel>button:first-child{background:var(--purple);border-color:var(--purple2)}
.frow button[disabled]{opacity:.6}.frow small{font-size:11px;color:#ece6ff}
.frow>button[data-lock]{border:1px solid var(--line2);background:var(--panel2);font-family:'DMMono';font-size:12px;min-height:40px;padding:0 10px}
.lk{color:var(--green)}.ul{color:var(--gold)}.frow>span{font-family:'DMMono';font-size:12px;white-space:nowrap}
.lock{display:inline-block;width:12px;height:10px;border:2px solid currentColor;border-radius:2px;position:relative;margin-left:6px;top:1px}.lock:before{content:'';position:absolute;left:0;top:-8px;width:7px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:6px 6px 0 0}.lock.open:before{left:5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:10px}
.fcrew{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font-family:'DMMono';font-size:12px;min-height:44px}
.fcirc{display:inline-grid;place-items:center;border-radius:50%;border:4px solid #120c2e;box-shadow:0 0 0 2px var(--line2);overflow:hidden;flex:0 0 auto}.fcirc.on{box-shadow:0 0 0 3px var(--gold)}
.fcirc img{width:92%;height:92%;object-fit:contain}.fcirc img.art{width:100%;height:100%;object-fit:cover}.fcirc img.vec{width:80%;height:80%}
.fpick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.fpick button{background:none;border:0;padding:0;min-height:44px}
.fpal{display:flex;gap:6px}.fpal span{flex:1;height:30px;border:1px solid var(--line2)}.fpal .ftex{flex:0 0 64px;height:64px;background-size:420%;background-position:50% 58%}
.fflat{display:grid;place-items:center;height:min(56vh,460px);background:#0b0824;border:1px solid var(--line)}
.fbig{font-family:'Bebas';font-size:22px;color:var(--gold);letter-spacing:.5px;font-weight:400}
</style>
</head>
<body>
<header class="top">
  <button class="home back" id="backBtn" hidden aria-label="Back">&#9664; BACK</button>
  <button class="home" id="homeBtn" hidden>HQ</button>
  <div class="ttl"><span class="ah">ALIEN HERO </span><b>MATHSCAPES</b></div>
  <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">&#9835;</button>
  <div class="xpchip"><img id="topWatch" alt="" src="assets/watches/00-showrunner.png"><span id="topXP">0 XP</span></div>
</header>
<main class="wrap" id="app"></main>
<div id="bubble" class="bubble" hidden role="status"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ================= CONTENT: crew, routes, visual hint builders, mission templates ================= */
'use strict';

/* ---------- helpers ---------- */
const fmt = n => (Math.round(n * 1e6) / 1e6).toLocaleString('en-US', { maximumFractionDigits: 6 });
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: (Math.round(n*100)%100 ? 2 : 0), maximumFractionDigits: 2 });
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const frac = (n, d) => { const g = gcd(n, d); return (n / g) + '/' + (d / g); };
const W = (p, k, d) => (p && p.w && p.w[k]) || d;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- crew (SpazeCraft original art) ---------- */
const CREW = {
  eyezeaze: { name: 'EYEZEAZE', img: 'assets/crew/eyezeaze.png',
    math: 'Multiplication, arrays, place value, volume', sci: "Earth's systems: mountains and air",
    hidden: ['I have 10 eyes in 5 rows of 2. That is an array: 5 × 2 = 10.', 'My head tapers like a cup. That shape is called a frustum, and it has volume you can calculate.', 'Every sticker in this crew is a circle. Measure across, multiply by pi, and you get the distance around.'],
    cheer: ['All 10 of my eyes saw that. Clean.', 'That is a solid build.', 'Locked in.'],
    calm: ['Mistakes are data. Look again with fresh eyes.', 'Not yet. Try a hint, they are free.', 'Every try counts toward your watch.'] },
  knomad: { name: 'KNOMAD', img: 'assets/crew/knomad.png',
    math: 'Fractions, division, ratios', sci: 'Cells and sound',
    hidden: ['My chest reads 88. A piano has 88 keys.', 'My chest muscles split into halves and quarters. Fractions live in my body.', 'One cell splits into 2, then 4, then 8. Cell division is doubling.'],
    cheer: ['Divided and conquered.', 'That ratio hits like a perfect fifth.', 'Big brain move.'],
    calm: ['Split it into smaller pieces. That is what fractions are for.', 'Take a breath. The numbers are not going anywhere.', 'Trying is the win. Run it back when you are ready.'] },
  keaz: { name: 'KEAZ', img: 'assets/crew/keaz.png',
    math: 'Geometry, angles, circles, 3D shapes', sci: "Earth's rotation and symmetry",
    hidden: ['My eye is ringed with segments like a wheel. 360 degrees split evenly is radial symmetry.', 'A full turn is 360 degrees. Earth turns about 360 degrees in 24 hours, so about 15 degrees each hour.', 'My wings mirror each other. Mirror symmetry is geometry you can see.'],
    cheer: ['Right on the angle.', 'Geometry approved.', 'That shape fits.'],
    calm: ['Sketch it. Shapes make more sense on paper.', 'Turn the problem around and look from another side.', 'No rush. Angles wait for you.'] },
  molga: { name: 'MOLGA', img: 'assets/crew/molga.png',
    math: 'Statistics, probability, patterns, estimation', sci: 'Ecosystems and heredity',
    hidden: ['I have 4 eyes in a row and spots everywhere. Count a small patch, then estimate the rest.', 'My wings are mirrored. Patterns repeat in nature all the time.', 'Averages tell the story of a whole group in one number.'],
    cheer: ['The data agrees with you.', 'Pattern spotted.', 'That is scientist work.'],
    calm: ['Scientists get it wrong all the time. Then they test again.', 'Look for the pattern in the numbers.', 'Use a hint. Real researchers check their notes.'] },
  charles: { name: 'SELRAH', img: 'assets/crew/charles.png',
    math: 'Scale, ratios, exponents, big numbers', sci: 'Space and Earth hazards',
    hidden: ['My blue bubbles shrink circle by circle. That is scale.', 'Scale that grows by multiplying again and again becomes exponents. Tiny to Galactus size.', 'Each step up on the earthquake scale is about 10 times more shaking.'],
    cheer: ['Cosmic level answer.', 'Even Galactus would be impressed.', 'Scaled it perfectly.'],
    calm: ['Big numbers are just small numbers with friends. Break them apart.', 'Go back one step and check the scale.', 'Retreat is always an option. Heroes regroup.'] }
};
const CREW_IDS = Object.keys(CREW);

/* ---------- routes ---------- */
const ROUTES = [
  { id: 'toy', name: 'TOY MERCHANT', crew: 'eyezeaze', desc: 'Sell ZEEK AND DESTROY tees, ZEEK ZINE and sofubi. Prices, percents, profit.' },
  { id: 'japan', name: 'JAPAN TRAVELER', crew: 'charles', desc: 'Ramen and udon hunts, yen, train times, Mount Fuji, earthquakes.' },
  { id: 'con', name: 'CONVENTION PRODUCER', crew: 'eyezeaze', desc: 'Run a show like Kaiju Brooklyn or Anime NYC. Seats, tickets, schedules.' },
  { id: 'nature', name: 'NATURE SCIENTIST', crew: 'molga', desc: 'Rare bugs, cells, genes and populations. Stats and probability.' },
  { id: 'channel', name: 'CHANNEL HQ', crew: 'knomad', desc: 'Your real YouTube numbers. Growth, averages, upload plans.' },
  { id: 'cosmic', name: 'COSMIC THREAT', crew: 'charles', desc: 'Doctor Doom, Galactus and the Silver Surfer. Exponents, space, equations.' },
  { id: 'subway', name: 'SUBWAY COMMAND', crew: 'molga', desc: 'Run the lines. Rate, time, schedules and graphs.' },
  { id: 'football', name: 'FOOTBALL PITCH', crew: 'keaz', desc: 'Pitch geometry, angles, league points and match stats.' },
  { id: 'sound', name: 'SOUND MISSIONS', crew: 'knomad', desc: 'Hear ratios, beats as fractions, BPM, octaves and waves.' },
  { id: 'forge', name: 'FORGE MISSIONS', crew: 'keaz', desc: 'Volume, surface area and why giant Kaiju struggle to stand.' },
  { id: 'dojo', name: 'NUMBER DOJO DRILLS', crew: 'eyezeaze', desc: 'Japanese numbers, 万 grouping and 九九.' }
];
const ROUTE = Object.fromEntries(ROUTES.map(r => [r.id, r]));

/* standards labels (domain level, NYS Next Generation Math + NYSSLS) */
const S = {
  g5nbt: 'Gr5 Number & Operations in Base Ten', g5nf: 'Gr5 Fractions', g5md: 'Gr5 Measurement & Data (volume)', g5oa: 'Gr5 Operations & Algebraic Thinking',
  g6rp: 'Gr6 Ratios & Proportional Relationships', g6ns: 'Gr6 The Number System', g6ee: 'Gr6 Expressions & Equations', g6g: 'Gr6 Geometry', g6sp: 'Gr6 Statistics & Probability',
  g7rp: 'Gr7 Ratios & Proportional Relationships', g7ns: 'Gr7 The Number System', g7ee: 'Gr7 Expressions & Equations', g7g: 'Gr7 Geometry', g7sp: 'Gr7 Statistics & Probability',
  g8ee: 'Gr8 Expressions & Equations', g8f: 'Gr8 Functions', g8g: 'Gr8 Geometry', a1: 'Algebra I (stretch)',
  ls1: 'NYSSLS MS-LS1 Structures & Processes', ls11: 'NYSSLS MS-LS1-1 Cell Theory', ls2: 'NYSSLS MS-LS2 Ecosystems', ls32: 'NYSSLS MS-LS3-2 Heredity & Reproduction',
  ps4: 'NYSSLS MS-PS4-1 Wave Properties', ess1: 'NYSSLS MS-ESS1 Space Systems', ess13: 'NYSSLS MS-ESS1-3 Scale in the Solar System',
  ess2: "NYSSLS MS-ESS2 Earth's Systems", ess32: 'NYSSLS MS-ESS3-2 Natural Hazards'
};

/* ---------- visual hint builders (SVG strings, light on dark) ---------- */
const V = {
  svg(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="${w}" xmlns="http://www.w3.org/2000/svg" font-family="DMMono,monospace" font-size="13" fill="#fff">${inner}</svg>`; },
  bars(items, note) {
    const W = 330, total = items.reduce((s, i) => s + (i.w || 1), 0); let x = 10, out = '';
    const cols = ['#4b7bff', '#9a5cff', '#43d6ff', '#e2231a', '#5cf2a6', '#ffd166'];
    items.forEach((it, k) => { const w = (W - 20) * (it.w || 1) / total;
      out += `<rect x="${x}" y="22" width="${Math.max(1, w - 3)}" height="34" fill="${it.c || cols[k % cols.length]}" opacity=".85"/><text x="${x + (w - 3) / 2}" y="44" text-anchor="middle" font-size="12">${esc(it.label)}</text>`; x += w; });
    if (note) out += `<text x="${W / 2}" y="14" text-anchor="middle" fill="#ece6ff">${esc(note)}</text><text x="${W / 2}" y="76" text-anchor="middle" fill="#9be9ff">total = ?</text>`;
    return this.svg(W, 84, out);
  },
  array(rows, cols, label) {
    if (rows * cols > 160) return this.svg(300, 120, `<rect x="40" y="20" width="220" height="80" fill="none" stroke="#7d68ff" stroke-width="2"/><text x="150" y="65" text-anchor="middle">${rows} rows × ${cols} per row</text><text x="20" y="64" text-anchor="middle" fill="#9be9ff">${rows}</text><text x="150" y="14" text-anchor="middle" fill="#9be9ff">${cols}</text>`);
    const s = Math.min(22, 280 / cols, 200 / rows); let out = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out += `<circle cx="${20 + c * s + s / 2}" cy="${24 + r * s + s / 2}" r="${s * .33}" fill="#43d6ff"/>`;
    out += `<text x="10" y="14">${esc(label || (rows + ' rows of ' + cols))}</text>`;
    return this.svg(Math.max(300, 40 + cols * s), 34 + rows * s, out);
  },
  frac(n, d, label) {
    const W = 320, w = (W - 20) / d; let out = '';
    for (let i = 0; i < d; i++) out += `<rect x="${10 + i * w}" y="24" width="${Math.max(1, w - 2)}" height="36" fill="${i < n ? '#9a5cff' : '#120c2e'}" stroke="#7d68ff"/>`;
    out += `<text x="10" y="16">${esc(label || (n + ' of ' + d + ' equal parts'))}</text>`;
    return this.svg(W, 70, out);
  },
  grid100(p, label) {
    let out = ''; for (let i = 0; i < 100; i++) { const r = Math.floor(i / 10), c = i % 10; out += `<rect x="${90 + c * 16}" y="${22 + r * 16}" width="14" height="14" fill="${i < p ? '#43d6ff' : '#120c2e'}" stroke="#5a47c8"/>`; }
    out += `<text x="170" y="15" text-anchor="middle">${esc(label || (p + ' out of 100'))}</text>`;
    return this.svg(340, 186, out);
  },
  doubling(levels, label) {
    let out = `<text x="10" y="15">${esc(label || 'each split doubles')}</text>`; const L = Math.min(levels, 5);
    for (let l = 0; l <= L; l++) { const n = 2 ** l, y = 34 + l * 30, show = Math.min(n, 16);
      for (let k = 0; k < show; k++) out += `<circle cx="${30 + k * 18}" cy="${y}" r="7" fill="#5cf2a6" opacity=".9"/>`;
      out += `<text x="${30 + show * 18 + 6}" y="${y + 4}" fill="#9be9ff">${n > 16 ? '...' : ''} ${l === 0 ? 'start' : 'split ' + l}</text>`; }
    if (levels > L) out += `<text x="10" y="${48 + (L + 1) * 30}" fill="#ece6ff">keep doubling for ${levels} splits total</text>`;
    return this.svg(400, 60 + (L + 1) * 30, out);
  },
  line(min, max, marks, label) {
    const W = 380, sx = v => 50 + (v - min) / (max - min) * (W - 100); let out = `<line x1="40" y1="40" x2="${W - 40}" y2="40" stroke="#ece6ff" stroke-width="2"/>`;
    let lastX = -999, row = 0;
    marks.forEach(m => { const x = sx(m.v), wide = String(m.t).length * 4 + 14; row = (x - lastX < wide && row === 0) ? 1 : 0; lastX = x; const y = row ? 84 : 64;
      out += `<line x1="${x}" y1="32" x2="${x}" y2="${row ? 70 : 48}" stroke="${m.c || '#43d6ff'}" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" fill="${m.c || '#9be9ff'}">${esc(m.t)}</text>`; });
    if (label) out += `<text x="${W / 2}" y="16" text-anchor="middle">${esc(label)}</text>`;
    return this.svg(W, 94, out);
  },
  box(l, w, h, u) {
    u = u || ''; const out = `<polygon points="60,70 200,70 200,150 60,150" fill="#21185a" stroke="#7d68ff" stroke-width="2"/><polygon points="60,70 100,40 240,40 200,70" fill="#2b1f72" stroke="#7d68ff" stroke-width="2"/><polygon points="200,70 240,40 240,120 200,150" fill="#171040" stroke="#7d68ff" stroke-width="2"/><text x="130" y="168" text-anchor="middle" fill="#9be9ff">length ${l}${u}</text><text x="250" y="140" fill="#9be9ff">width ${w}${u}</text><text x="10" y="114" fill="#9be9ff">h ${h}${u}</text>`;
    return this.svg(330, 178, out);
  },
  cyl(r, h, u, cone) {
    u = u || ''; const top = cone ? `<polygon points="90,30 160,150 20,150" fill="#21185a" stroke="#7d68ff" stroke-width="2"/>` : `<rect x="20" y="40" width="140" height="110" fill="#21185a" stroke="#7d68ff" stroke-width="2"/><ellipse cx="90" cy="40" rx="70" ry="14" fill="#2b1f72" stroke="#7d68ff" stroke-width="2"/>`;
    return this.svg(300, 180, `${top}<ellipse cx="90" cy="150" rx="70" ry="14" fill="none" stroke="#7d68ff" stroke-width="2"/><line x1="90" y1="150" x2="160" y2="150" stroke="#43d6ff" stroke-width="2"/><text x="125" y="172" text-anchor="middle" fill="#9be9ff">r = ${r}${u}</text><text x="180" y="100" fill="#9be9ff">h = ${h}${u}</text>`);
  },
  sphere(r, u) { return this.svg(260, 170, `<circle cx="100" cy="85" r="70" fill="#21185a" stroke="#7d68ff" stroke-width="2"/><ellipse cx="100" cy="85" rx="70" ry="16" fill="none" stroke="#5a47c8"/><line x1="100" y1="85" x2="170" y2="85" stroke="#43d6ff" stroke-width="2"/><text x="185" y="90" fill="#9be9ff">r = ${r}${u || ''}</text>`); },
  rect(l, w, u, label) { return this.svg(320, 150, `<rect x="40" y="30" width="230" height="90" fill="#123d2a" stroke="#5cf2a6" stroke-width="2"/><line x1="155" y1="30" x2="155" y2="120" stroke="#5cf2a6"/><circle cx="155" cy="75" r="16" fill="none" stroke="#5cf2a6"/><text x="155" y="142" text-anchor="middle" fill="#9be9ff">${l}${u || ''}</text><text x="20" y="80" text-anchor="middle" fill="#9be9ff">${w}${u || ''}</text>${label ? `<text x="155" y="18" text-anchor="middle">${esc(label)}</text>` : ''}`); },
  right(a, b, u, ql) { return this.svg(300, 170, `<polygon points="40,140 250,140 250,30" fill="#21185a" stroke="#7d68ff" stroke-width="2"/><rect x="236" y="126" width="14" height="14" fill="none" stroke="#43d6ff"/><text x="145" y="160" text-anchor="middle" fill="#9be9ff">${a}${u || ''}</text><text x="262" y="90" fill="#9be9ff">${b}${u || ''}</text><text x="120" y="76" fill="#ffd166">${ql || '?'}</text>`); },
  angle(a) { const r = a * Math.PI / 180, x = 150 - Math.cos(r) * 110, y = 120 - Math.sin(r) * 110;
    return this.svg(300, 140, `<line x1="20" y1="120" x2="280" y2="120" stroke="#ece6ff" stroke-width="2"/><line x1="150" y1="120" x2="${300 - x}" y2="${y}" stroke="#43d6ff" stroke-width="3"/><text x="${200}" y="112" fill="#9be9ff">${a}°</text><text x="95" y="112" fill="#ffd166">?</text><text x="150" y="138" text-anchor="middle" font-size="11" fill="#ece6ff">straight line</text>`); },
  table(rows) { return '<table>' + rows.map((r, i) => '<tr>' + r.map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join('') + '</tr>').join('') + '</table>'; },
  punnett(p1, p2) { const a = p1.split(''), b = p2.split('');
    return this.svg(240, 170, `<text x="120" y="16" text-anchor="middle">parent 1: ${p1} · parent 2: ${p2}</text><text x="95" y="42" text-anchor="middle" fill="#9be9ff">${a[0]}</text><text x="175" y="42" text-anchor="middle" fill="#9be9ff">${a[1]}</text><text x="40" y="88" fill="#9be9ff">${b[0]}</text><text x="40" y="148" fill="#9be9ff">${b[1]}</text>` +
      [[60, 52], [140, 52], [60, 112], [140, 112]].map(([x, y]) => `<rect x="${x}" y="${y}" width="74" height="54" fill="#120c2e" stroke="#7d68ff"/><text x="${x + 37}" y="${y + 33}" text-anchor="middle" fill="#ffd166">?</text>`).join(''));
  },
  timeline(segs, label) { const tot = segs.reduce((s, x) => s + x.m, 0), W = 340; let x = 10, out = `<text x="10" y="15">${esc(label || '')}</text>`;
    segs.forEach((s, i) => { const w = (W - 20) * s.m / tot; out += `<rect x="${x}" y="24" width="${Math.max(1, w - 2)}" height="30" fill="${s.c || (i % 2 ? '#5a47c8' : '#4b7bff')}"/><text x="${x + w / 2}" y="44" text-anchor="middle" font-size="11">${esc(s.t)}</text>`; x += w; });
    return this.svg(W, 64, out);
  },
  keys() { let out = ''; for (let i = 0; i < 14; i++) out += `<rect x="${10 + i * 22}" y="20" width="21" height="80" fill="#ece6ff" stroke="#5a47c8"/>`;
    [0, 1, 3, 4, 5, 7, 8, 10, 11, 12].forEach(i => out += `<rect x="${10 + i * 22 + 15}" y="20" width="13" height="50" fill="#171040"/>`);
    return this.svg(330, 118, out + `<text x="165" y="114" text-anchor="middle" fill="#9be9ff">white and black keys repeat in a pattern</text>`);
  }
};

/* ---------- mission templates ----------
   gen(r) -> params ; story/q(p) -> text ; ans(p) -> {v, tol, rel, unit, round} or {choices:[], ok:i}
   nudge(p), vis(p) -> svg/html ; steps(p) -> strings that guide WITHOUT the final result ; final(p) -> finished line (used only for the TWIN)
   mount(el,p) optional interactive widget */
const T = [];
const add = t => T.push(t);

/* ===== TOY MERCHANT ===== */
add({ id: 'toy-markup', route: 'toy', strand: 'math', tier: 1, std: S.g6rp,
  gen: r => ({ c: r.pick([6, 8, 10, 12, 14, 16, 20]), p: r.pick([10, 20, 25, 50]) }),
  story: p => `Your ZEEK AND DESTROY tees cost ${money(p.c)} each to print. You add a ${p.p}% markup so the shop makes money.`,
  q: p => 'What is the selling price of one tee?', ans: p => ({ v: p.c * (1 + p.p / 100), unit: '$', tol: .005 }),
  nudge: p => `A markup is extra money added on top of the cost. Find ${p.p}% of the cost first.`,
  vis: p => V.grid100(p.p, `${p.p}% = ${p.p} out of every 100`),
  steps: p => [`${p.p}% as a decimal is ${p.p / 100}.`, `Markup amount = ${money(p.c)} × ${p.p / 100}.`, 'Selling price = cost + markup amount.'],
  final: p => `${money(p.c)} × ${p.p / 100} = ${money(p.c * p.p / 100)}, so ${money(p.c)} + ${money(p.c * p.p / 100)} = ${money(p.c * (1 + p.p / 100))}.` });
add({ id: 'toy-zine-profit', route: 'toy', strand: 'math', tier: 1, std: S.g6ee,
  gen: r => ({ n: r.int(12, 40), s: r.pick([5, 6, 8, 10]), k: r.pick([1, 2, 3]) }),
  story: p => `You print ZEEK ZINE for ${money(p.k)} a copy and sell each one for ${money(p.s)}. At the con you sell ${p.n} copies.`,
  q: p => 'How much profit did you make?', ans: p => ({ v: p.n * (p.s - p.k), unit: '$' }),
  nudge: p => 'Profit is what you keep after paying what it cost. Figure out how much you keep on one zine.',

const KD = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
function kanjiNum(n) { // 1 .. 99,999,999 standard writing
  if (n === 0) return '零';
  let s = ''; const man = Math.floor(n / 10000), rest = n % 10000;
  const four = x => { let o = ''; [[1000, '千'], [100, '百'], [10, '十']].forEach(([v, u]) => { const d = Math.floor(x / v) % 10; if (d) o += (d === 1 ? '' : KD[d]) + u; }); if (x % 10) o += KD[x % 10]; return o; };
  if (man) s += four(man) + '万';
  if (rest) s += four(rest);
  return s;
}

/* ================= WORLD CURRENCY ================= */
const CURR = {
  JPY: { n: 'Japanese yen', sym: '¥', rate: 150, whole: true },
  KRW: { n: 'South Korean won', sym: '₩', rate: 1400, whole: true },
  MXN: { n: 'Mexican peso', sym: 'MX$', rate: 18, whole: true },
  EUR: { n: 'euro', sym: '€', rate: 0.9 },
  GBP: { n: 'British pound', sym: '£', rate: 0.8 },
  CAD: { n: 'Canadian dollar', sym: 'C$', rate: 1.4 },
  HKD: { n: 'Hong Kong dollar', sym: 'HK$', rate: 7.8 },
  CNY: { n: 'Chinese yuan', sym: 'CN¥', rate: 7.2 }
};
function rateFor(code) {
  const log = ((typeof ST !== 'undefined' && ST.rates) || []).filter(x => x.code === code).sort((a, b) => (a.date + a.t).localeCompare(b.date + b.t));
  const last = log[log.length - 1];
  return last ? { code, rate: last.rate, logged: true, date: last.date, src: last.src } : { code, rate: CURR[code].rate, logged: false };
}
function rateLine(R, used) {
  const c = CURR[R.code]; const shown = used !== undefined ? used : R.rate;
  return R.logged ? `From your RATE LOG (${R.date}${R.src ? ', ' + R.src : ''}): $1 = ${c.sym}${R.rate}.${used !== undefined && used !== R.rate ? ` Rounded for this mission: $1 = ${c.sym}${shown}.` : ''}`
    : `Practice rate: $1 = ${c.sym}${shown}. Real rates change every day. Log today's rate in the RATE LOG to use it here.`;
}
const fx = (code, v) => CURR[code].sym + (CURR[code].whole ? fmt(Math.round(v)) : (Math.round(v * 100) / 100).toFixed(2));

/* ---------- rng (seeded so REMATCH rebuilds the exact same problem) ---------- */
// mode biases integer ranges: WARM-UP draws from the low end, BEYOND from the high end. Same math, different number sizes.
const MODE_BIAS = { warm: [0, .45], steady: [0, 1], final: [.15, 1], beyond: [.5, 1] };
function RNG(seed, mode) {
  let a = seed >>> 0; const B = MODE_BIAS[mode] || [0, 1];
  const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: (lo, hi) => { const n = hi - lo + 1, a0 = Math.floor(B[0] * n), a1 = Math.max(a0 + 1, Math.ceil(B[1] * n)); return lo + a0 + Math.floor(next() * (a1 - a0)); }, pick: arr => arr[Math.floor(next() * arr.length)],
    shuffle: arr => { const b = [...arr]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; } };
}
const newSeed = () => (Math.random() * 4294967296) >>> 0;

/* ---------- audio: Web Audio synth only ---------- */
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0]; // C major pentatonic from C5
const AUD = {
  ctx: null,
  ok() { if (!ST.settings.sound) return false; try { if (!this.ctx) { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) { } this.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); }
    if (this.ctx.state !== 'running' && this.ctx.state !== 'closed') { const pr = this.ctx.resume(); if (pr && pr.catch) pr.catch(() => { }); } return true; } catch (e) { return false; } },
  tone(f, dur = .25, type = 'triangle', gain = .18, when = 0) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },
  interval(f1, f2) { this.tone(f1, .7, 'sine', .2, 0); this.tone(f2, .7, 'sine', .2, .75); this.tone(f1, 1.1, 'sine', .15, 1.6); this.tone(f2, 1.1, 'sine', .15, 1.6); },
  tap() { this.tone(880, .05, 'square', .04); },
  hint() { this.tone(660, .12, 'sine', .1); this.tone(990, .16, 'sine', .08, .08); },
  wrong() { this.tone(330, .18, 'triangle', .12); this.tone(294, .26, 'triangle', .1, .14); },
  retreat() { [784, 659, 523].forEach((f, i) => this.tone(f, .16, 'sine', .1, i * .09)); },
  jingle(pat) { (pat || ST.jingle).forEach((n, i) => { if (n >= 0) this.tone(SCALE[n], .2, 'square', .07, i * .12); }); },
  arp(i) { this.tone(SCALE[i % 5] * (i >= 5 ? 2 : 1), .22, 'sawtooth', .07); },
  sting() { [0, 2, 4].forEach(n => this.tone(SCALE[n], 1.0, 'sawtooth', .06, .05)); this.tone(SCALE[0] / 2, 1.2, 'square', .08, .05); },
  henshin() { [0, 1, 2, 3, 4].forEach((n, i) => this.tone(SCALE[n], .14, 'square', .07, i * .07)); [0, 2, 4].forEach(n => this.tone(SCALE[n] * 2, 1.1, 'sawtooth', .05, .4)); }
};

/* ---------- mix bus ----------

  (cells || []).forEach((lane, l) => lane.forEach((id, s) => { if (!id) return; const nid = migrateId(id, l), x = SID(nid); if (!x) return;
    if (isTone(x)) { const row = 8 + LANE_SEMI.indexOf(x.semi); nc[row >= 8 ? row : 8 + l][s] = nc[row >= 8 ? row : 8 + l][s] || nid; } else if (!nc[x.i][s]) nc[x.i][s] = nid; })); return nc; }
function migrateLive(lv) { if (!lv) return lv; ['beats', 'mel'].forEach(k => { if (Array.isArray(lv[k])) lv[k] = lv[k].map(a => a ? a.map(id => migrateId(id)) : a); });
  ['free', 'hits'].forEach(k => { if (Array.isArray(lv[k])) lv[k].forEach(e => { e.id = migrateId(e.id, e.l); }); }); if (lv.log) delete lv.log; lv.fx = lv.fx || []; return lv; }
function migratePattern(p) { if (!p || !p.cells) return p; if (p.kind === 'beat') p.cells = p.cells.map(r => r.map(id => migrateId(id)));
  else { p.cells = migrateComp(p.cells); p.kind = 'comp'; p.bars = Math.max(1, Math.round((p.cells[0] || []).length / 16)); p.len = 16 * p.bars; }
  if (p.live) migrateLive(p.live); return p; }
function migrateSound18() { if (ST.snd18) return; try {
    if (ST.celebration && ST.celebration.cells) { if (!ST.celebration.kind) ST.celebration.kind = ST.celebration.from === 'beat' ? 'beat' : 'comp'; migratePattern(ST.celebration); }
    (ST.beats || []).forEach(b => migratePattern(b)); if (ST.jam) migrateLive(ST.jam); } catch (e) { }
  ST.snd18 = 1; save(); }

/* ---------- victory jingle ---------- */
function defaultCelebration() { const c = blank(16, 16), put = (l, s, id) => c[l][s] = id;
  [0, 6, 8, 11].forEach(s => put(0, s, 'toku:0')); [4, 12].forEach(s => put(1, s, 'toku:1')); [0, 2, 4, 6, 8, 10, 12, 14].forEach(s => put(3, s, 'toku:3')); put(2, 15, 'toku:2'); put(6, 0, 'toku:6');
  [[0, 0], [3, 1], [6, 2], [10, 3], [13, 2]].forEach(([s, r]) => put(8 + r, s, withSemi('toku:10', LANE_SEMI[r]))); put(8 + 5, 0, withSemi('toku:9', LANE_SEMI[5]));
  return { kind: 'comp', bpm: 118, bars: 1, len: 16, cells: c }; }
function celebration() {
  if (!ST.celebration || !ST.celebration.cells) { const d = defaultCelebration();
    if (Array.isArray(ST.jingle) && JSON.stringify(ST.jingle) !== JSON.stringify(DEFAULT_JINGLE)) { for (let r = 8; r < 16; r++) d.cells[r].fill(''); ST.jingle.forEach((n, i) => { if (n >= 0) d.cells[8 + Math.min(7, 3 + n)][i * 2] = migrateId('mel:' + n); }); }
    ST.celebration = d; }
  return ST.celebration; }
AUD.jingle = () => SEQ.start(celebration(), { once: true });
const CELEBRATE = { start() { SEQ.start(celebration()); }, stop() { if (SEQ.playing) SEQ.stop(); } };
function onSteps(el, fn) { const f = (s, L) => { if (!el.isConnected) { SEQ.listeners.delete(f); return; } fn(s, L); }; SEQ.listeners.add(f); }

/* ---------- shared UI ---------- */
const PICK = { sid: null };
function kitBar(el, cur, onKit) { el.classList.add('kit5'); el.innerHTML = KITS.map(k => `<button class="kitbtn ${k.id === cur ? 'on' : ''}" data-kit="${k.id}" style="--kc:${k.col}">${k.name.replace(' ', '<br>')}</button>`).join(''); el.querySelectorAll('[data-kit]').forEach(b => b.onclick = () => { AUD.tap(); onKit(b.dataset.kit); }); }
function chipStyle(x) { const c = colOf(x); return `--kc:${c.bg};--kt:${c.fg}`; }
// chips: drag a sound onto a step, or tap to select it. only: 'tones' shows the melodic section only
function chipRow(el, kitId, onPlace, only) {
  const kit = KIT(kitId), idx = only === 'tones' ? kit.toneIdx : kitOrder(kit);
  el.innerHTML = (only !== 'tones' && kit.d.length ? `<span class="chiplab">DRUMS</span>` : '') + idx.map(i => { const s = kit.s[i], x = SID(`${kit.id}:${i}`); return `${i === 8 && only !== 'tones' && kit.d.length ? '<span class="chiplab">MELODIC</span>' : ''}<button class="chip ${i >= 8 ? 'tone' : 'drum'} ${PICK.sid === kit.id + ':' + i ? 'armed' : ''}" data-sid="${kit.id}:${i}" style="${chipStyle(x)}" aria-label="${s[0]}">${s[0]}</button>`; }).join('');
  el.querySelectorAll('.chip').forEach(ch => {
    ch.onpointerdown = e => { e.preventDefault(); const sid = ch.dataset.sid, x = SID(sid); let ghost = null; const x0 = e.clientX, y0 = e.clientY; playSid(sid); try { ch.setPointerCapture(e.pointerId); } catch (_) { }
      const move = ev => { if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) { ghost = document.createElement('div'); ghost.className = 'chipghost'; ghost.textContent = ch.textContent; ghost.setAttribute('style', chipStyle(x)); document.body.appendChild(ghost); }
        if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; } };
      const up = ev => { ch.removeEventListener('pointermove', move); ch.removeEventListener('pointerup', up); ch.removeEventListener('pointercancel', up);
        if (ghost) { ghost.remove(); const tgt = document.elementFromPoint(ev.clientX, ev.clientY); const cell = tgt && tgt.closest('[data-cell]'); if (cell) onPlace(cell, sid, true); }
        else { PICK.sid = PICK.sid === sid ? null : sid; el.querySelectorAll('.chip').forEach(c => c.classList.toggle('armed', c.dataset.sid === PICK.sid)); if (el.onPick) el.onPick(PICK.sid); } };
      ch.addEventListener('pointermove', move); ch.addEventListener('pointerup', up); ch.addEventListener('pointercancel', up); };
  });
}
function cellLabel(id) { const x = SID(id); return x ? `<span style="${chipStyle(x)}">${x.s[1]}${x.semi !== null ? `<small>${semiName(x.semi)}</small>` : ''}</span>` : ''; }

/* ---------- TIMINGS (one bar each). Every session starts in 4/4. The others unlock one by one (HENSHIN). ----------
   One step = one sixteenth note. 3/4 = 12 steps, 6/8 = 12 (2 groups of 3 eighths), 5/4 = 20, 9/8 = 18, 12/8 = 24.
   v1.8: bars (1, 2 or 4) replace the old 2 BARS timing. */
const TIMINGS = [
  { id: '44', name: '4/4', len: 16, grp: 4, feel: '4 beats of 4 steps. Home base.' },
  { id: '34', name: '3/4', len: 12, grp: 4, feel: '3 beats of 4 steps. A waltz feel: ONE two three.' },
  { id: '68', name: '6/8', len: 12, grp: 6, feel: '6 eighth notes felt as 2 big beats of 3. A rolling, swaying feel.' },
  { id: '54', name: '5/4', len: 20, grp: 4, feel: '5 beats of 4 steps. One extra beat makes it lean forward.' },
  { id: '98', name: '9/8', len: 18, grp: 6, feel: '9 eighth notes felt as 3 big beats of 3.' },
  { id: '128', name: '12/8', len: 24, grp: 6, feel: '12 eighth notes felt as 4 big beats of 3. A shuffle feel.' }
];
const TIMING = id => TIMINGS.find(x => x.id === id) || TIMINGS[0];
function fracsFor(len) { const out = []; for (let d = 2; d <= len / 2; d++) if (len % d === 0) out.push(d); return out; }
function equivLine(d, len) { const parts = [`1/${d}`]; for (let k = 2; k * d <= len; k++) if (len % (k * d) === 0) parts.push(`${k}/${k * d}`); return parts.join(' = '); }
function gridCols(len, grp, wide) { const max = wide ? 24 : 16; return len <= max ? len : grp * Math.floor(max / grp); }
function barsBar(el, cur, onPick) { el.innerHTML = `<span class="sub">BARS</span><span class="seg">${[1, 2, 4].map(b => `<button class="${b === cur ? 'on' : ''}" data-bars="${b}">${b}</button>`).join('')}</span>`; el.querySelectorAll('[data-bars]').forEach(b => b.onclick = () => { AUD.tap(); onPick(+b.dataset.bars); }); }

/* ---------- tap vs hold, and the note picker ---------- */
function holdable(b, onTap, onHold) { let tmr = null, held = false, x0 = 0, y0 = 0;
  b.onpointerdown = e => { held = false; x0 = e.clientX; y0 = e.clientY; clearTimeout(tmr); tmr = setTimeout(() => { held = true; onHold(); }, 450); };
  b.onpointermove = e => { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 10) clearTimeout(tmr); };
  b.onpointerup = b.onpointercancel = b.onpointerleave = () => clearTimeout(tmr);
  b.oncontextmenu = e => e.preventDefault();
  b.onclick = () => { if (held) { held = false; return; } onTap(); }; }
function pitchPop(b, id, label, onPick) { const x = SID(id); if (!x) return; const lay = layout(), cur = x.semi;
  const opts = [...(isTone(x) ? [] : [[x.base, 'ORIGINAL']]), ...lay.semis.map((s, i) => [withSemi(x.base, s), lay.names[i]])];
  document.querySelectorAll('.pitchpop').forEach(p => p.remove());
  const pop = document.createElement('div'); pop.className = 'pitchpop'; pop.style.setProperty('--kc', colOf(x).bg);
  pop.innerHTML = `<div class="row"><b>${x.s[0]}</b><span class="sub">${label}: pick a note</span><span class="grow"></span><button class="btn ghost small" data-x>DONE</button></div><div class="pitchgrid">${opts.map(([v, nm]) => `<button data-id="${v}" class="${v === id || (cur === null && v === x.base) ? 'on' : ''}">${nm}</button>`).join('')}</div>`;
  document.body.appendChild(pop); const r = b.getBoundingClientRect(); pop.style.top = Math.max(8, Math.min(innerHeight - pop.offsetHeight - 8, r.bottom + 8)) + 'px';
  const close = () => { pop.remove(); removeEventListener('pointerdown', outside, true); };
  const outside = e => { if (!pop.contains(e.target)) close(); };
  setTimeout(() => addEventListener('pointerdown', outside, true), 0);
  pop.querySelector('[data-x]').onclick = close;
  pop.querySelectorAll('[data-id]').forEach(o => o.onclick = () => { onPick(o.dataset.id); pop.querySelectorAll('[data-id]').forEach(q => q.classList.toggle('on', q === o)); }); }

/* ---------- BEAT GRID: one row of steps. Lab: timings, bars, fraction outlines (in every bar), hold to pick a note, live play ---------- */
const BEAT = {
  pref: null,
  stop() { SEQ.stop(); },
  mountGrid(el, lab, cfg = {}) {
    const ld = lab ? BEAT.load || (BEAT.pref ? null : BEAT.session) : null; BEAT.load = null; if (ld && ld.timing) BEAT.pref = BEAT.pref || ld.timing; // the lab grid comes back as he left it
    let tm = TIMING(cfg.timing || (lab && BEAT.pref && (ST.timings || []).includes(BEAT.pref) ? BEAT.pref : '44')); BEAT.pref = null;
    let bars = lab ? (ld && ld.bars) || 2 : 1; // missions keep one bar so their math stays the same
    const L = () => tm.len * bars;
    let row = Array(L()).fill(''), bpm = 100, kit = 'toku', frac = 0;
    if (ld && ld.cells && ld.cells[0]) { row = Array(L()).fill('').map((_, i) => ld.cells[0][i] || ''); bpm = ld.bpm || 100; }
    const pat = { kind: 'beat', get bpm() { return bpm; }, set bpm(v) { bpm = v; }, get len() { return L(); }, get bars() { return bars; }, get cells() { return [row]; }, get timingId() { return tm.id; } };
    if (lab) { Object.defineProperty(pat, 'live', { get: () => JAM.live() }); JAM.shown = pat; }
    const unlocked = TIMINGS.filter(x => (ST.timings || ['44']).includes(x.id));
    el.innerHTML = `${lab ? `<div class="tmbar"><span class="sub">TIMING</span><div class="row tms"></div></div><div class="tmbar barsbar"></div>` : ''}<div class="kitbar"></div><div class="chips"></div>
      ${lab ? `<div class="fracbar"><span class="sub">FRACTIONS</span><div class="row frs"></div><div class="mono frline"></div></div>` : ''}
      <div class="grid16"></div>
      <div class="row"><button class="btn cyan small" data-beat="play">&#9654; PLAY</button><button class="btn ghost small" data-beat="clr">CLEAR</button>${lab ? '<button class="btn ghost small" data-beat="rnd">RANDOMIZE</button>' : ''}<span class="mono sub" data-beat="count"></span>${lab ? `<span class="grow"></span><label class="mono sub">BPM <input type="range" min="60" max="160" value="${bpm}" data-beat="bpm" style="width:140px;vertical-align:middle"></label><span class="mono" data-beat="bv">${bpm}</span>` : ''}</div>
      <p class="note">Drag a sound onto a step, or tap a sound and then tap steps. Tap a filled step to clear it. Hold a filled step to pick its note.</p>
      <div class="padsbox"></div>`;
    const grid = el.querySelector('.grid16'), pb = el.querySelector('[data-beat=play]');
    const resize = () => { const old = row; row = Array(L()).fill('').map((_, i) => old[i] || ''); if (lab) JAM.fit(); };
    const drawTm = () => { if (!lab) return; el.querySelector('.tms').innerHTML = unlocked.map(x => `<button class="kitbtn ${x.id === tm.id ? 'on' : ''}" data-tm="${x.id}">${x.name}</button>`).join('') + (tm.id !== '44' ? '<button class="btn ghost small" data-tm="44">SNAP BACK TO 16</button>' : '');
      el.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => setTm(b.dataset.tm));
      barsBar(el.querySelector('.barsbar'), bars, b => { bars = b; resize(); drawTm(); drawGrid(); });
      const fr = fracsFor(tm.len); el.querySelector('.frs').innerHTML = fr.map(d => `<button class="kitbtn fbtn ${frac === d ? 'on' : ''}" data-fr="${d}">1/${d}</button>`).join('') + `<button class="kitbtn fbtn ${frac === 1 ? 'on' : ''}" data-fr="1">WHOLE</button>`;
      el.querySelectorAll('[data-fr]').forEach(b => b.onclick = () => { const d = +b.dataset.fr; frac = frac === d ? 0 : d; AUD.tap(); drawTm(); drawGrid(); });
      el.querySelector('.frline').innerHTML = frac ? (frac === 1 ? `WHOLE BAR = ${tm.len}/${tm.len} = all ${tm.len} steps` : `${equivLine(frac, tm.len)} &rarr; ${tm.len / frac} of ${tm.len} steps in each bar`) : `${tm.name}: ${tm.feel}${bars > 1 ? ` · ${bars} bars = ${L()} steps` : ''}`; };
    const setTm = id => { if (id === tm.id) return; tm = TIMING(id); resize(); frac = 0; AUD.tap(); drawTm(); drawGrid(); };
    const inFrac = i => { const n = frac === 1 ? tm.len : frac ? tm.len / frac : 0; return (i % tm.len) < n; };
    const drawGrid = () => { const cols = gridCols(tm.len, tm.grp, el.clientWidth >= 620);
      grid.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
      grid.innerHTML = row.map((id, i) => `<button aria-label="step ${i + 1}" data-cell="${i}" data-s="${i}" class="${i % tm.grp === 0 ? 'q' : ''} ${Math.floor((i % tm.len) / tm.grp) % 2 ? 'g1' : ''} ${i > 0 && i % tm.len === 0 ? 'barl' : ''} ${inFrac(i) ? 'fr' : ''} ${id ? 'on' : ''}">${cellLabel(id)}</button>`).join('');
      grid.querySelectorAll('[data-cell]').forEach(bindCell); el.querySelector('[data-beat=count]').textContent = row.filter(Boolean).length + ' of ' + L() + ' steps on';
      if (lab) BEAT.session = { timing: tm.id, bars, bpm, cells: [row.slice()] }; };
    const draw = drawGrid;
    const bindCell = b => { const i = +b.dataset.cell; holdable(b, () => { if (PICK.sid && row[i] !== PICK.sid) { row[i] = PICK.sid; playSid(PICK.sid); } else row[i] = ''; draw(); }, () => pitchPicker(b, i)); };
    const pitchPicker = (b, i) => { if (!row[i]) { if (PICK.sid) { row[i] = PICK.sid; draw(); b = grid.querySelector(`[data-cell="${i}"]`); } else { toast('Put a sound on this step first, then hold it to pick a note.'); return; } }
      pitchPop(b, row[i], `step ${i + 1}`, v => { row[i] = v; playSid(v); draw(); }); };
    const place = (cell, sid) => { const i = +cell.dataset.cell; row[i] = sid; draw(); };
    const kits = () => { kitBar(el.querySelector('.kitbar'), kit, k => { kit = k; kits(); PADS.mount(el.querySelector('.padsbox'), kit, { live: lab, host: 'beat' }); }); chipRow(el.querySelector('.chips'), kit, place); };
    kits();
    el.querySelector('[data-beat=clr]').onclick = () => { row.fill(''); JAM.origin = null; draw(); };
    const rb = el.querySelector('[data-beat=rnd]'); if (rb) rb.onclick = () => { JAM.origin = null; const k = KIT(kit), d = k.drumIdx.length ? k.drumIdx : k.toneIdx; row = Array(L()).fill('').map((_, i) => i % tm.grp === 0 ? kit + ':' + d[0] : Math.random() < .45 ? kit + ':' + kitOrder(k)[1 + Math.floor(Math.random() * (kitOrder(k).length - 1))] : ''); draw(); };
    const bpmEl = el.querySelector('[data-beat=bpm]'); if (bpmEl) bpmEl.oninput = () => { bpm = +bpmEl.value; el.querySelector('[data-beat=bv]').textContent = bpm; if (BEAT.session) BEAT.session.bpm = bpm; };
    pb.onclick = () => { if (SEQ.playing && SEQ.pat === pat) { SEQ.stop(); return; } if (lab) { JAM.main = pat; JAM.fit(); } SEQ.start(pat); };
    onSteps(el, (s) => { const mine = SEQ.pat === pat && s >= 0; pb.innerHTML = mine ? '■ STOP' : '&#9654; PLAY';
      grid.querySelectorAll('[data-cell]').forEach((b, i) => b.classList.toggle('now', mine && i === s));
      grid.classList.toggle('frglow', mine && frac > 0 && inFrac(s)); });
    PADS.mount(el.querySelector('.padsbox'), kit, { live: lab, host: 'beat' });
    drawTm(); draw();
    addEventListener('resize', () => { if (el.isConnected) draw(); });
  }
};

/* ---------- COMPOSER: two stacked grids, always visible together.
   DRUMS: one row per drum pad of the kit. MELODY: note rows, LOW C at the bottom to HIGH E+ at the top. Both play together.
   Every edit is autosaved, so nothing is lost if the page reloads. ---------- */
const COMP_ROWS = 16; // rows 0-7 drums, rows 8-15 melody (8 = low C ... 15 = high E+)
const COMPOSER = {
  stop() { SEQ.stop(); },
  mount(el) {
    let src = COMPOSER.load || ST.compDraft || celebration(); COMPOSER.load = null;
    if (!src.cells || src.cells.length !== COMP_ROWS || src.kind !== 'comp') src = defaultCelebration();
    let bars = src.bars || Math.max(1, Math.round(src.cells[0].length / 16));
    const srcLen = src.cells[0].length || 16, fresh = !ST.compDraft && !src.id; if (fresh && bars < 2) bars = 2; // a new Composer session starts at 2 bars (bar 1 repeats)
    let pat = { kind: 'comp', bpm: src.bpm, bars, len: 16 * bars, cells: src.cells.map(r => Array(16 * bars).fill('').map((_, i) => r[i] || (fresh ? r[i % srcLen] || '' : ''))) }, kit = 'toku', page = 0;
    Object.defineProperty(pat, 'live', { get: () => JAM.live() }); JAM.shown = pat;
    const narrow = () => el.clientWidth < 620, pageSize = () => narrow() ? 8 : 16;
    let saveT = null; const autosave = () => { if (saveT) return; saveT = setTimeout(() => { saveT = null; ST.compDraft = { kind: 'comp', bpm: pat.bpm, bars, len: pat.len, cells: pat.cells.map(r => r.slice()) }; save(); }, 250); }; // saves within a quarter second of any edit, even mid-flurry
    el.innerHTML = `<p class="sub">Two grids, one loop. The DRUMS grid has a row for each drum. The MELODY grid has a row for each note, low at the bottom, high at the top. This loop is your victory celebration.</p>
      <div class="kitbar"></div><div class="tmbar barsbar"></div>
      <div class="banner cbanner"></div>
      <div class="row pagebar"></div>
      <h3 class="gridttl">DRUMS</h3><div class="comp cdrums"></div>
      <h3 class="gridttl">MELODY</h3><div class="chips"></div><div class="comp cmel"></div>
      <div class="row" style="margin-top:8px"><button class="btn cyan small" id="cPlay">&#9654; PLAY</button><button class="btn ghost small" id="cRnd">RANDOMIZE</button><button class="btn ghost small" id="cClr">CLEAR</button>
        <label class="mono sub">BPM <input type="range" min="70" max="160" value="${pat.bpm}" id="cBpm" style="width:120px;vertical-align:middle"></label><span class="mono" id="cBv">${pat.bpm}</span></div>
      <div class="row" style="margin-top:8px"><button class="btn primary small" id="cSave">SET AS VICTORY JINGLE</button><button class="btn ghost small" id="cReset">DEFAULT</button></div>
      <p class="note">DRUMS: tap a square to add that drum, tap again to clear. MELODY: pick a sound above the melody grid, then tap a note square. Hold any filled square to pick a different note. RANDOMIZE builds a new loop from the kit you have selected.</p><div class="padsbox"></div>`;
    const cd = el.querySelector('.cdrums'), cm = el.querySelector('.cmel'), banner = el.querySelector('.cbanner');
    const melSel = () => { const x = PICK.sid && SID(PICK.sid); return x && isTone(x) ? x.base : `${kit}:${KIT(kit).toneIdx[0]}`; };
    const setBanner = () => { const x = SID(melSel()); banner.innerHTML = `<b>DRUMS:</b> tap a square to add a ${KIT(kit).name} drum. <b>MELODY:</b> <span class="bsel" style="${chipStyle(x)}">${x.s[0]}</span> selected. Tap note squares to place it.`; };
    const header = steps => `<div class="hd"></div>${steps.map(s => `<div class="hd">${s % 4 === 0 ? (s % 16 === 0 && bars > 1 ? `BAR ${s / 16 + 1} · ` : '') + 'BEAT ' + ((s % 16) / 4 + 1) : ''}</div>`).join('')}`;
    const draw = () => { const ps = pageSize(), pages = pat.len / ps; if (page >= pages) page = 0; const steps = [...Array(ps).keys()].map(i => i + page * ps);
      el.querySelector('.pagebar').innerHTML = pages > 1 ? [...Array(pages).keys()].map(p => `<button class="btn ghost small ${p === page ? 'on' : ''}" data-pg="${p}">STEPS ${p * ps + 1}-${(p + 1) * ps}</button>`).join('') : '';
      el.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { page = +b.dataset.pg; draw(); });
      const cols = `64px repeat(${steps.length},minmax(0,1fr))`; cd.style.gridTemplateColumns = cols; cm.style.gridTemplateColumns = cols;
      const k = KIT(kit), cell = r => s => `<button data-cell="${r}:${s}" data-step="${s}" class="${s % 4 === 0 ? 'q' : ''} ${s > 0 && s % 16 === 0 ? 'barl' : ''} ${pat.cells[r][s] ? 'on' : ''}" aria-label="row ${r + 1} step ${s + 1}">${cellLabel(pat.cells[r][s])}</button>`;
      cd.innerHTML = header(steps) + (k.d.length ? k.d.map((d, r) => `<div class="nl">${d[0]}</div>` + steps.map(cell(r)).join('')).join('') : `<div class="nl"></div><div class="sub" style="grid-column:2/-1;padding:6px">MELODY has no drums. Pick another kit to add drums.</div>`);
      cm.innerHTML = header(steps) + [7, 6, 5, 4, 3, 2, 1, 0].map(l => `<div class="nl">${l === 7 ? 'HIGH ' : l === 0 ? 'LOW ' : ''}${NOTE_NAMES[l]}</div>` + steps.map(cell(8 + l)).join('')).join('');
      el.querySelectorAll('.comp [data-cell]').forEach(b => { const [r, s] = b.dataset.cell.split(':').map(Number);
        holdable(b, () => tap(r, s), () => { if (!pat.cells[r][s]) tap(r, s); if (!pat.cells[r][s]) return; pitchPop(el.querySelector(`[data-cell="${r}:${s}"]`), pat.cells[r][s], `step ${s + 1}`, v => { pat.cells[r][s] = v; playSid(v, undefined, undefined); autosave(); draw(); }); }); });

/* ---------- SHARE BEAT (v1.9): a small file with the beat and its learning trail, sent through the device share sheet.
   Only when the Guider switch "Allow sharing beats" is on. Journal notes are never in it. Opening a shared beat adds it to MY BEATS;
   saving it again after changes adds a "remix" step to its trail. ---------- */
const SHARE = {
  entry(sess, act) { const L = sess.len || 16, lit = MYBEATS.lit(sess).filter(Boolean).length, lv = sess.live || {};
    const kits = [...new Set([].concat(...(sess.cells || [])).filter(Boolean).map(id => { const x = SID(id); return x ? x.kit.name : null; }).filter(Boolean))];

  line(e) { return `${e.act === 'remix' ? 'Remixed' : 'Made'} by ${e.who} on ${e.date}: ${e.timing}, ${e.bars} bar${e.bars > 1 ? 's' : ''}, ${e.bpm} BPM, ${e.lit} of ${e.steps} steps with sound (${e.lit ? fracStr(e.lit / e.steps) : '0'})${(e.kits || []).length ? ', ' + e.kits.join(' + ') : ''}${(e.fx || []).length ? ', FX: ' + e.fx.join(' + ') : ''}${e.hits ? ', ' + e.hits + ' live hits' : ''}.`; },
  text(b) { const lv = b.live ? { beats: b.live.beats, mel: b.live.mel, free: b.live.free, fx: b.live.fx, hits: b.live.hits, on: b.live.on } : null;
    return JSON.stringify({ app: 'ALIEN HERO MATHSCAPES', format: 1, kind: 'beat', name: b.name, beat: { kind: b.kind, bpm: b.bpm, len: b.len, bars: b.bars, timing: b.timing, cells: b.cells, live: lv }, trail: b.trail || [] }); },
  fileName(b) { return `${String(ST.name || 'hero').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-beat-${today()}.json`; },
  async send(b) { if (!ST.allowShare) { toast('Sharing is off. A grown-up can turn it on in the Guider.'); return; }
    const name = this.fileName(b), blob = new Blob([this.text(b)], { type: 'application/json' }); this.last = null;
    try { const f = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: b.name }); this.last = 'share'; return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
    if (window.self !== window.top) toast('Sharing files is blocked inside this preview. Open the app from its own link to share.');

  // opening a file someone sent: keep only what a beat can hold
  read(text) { let o; try { o = JSON.parse(text); } catch (_) { return null; }
    if (!o || o.app !== 'ALIEN HERO MATHSCAPES' || o.kind !== 'beat' || !o.beat || typeof o.beat !== 'object') return null;
    const B = o.beat, num = (v, lo, hi, d) => { v = +v; return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }, okId = id => typeof id === 'string' && id.length < 24 && !!SID(id);
    const kind = ['beat', 'comp', 'none'].includes(B.kind) ? B.kind : 'beat', len = Math.round(num(B.len, 1, 128, 16)), bars = Math.round(num(B.bars, 1, 4, 1));
    const cells = (Array.isArray(B.cells) ? B.cells : []).slice(0, 16).map(r => Array.from({ length: len }, (_, i) => Array.isArray(r) && okId(r[i]) ? r[i] : ''));

      fx: (Array.isArray(L0.fx) ? L0.fx : []).filter(e => e && FX.names.includes(e.fx)).slice(0, 64).map(e => ({ fx: e.fx, p0: num(e.p0, 0, 1, 0), p1: num(e.p1, 0, 1, 1), seed: Math.round(num(e.seed, 0, 4294967295, 1)) })),
      hits: (Array.isArray(L0.hits) ? L0.hits : []).filter(e => e && okId(e.id)).slice(0, 400).map(e => ({ id: e.id, p: num(e.p, 0, .9999, 0), free: !!e.free })),
      on: Object.fromEntries(['grid', 'beats', 'mel', 'free', 'fx'].map(k => [k, !(L0.on && L0.on[k] === false)])) };
    const str = (v, n) => String(v == null ? '' : v).slice(0, n);
    const trail = (Array.isArray(o.trail) ? o.trail : []).slice(-40).map(e => ({ act: e && e.act === 'remix' ? 'remix' : 'made', who: str(e && e.who, 24) || 'HERO', date: str(e && e.date, 10), app: str(e && e.app, 8),
      timing: str(e && e.timing, 5), bars: Math.round(num(e && e.bars, 1, 4, 1)), bpm: Math.round(num(e && e.bpm, 40, 220, 100)), steps: Math.round(num(e && e.steps, 1, 128, 16)), lit: Math.round(num(e && e.lit, 0, 128, 0)),
      kits: (e && Array.isArray(e.kits) ? e.kits : []).map(k => str(k, 16)).slice(0, 5), fx: (e && Array.isArray(e.fx) ? e.fx : []).map(k => str(k, 10)).slice(0, 3), hits: Math.round(num(e && e.hits, 0, 999, 0)) }));
    const tm = TIMINGS.some(t => t.id === B.timing) ? B.timing : null;
    return { kind, bpm: Math.round(num(B.bpm, 40, 220, 100)), len, bars, timing: tm, cells, live, trail, shared: true, name: ('SHARED · ' + str(o.name, 60)).slice(0, 70) }; }

/* ---------- EXPORT: render exactly one loop offline, recorded FX included (the tail wraps to the start so the file loops cleanly) ---------- */
const EXPORT = {
  busy: false,
  async render(m) { const sr = 44100, L = SEQ.lenOf(m), sp = 60 / m.bpm / 4, dur = L * sp, tail = 4, N = Math.round(dur * sr);
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext; const off = new Off(2, N + tail * sr, sr);
    const keys = ['bus', 'master', 'noise', 'rev', 'revIn', 'dly', 'dlyIn', 'fxIn', 'whLP', 'whSend', 'whDly', 'whFb', 'whTone', 'routes'];
    const keep = { ctx: AUD.ctx, ready: SND.ready, f: {}, held: FX.held, vl: VLIM.list, vmax: VLIM.max }; keys.forEach(k => keep.f[k] = SND[k]);
    try { AUD.ctx = off; SND.build(off); SND.ready = true; FX.held = {}; VLIM.list = []; VLIM.max = 1e6; const mv = mixVals();
      [['drums', mv.drums], ['melodic', mv.melodic], ['live', mv.live]].forEach(([k, v]) => { const g = Math.pow(v / 80, 1.6); ['dry', 'rev', 'dly'].forEach(n => SND.routes[k][n].gain.value = g); });
      let whOn = null;
      for (let s = 0; s < L; s++) { const t = .003 + s * sp, wh = fxActive(m, s, L).wormhole;
        if (wh && wh.rec && whOn !== wh.rec) { WH.engage(t, wh.seed, m.bpm); whOn = wh.rec; } else if (!wh && whOn) { WH.release(t); whOn = null; }
        resolveStep(m, s, t, sp, L).forEach(([id, tt, li, ch]) => playSid(id, tt, li, ch)); }
    } finally { AUD.ctx = keep.ctx; Object.assign(SND, keep.f); SND.ready = keep.ready; FX.held = keep.held; VLIM.list = keep.vl; VLIM.max = keep.vmax; }
    const buf = await off.startRendering(); const ch = [buf.getChannelData(0), buf.getChannelData(1)].map(d => { const o = new Float32Array(N); for (let i = 0; i < d.length; i++) o[i % N] += d[i]; return o; });
    let peak = 0; ch.forEach(d => { for (let i = 0; i < N; i++) peak = Math.max(peak, Math.abs(d[i])); }); if (peak > .98) ch.forEach(d => { for (let i = 0; i < N; i++) d[i] *= .98 / peak; });
    return { ch, sr, N, L }; },
  pcm(d) { const o = new Int16Array(d.length); for (let i = 0; i < d.length; i++) { const v = Math.max(-1, Math.min(1, d[i])); o[i] = v < 0 ? v * 32768 : v * 32767; } return o; },
  wav({ ch, sr, N }) { const b = new ArrayBuffer(44 + N * 4), v = new DataView(b), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + N * 4, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, N * 4, true);
    const l = this.pcm(ch[0]), r = this.pcm(ch[1]); for (let i = 0, o = 44; i < N; i++, o += 4) { v.setInt16(o, l[i], true); v.setInt16(o + 2, r[i], true); } return new Blob([b], { type: 'audio/wav' }); },
  lame() { return new Promise((res, rej) => { if (window.lamejs) return res(); const s = document.createElement('script'); s.src = 'js/lame.min.js'; s.onload = () => window.lamejs ? res() : rej(); s.onerror = rej; document.head.appendChild(s); }); },
  async mp3({ ch, sr, N }) { await this.lame(); const enc = new lamejs.Mp3Encoder(2, sr, 192), l = this.pcm(ch[0]), r = this.pcm(ch[1]), parts = [];
    for (let i = 0; i < N; i += 1152) { const o = enc.encodeBuffer(l.subarray(i, i + 1152), r.subarray(i, i + 1152)); if (o.length) parts.push(new Uint8Array(o)); }
    const e = enc.flush(); if (e.length) parts.push(new Uint8Array(e)); return new Blob(parts, { type: 'audio/mpeg' }); },
  save(blob, name) { const a = document.createElement('a'), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); },
  async go(kind) { if (this.busy) return; this.busy = true; toast('Building your loop…'); try { const m = JAM.pat(), r = await this.render(m), name = `mathscapes-loop-${m.bpm}bpm-${r.L}steps.${kind}`;
      this.last = { kind, bytes: 0, name }; const blob = kind === 'mp3' ? await this.mp3(r) : this.wav(r); this.last.bytes = blob.size; this.save(blob, name); toast('Saved ' + name); }
    catch (e) { toast(kind === 'mp3' ? 'MP3 export could not load here. Try .WAV.' : 'Export did not work on this device.'); } finally { this.busy = false; } }
};
